<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">依頼の帯から日程を変える流れ</title>
  <desc id="d">画面の依頼の帯に依頼を書くと、見張り中の Claude Code が変更案を作る。画面で変更案を確認し、承認すると data.json の期限が更新される。却下すると何も変わらない。修正を依頼すると、変更案を作り直す。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- レーン -->
  <rect x="10" y="20" width="980" height="170" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="22" y="44" font-size="17" font-weight="bold" fill="#0c4a6e">画面（pj-lens.html）</text>
  <rect x="10" y="210" width="980" height="170" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="22" y="368" font-size="17" font-weight="bold" fill="#7c2d12">Claude Code（/pj-lens:watch を実行中）</text>

  <!-- 1 -->
  <rect x="30" y="70" width="210" height="100" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="135" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">① 依頼を書く</text>
  <text x="135" y="124" text-anchor="middle" font-size="16" fill="#1e293b">依頼の帯に文章で</text>
  <text x="135" y="146" text-anchor="middle" font-size="16" fill="#1e293b">「A3 が 5 日遅れた」</text>

  <!-- 2 -->
  <rect x="300" y="260" width="230" height="100" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="415" y="288" text-anchor="middle" font-size="18" font-weight="bold" fill="#7c2d12">② 変更案を作る</text>
  <text x="415" y="314" text-anchor="middle" font-size="16" fill="#1e293b">数秒で、影響を受ける</text>
  <text x="415" y="336" text-anchor="middle" font-size="16" fill="#1e293b">タスクの新期限を計算</text>

  <!-- 3 -->
  <rect x="590" y="70" width="190" height="100" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="685" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">③ 変更案を確認</text>
  <text x="685" y="124" text-anchor="middle" font-size="16" fill="#1e293b">帯の履歴に、</text>
  <text x="685" y="146" text-anchor="middle" font-size="16" fill="#1e293b">旧期限と新期限の表</text>

  <!-- 4 -->
  <rect x="830" y="70" width="150" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="905" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">④ 反映</text>
  <text x="905" y="124" text-anchor="middle" font-size="16" fill="#14532d">期限を更新し、</text>
  <text x="905" y="146" text-anchor="middle" font-size="16" fill="#14532d">履歴に残す</text>

  <!-- 却下 -->
  <rect x="830" y="260" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="905" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">却下</text>
  <text x="905" y="322" text-anchor="middle" font-size="16" fill="#1e293b">何も変わらない</text>

  <!-- 矢印 -->
  <line x1="170" y1="172" x2="330" y2="256" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="206" font-size="16" fill="#1e293b">依頼を送る</text>
  <line x1="500" y1="256" x2="620" y2="174" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="236" text-anchor="end" font-size="16" fill="#1e293b">変更案</text>
  <line x1="782" y1="120" x2="826" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="804" y="108" text-anchor="middle" font-size="16" fill="#1e293b">承認</text>
  <line x1="780" y1="160" x2="850" y2="256" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="846" y="232" font-size="16" fill="#1e293b">却下</text>
  <path d="M640,172 C640,215 560,230 534,300" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="580" y="304" font-size="16" fill="#1e293b">修正を依頼する</text>
</svg>
