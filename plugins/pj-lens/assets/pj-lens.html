    if (T(refs.get(ref)).due !== dueOf.get(ref)) warnings.push(`登録するタスク ${ref}（${o.title}）の営業日 ${o.businessDays} は、先行の期限が引き上げられたため反映されていません（期限は ${T(refs.get(ref)).due}）`);
  }
  const addRows = adds.map((o) => { const t = T(refs.get(String(o.ref).trim())); return { ref: String(o.ref).trim(), title: t.title, projectId: t.projectId, group: t.group ?? null, subgroup: t.subgroup ?? null, due: t.due, businessDays: o.businessDays ?? null, start: t.start ?? null, predecessors: o.predecessors ?? [] }; });
  const sections = [];
  if (addRows.length) sections.push({ kind: "add", rows: addRows });
  if (predRows.length) sections.push({ kind: "pred", rows: predRows });
  if (dueRows.length) sections.push({ kind: "due", rows: dueRows });
  return { data: w, ops: ops.map((o) => planned.get(o) ?? o), sections, warnings, base: { tasks: baseTasks, projects: [...projects].sort() }, moves, inboxIds: [...inboxIds], predCount, addCount };
}

/** 変更案の表の同一性（提案と、いまのデータでの計算結果の比較用）。登録する開始日の既定（日付で変わる）と、理由の文は含めない */
const sectionsKey = (sections) => JSON.stringify(sections.map((s) => [s.kind, s.rows.map((r) =>
  s.kind === "due" ? [r.taskId, r.oldDue, r.newDue]
    : s.kind === "pred" ? [r.taskId, r.predId, r.action]
      : [r.ref, r.title, r.projectId, r.group, r.subgroup, r.due, r.predecessors])]));

/** 変更案（sections）の要約。例: 「期限 2 件・先行 1 件・登録 2 件」（変更なしの先行は数えない） */
function summarizeSections(sections) {
  const n = (kind) => sections.find((s) => s.kind === kind)?.rows.filter((r) => r.action !== "same").length ?? 0;
  return `期限 ${n("due")} 件・先行 ${n("pred")} 件・登録 ${n("add")} 件`;
}

/** 操作の計画（データは変えない）。例外: 不明なタスク・プロジェクト、循環、別のプロジェクトの先行、完了済みの moveDue、不明な op、など */
function planOps(data, ops, { today }) {
  const s = simulate(data, ops, today);
  return { ops: s.ops, sections: s.sections, warnings: s.warnings, base: s.base };
}

/** 提案を適用する。base が現在のデータと違えば、code: "stale" の例外（データは変えない） */
function applyProposal(data, proposal, { reason, cause, today }) {
  const why = String(reason ?? "").trim();
  if (!why) throw new Error("理由を入力してください");
  if (!CAUSES.includes(cause)) throw new Error(`原因は ${CAUSES.join("・")} のいずれかにしてください`);
  const stale = () => Object.assign(new Error("提案のあとにデータが変わりました。もう一度提案してもらってください"), { code: "stale" });
  for (const [id, v] of Object.entries(proposal.base?.tasks ?? {})) {
    const t = data.tasks.find((x) => x.id === id);
    if (!t || t.due !== v.due || t.status !== v.status || (t.predecessors ?? []).join(",") !== (v.predecessors ?? []).join(",")) throw stale();
  }
  for (const pid of proposal.base?.projects ?? []) if (!(data.projects ?? []).some((p) => p.id === pid)) throw stale();

  const s = simulate(data, proposal.ops, today);
  // base に入らない後続・別の先行が変わって、提案の表と結果が食い違うときは、適用しない
  if (proposal.sections && sectionsKey(s.sections) !== sectionsKey(proposal.sections)) throw stale();
  const log = [...(s.data.changeLog ?? [])];
  for (const m of s.moves) log.push({ at: today, taskIds: m.taskIds, reason: why, cause, deltaDays: m.deltaDays });
  if (s.predCount || s.addCount) {
    log.push({ at: today, taskIds: s.inboxIds, reason: `受信箱: 先行 ${s.predCount} 件・登録 ${s.addCount} 件`, cause: null, deltaDays: 0, source: "inbox" });
  }
  const out = { ...s.data, changeLog: log };
  const { errors } = validate(out);
  if (errors.length) throw new Error(errors.join(" / "));
  return out;
}

return { summarizeSections, planOps, applyProposal };
})();

/* src/ui/views/prio.js */
const { doneAskHtml, todayTaskIds, renderTodayTasks, renderPrio, renderSide } = (() => {
// 「今日のタスク」「今日の優先」パネル（プロジェクト画面・スケジュール画面で共通。右の列に並ぶ）




const PILL = { "To Do": "off", "In Progress": "ok", Waiting: "wait", Done: "done", Cancelled: "off" };
const statusPill = (t) => `<span class="pill ${PILL[t.status] ?? "off"}">${esc(t.status)}</span>`;
const isClosed = (t) => t.status === "Done" || t.status === "Cancelled";

/** 着手（To Do・Waiting のとき）と完了（Done・Cancelled 以外）のボタン。今日のタスクが使う */
function statusButtons(t) {
  const btn = (status, label) => `<button class="btn" data-setstatus="${esc(t.id)}|${status}" aria-label="${esc(t.id)} を${label}にする">${label}</button>`;
  const start = t.status === "To Do" || t.status === "Waiting" ? btn("In Progress", "着手") : "";
  const done = !isClosed(t) ? btn("Done", "完了") : "";
  return start || done ? `<span class="bb">${start}${done}</span>` : "";
}

/** 未来の予定の枠を解除して Done・Cancelled にする確認（今日のタスクの行と、リストの状態の欄が使う） */
function doneAskHtml(pd) {
  return `<div class="ask" style="max-width:none">${esc(pd.id)} の未来の予定の枠 ${pd.n} 件を解除して ${esc(pd.status)} にします。<div style="display:flex;gap:6px;margin-top:4px"><button class="btn danger" data-doneok="${esc(pd.id)}">解除して ${esc(pd.status)} にする</button><button class="btn" data-doneno>やめる</button></div></div>`;
}

/** 今日の日付に作業枠（予定・実績・未確認）があるタスクを [{ t, slots }] で返す。未完了を最初の枠の開始順に、Done・Cancelled を末尾に */
function todayList(data, today) {
  const rows = data.tasks
    .map((t) => ({ t, slots: (t.sessions ?? []).filter((s) => s.date === today).sort((a, b) => a.start.localeCompare(b.start)) }))
    .filter((r) => r.slots.length);
  return rows.sort((a, b) => isClosed(a.t) - isClosed(b.t) || a.slots[0].start.localeCompare(b.slots[0].start));
}

const todayTaskIds = (data, today) => todayList(data, today).map((r) => r.t.id);

/** 今日のタスク。今日に枠が無ければ空文字
 *  @param opts.pendingDone  未来の予定の枠を解除する確認待ち { id, status, n }（その行に確認を出す） */
function renderTodayTasks(data, today, opts = {}) {
  const rows = todayList(data, today);
  if (!rows.length) return "";
  const items = rows.map(({ t, slots }) => {
    const proj = esc(data.projects.find((p) => p.id === t.projectId)?.name ?? "");
    const times = slots.map((s) => esc(`${s.start}–${s.end}`)).join("、");
    const ask = opts.pendingDone?.id === t.id ? doneAskHtml(opts.pendingDone) : "";
    return `<li data-today="${esc(t.id)}"${isClosed(t) ? ' class="closed"' : ""}><span class="pj">${proj}</span><span class="t">${esc(t.title)} ${statusPill(t)}</span><span class="why mono">${times}</span>${isClosed(t) ? "" : statusButtons(t)}${ask}</li>`;
  }).join("");
  return `<section class="panel todaytasks" aria-labelledby="h-td"><h2 id="h-td">今日のタスク</h2><ul class="rank tl">${items}</ul></section>`;
}

/**
 * @param opts.sched   true ならスケジュール画面用（全件・ドラッグ可）。false なら上位 4 件
 * @param opts.picked  選択中のタスク ID
 * 今日のタスクに入っているタスクは出さない（順位の計算は変えず、表示で除く）
 */
function renderPrio(data, today, opts = {}) {
  const { sched = false, picked = null } = opts;
  const inToday = new Set(todayTaskIds(data, today));
  const ranked = rankTasks(data, today).filter((r) => !inToday.has(r.taskId));
  const shown = sched ? ranked : ranked.slice(0, 4);
  const items = shown.map((r, i) => {
    const t = data.tasks.find((x) => x.id === r.taskId);
    const a = taskActual(data, t.id);
    const pill = a.count ? ` <span class="pill ok">${a.count}回・実績 ${a.hours.toFixed(1)}h</span>` : "";
    const proj = esc(data.projects.find((p) => p.id === t.projectId)?.name ?? "");
    const drag = sched ? ` draggable="true" data-pick="${esc(t.id)}" tabindex="0"` : "";
    return `<li${drag} class="${picked === t.id ? "picked" : ""}"><span class="n">${i + 1}</span><span class="pj">${proj}</span><span class="t">${r.action === "chase" ? `<span class="act">${r.reasons.some((x) => x.includes("催促")) ? "催促" : "確認"}</span>` : ""}${esc(t.title)} ${statusPill(t)}${pill}</span><span class="why">${esc(r.reasons.join("。"))}</span></li>`;
  }).join("");
  const note = sched
    ? "タスクをカレンダーへドラッグして配置します(15分刻み・長さ1時間)。配置済みの枠もドラッグで移動できます。キーボードでは、タスクを選んで日表示の空き枠を押します。"
    : "スケジュール画面で、時間枠に配置できます。";
  return `<section class="panel prio" aria-labelledby="h-rk"><h2 id="h-rk">今日の優先</h2>${shown.length ? `<ol class="rank">${items}</ol>` : `<p class="muted">優先するタスクはありません。</p>`}<p class="note" style="margin:10px 0 0">${note}</p></section>`;
}

/** 右の列: 今日のタスク（あれば）＋今日の優先。列の直下の要素として固定表示（sticky）にするため、1 つの箱にまとめる */
function renderSide(data, today, opts = {}) {
  return `<div class="side">${renderTodayTasks(data, today, opts)}${renderPrio(data, today, opts)}</div>`;
}

return { doneAskHtml, todayTaskIds, renderTodayTasks, renderPrio, renderSide };
})();

/* src/ui/views/gantt.js */
const { GANTT_WINDOWS, renderGantt } = (() => {
// ガントチャート（画面とレポートで共用）。位置と幅はすべて範囲全体に対する % で表し、画面幅に追従させる。






const GANTT_WINDOWS = [["m1", "1か月"], ["m3", "3か月"], ["m6", "6か月"], ["y1", "1年"], ["all", "全期間"]];

const legend = (showActual) => `<div class="legend"><span><i class="gbar b-todo" style="position:static;display:inline-block;width:22px;height:10px"></i>To Do</span><span><i class="gbar b-prog" style="position:static;display:inline-block;width:22px;height:10px"></i>In Progress</span><span><i class="gbar b-wait" style="position:static;display:inline-block;width:22px;height:10px"></i>Waiting</span><span><i class="gbar b-done" style="position:static;display:inline-block;width:22px;height:10px"></i>Done</span><span><i class="gbar gsum" style="position:static;display:inline-block;width:22px;height:8px"></i>プロジェクト全体</span><span><i class="ms" style="position:static;display:inline-block;transform:rotate(45deg);width:9px;height:9px"></i>マイルストーン</span>${showActual ? `<span><i class="gact" style="position:static;display:inline-block;width:22px;height:5px"></i>実績(最初の作業日〜完了日・今日)</span>` : ""}<span>開始日は、未入力なら先行タスクの期限から</span></div>`;

function tools(win, hideDone) {
  const seg = GANTT_WINDOWS.map(([k, l]) => `<button data-gwin="${k}" aria-pressed="${win === k}">${l}</button>`).join("");
  return `<div class="gtools"><span class="note">表示期間</span><div class="seg" role="group" aria-label="表示期間">${seg}</div><button class="chip-btn" data-hidedone aria-pressed="${hideDone}">完了を隠す</button><button class="chip-btn" data-gotoday>今日へ移動</button></div>`;
}

/**
 * @param opts.window    "m1" | "m3" | "m6" | "y1" | "all"
 * @param opts.hideDone  Done の行を隠す（全体バーの進捗には影響しない）
 * @param opts.readonly  true なら編集用の部品・属性を出さない（レポート用）
 * @param opts.askDel    削除確認を出すタスク ID
 * @param opts.showActual false なら実績の線と凡例を出さない
 * @param opts.group     "all" か大項目の名前(その大項目の行だけを出す)
 * @param opts.addAt     名前入力を開いている見出し { pid, group, subgroup }（なければ null）
 */
function renderGantt(data, projectIds, today, opts = {}) {
  const { window: win = "m6", hideDone = false, readonly = false, askDel = null, showActual = true, group = "all", addAt = null } = opts;
  const all = projectIds.map((id) => data.projects.find((p) => p.id === id)).filter(Boolean);
  // 編集画面は、タスクが 0 件でも見出しの「＋」から追加できるように描く
  if (!all.length || (readonly && !data.tasks.some((t) => projectIds.includes(t.projectId)))) {
    return `<p class="muted">タスクがありません。${readonly ? "" : "リスト表示で追加してください。"}</p>`;
  }
  // 完了を隠すは、複数のプロジェクトを出しているとき、完了したプロジェクト（状態が「完了」、またはタスクが 1 件以上あって全部 Done）も隠す。1 つを選んでいるときは隠さない
  const closed = (p) => { const ts = data.tasks.filter((t) => t.projectId === p.id); return p.status === "完了" || (ts.length > 0 && ts.every((t) => t.status === "Done")); };
  const ps = hideDone && all.length > 1 ? all.filter((p) => !closed(p)) : all;
  // 編集画面は、道具と凡例を上端の固定の帯に置く（タスクが多くても、スクロール中に色の意味を見失わない）。レポート用は従来どおり下に置く
  const top = readonly ? "" : `<div class="gtop">${tools(win, hideDone)}${legend(showActual)}</div>`;
  if (!ps.length) return `${top}<p class="muted">完了したプロジェクトを隠しています。「完了を隠す」を押すと、また出ます。</p>`;

  const geo = new Map(ps.map((p) => [p.id, ganttRows(data, p.id, today)]));
  const starts = [...geo.values()].map((g) => g.range.start);
  const ends = [...geo.values()].map((g) => g.range.end);
  const s0 = [addDays(today, -10), ...starts].reduce((a, b) => (a < b ? a : b));
  const e0 = [addDays(today, 14), ...ends].reduce((a, b) => (a > b ? a : b));
  const range = { start: s0, end: e0 };
  const total = diffDays(e0, s0) + 1;
  const { visibleDays, ratio, scale } = ganttLayout(range, win);
  const dayScale = scale === "day";
  const x = (d) => `${((diffDays(d, s0) / total) * 100).toFixed(3)}%`;
  const ticks = timeTicks(range, scale);
  const laneW = `calc((100cqw - var(--lw) - 12px) * ${ratio.toFixed(4)})`;
  const laneStyle = `style="width:var(--lanew)"`;

  const axis = ticks
    .filter((t) => dayScale || Math.abs(diffDays(t.date, today)) > visibleDays * 0.045)
    .map((t) => `<span class="mono ${t.yearStart ? "yr" : ""} ${dayScale && t.date === today ? "tdy" : ""}" data-tick="${t.date}" style="left:${x(t.date)}">${esc(t.label)}${dayScale ? `<small>${wdJa(t.date)}</small>` : ""}</span>`)
    .join("");
  const grid = (dayScale ? ticks.filter((t) => t.weekend).map((t) => `<i class="gwk" style="left:${x(t.date)};width:${(100 / total).toFixed(3)}%"></i>`).join("") : "")
    + ticks.map((t) => `<i class="gl ${t.yearStart ? "yr" : ""}" style="left:${x(t.date)}"></i>`).join("");
  const todayLine = `<span class="todayline" style="left:${x(today)}"></span>`;

  const sections = ps.map((p) => {
    const g = geo.get(p.id);
    const prog = projectProgress(data, p.id);
    const hh = projectHours(data, p.id);
    const pct = Math.round(prog.rate * 100);
    const flags = projectFlags(data, p.id, today);
    const ms = g.milestones;
    const msLines = ms.map((m) => `<i class="msl" style="left:${x(m.date)}"></i>`).join("");

    let prevPct = -99;
    let level = 0;
    const msItems = ms.map((m) => {
      const at = (diffDays(m.date, s0) / total) * 100;
      level = at - prevPct < 14 ? 1 - level : 0;
      prevPct = at;
      const idx = (p.milestones ?? []).findIndex((o) => o.name === m.name && o.date === m.date);
      const attr = readonly ? "" : ` data-gms="${esc(p.id)}|${idx}"`;
      return `<i class="ms"${attr} style="left:${x(m.date)};top:${level ? 24 : 6}px" title="${esc(m.name)} ${fmtMD(m.date)}${readonly ? "" : "(ドラッグで日付を変更)"}"></i><span class="ms-l" style="left:${x(m.date)};top:${level ? 20 : 2}px">${esc(m.name)} <b class="mono">${fmtMD(m.date)}</b></span>`;
    }).join("");
    const msRow = ms.length
      ? `<div class="g-row g-msrow"><div class="g-label"><span class="id"></span><span class="muted">マイルストーン</span></div><div class="g-lane" ${laneStyle}>${msItems}</div></div>`
      : "";

    const months = Math.max(1, Math.round(diffDays(p.due, p.start) / 30.4));
    const head = `<div class="pg-head"><div>${readonly ? `<strong>${esc(p.name)}</strong>` : `<button class="proj-name" data-filter="${esc(p.id)}">${esc(p.name)}</button>`}<div class="proj-meta"><span>${esc(p.type)}</span><span>${esc(p.status)}</span><span class="mono">${fmtMD(p.start)}〜${fmtMD(p.due)}(${months}か月)</span>${readonly ? "" : `<span class="mono">${prog.done}/${prog.total} Done (${pct}%)</span><span class="mono hrs">稼働 ${(hh.task + hh.meeting).toFixed(1)}h（タスク ${hh.task.toFixed(1)}h・会議 ${hh.meeting.toFixed(1)}h）</span>`}${flagPills(data, p.id, today, flags)}</div></div>${readonly ? "" : `<button class="btn" data-open="${esc(p.id)}">編集する</button>`}</div>`;

    const sumW = Math.max(0, (diffDays(p.due, p.start) / total) * 100).toFixed(3);
    const sumAttr = readonly ? "" : ` data-gp="${esc(p.id)}"`;
    const sumHandles = readonly ? "" : `<b class="gh l" data-gh="l"></b><b class="gh r" data-gh="r"></b>`;
    const sumRow = `<div class="g-row g-sumrow"><div class="g-label"><span class="id"></span><span class="muted">プロジェクト全体</span></div><div class="g-lane" ${laneStyle}><i class="gbar gsum"${sumAttr} style="left:${x(p.start)};width:${sumW}%;min-width:4px" title="${fmtMD(p.start)}〜${fmtMD(p.due)}${readonly ? "" : "(両端のドラッグで開始・期限を変更)"}"><u style="width:${pct}%"></u>${sumHandles}</i><span class="g-due mono" style="left:${x(p.due)}">${fmtMD(p.due)}</span></div></div>`;

    const taskOf = (r) => data.tasks.find((o) => o.id === r.taskId);
    const inGroup = (r) => group === "all" || (taskOf(r).group ?? "") === group;
    const shown = (r) => !(hideDone && taskOf(r).status === "Done");
    const rowHtml = (r) => {
      const t = data.tasks.find((o) => o.id === r.taskId);
      const late = taskFlags(t, today, data.settings).includes("overdue");
      const ui = STATUS_UI[t.status] ?? STATUS_UI["To Do"];
      const hasPre = (t.predecessors ?? []).length > 0;
      const gt = readonly ? "" : ` data-gt="${esc(t.id)}"`;
      const drag = readonly ? "" : " gdrag";
      const label = `${esc(t.id)} ${esc(t.title)} ${fmtMD(r.start)}〜${fmtMD(r.end)}`;
      const bar = r.point
        ? `<i class="dot mk${drag} ${ui.dot}${late ? " is-late" : ""}"${gt} style="left:${x(r.end)};top:13px" title="${label}${readonly ? "" : "(ドラッグで期限を変更)"}"></i>`
        : `<i class="gbar${drag}${hasPre ? " fixl" : ""} ${ui.bar}${late ? " is-late" : ""}"${gt} style="left:${x(r.start)};width:${((diffDays(r.end, r.start) / total) * 100).toFixed(3)}%;min-width:5px" title="${label}${readonly ? "" : hasPre ? "(開始は先行から決まります。右端のドラッグで期限を変更)" : "(ドラッグで移動、両端で開始・期限を変更)"}">${readonly ? "" : `${hasPre ? "" : '<b class="gh l" data-gh="l"></b>'}<b class="gh r" data-gh="r"></b>`}</i>`;
      const act = r.actual && showActual
        ? `<i class="gact" style="left:${x(r.actual.start)};width:${(Math.max(diffDays(r.actual.end, r.actual.start), 0) / total * 100).toFixed(3)}%;min-width:4px" title="実績 ${fmtMD(r.actual.start)}〜${fmtMD(r.actual.end)}"></i>`
        : "";
      const dependents = data.tasks.filter((o) => (o.predecessors ?? []).includes(t.id)).map((o) => o.id);
      let lab;
      if (!readonly && askDel === t.id) {
        lab = `<div class="g-label"><span class="id">${esc(t.id)}</span><div class="ask" style="grid-column:2/-1">${dependents.length ? `後続 ${esc(dependents.join(", "))} の先行から外れます。` : "このタスクを削除します。"}<div style="display:flex;gap:6px;margin-top:4px"><button class="btn danger" data-delyes="${esc(t.id)}">削除する</button><button class="btn" data-delno>やめる</button></div></div></div>`;
      } else {
        const name = readonly ? `<span class="g-name">${esc(t.title)}</span>` : `<button class="g-name" data-goto="${esc(t.id)}" title="リストで編集する">${esc(t.title)}</button>`;
        const del = readonly ? "" : `<button class="gx" data-del="${esc(t.id)}" aria-label="${esc(t.id)} を削除">×</button>`;
        lab = `<div class="g-label"><span class="id">${esc(t.id)}</span>${name}${del}<span class="g-pre">${hasPre ? "← " + esc(t.predecessors.join(", ")) : ""}</span></div>`;
      }
      return `<div class="g-row">${lab}<div class="g-lane" ${laneStyle}>${bar}${act}<span class="g-due mono" style="left:${x(r.end)}">${fmtMD(t.due)}</span></div></div>`;
    };
    // (大項目, 中項目) ごとに見出し行を入れて並べる。編集画面は、追加の入口になるので、大項目がなくても「（なし）」の見出しを常に出す。
    // 見出しは完了を隠していても残す（そのグループへ追加できるように）。レポート用は、見える行があるグループだけを出す
    const base = g.rows.filter(inGroup).filter((r) => !readonly || shown(r));
    const grouped = !readonly || base.some((r) => taskOf(r).group || taskOf(r).subgroup);
    const heading = (sec) => {
      const name = `${sec.group || "（なし）"}${sec.subgroup ? ` ▸ ${sec.subgroup}` : ""}`;
      const at = `data-ag="${esc(sec.group)}" data-asg="${esc(sec.subgroup)}"`;
      const opening = addAt && addAt.pid === p.id && addAt.group === sec.group && addAt.subgroup === sec.subgroup;
      const ctl = readonly ? ""
        : opening ? `<input class="in" data-gadd="${esc(p.id)}" ${at} placeholder="タスク名を入力して Enter" aria-label="${esc(name)} に追加するタスク名"><button class="plus" data-gaddok="${esc(p.id)}">追加</button><button class="plus" data-gaddno>やめる</button>`
        : `<button class="plus" data-gopen="${esc(p.id)}" ${at} aria-label="${esc(name)} にタスクを追加">＋</button>`;
      return `<div class="g-row g-grp"><div class="g-label"><span class="g-grp-t"><b>${esc(sec.group || "（なし）")}</b>${sec.subgroup ? ` <span class="muted">▸ ${esc(sec.subgroup)}</span>` : ""}</span>${ctl}</div><div class="g-lane" ${laneStyle}></div></div>`;
    };
    const secs = groupSections(base.map((r) => ({ ...taskOf(r), row: r })), { ensureNone: !readonly && group === "all" });
    if (!readonly && group !== "all" && !secs.length) secs.push({ group, subgroup: "", tasks: [] }); // 絞り込んだ大項目のタスクがなくても、そこへ追加できるように
    const rows = grouped
      ? secs
        .map((sec) => ({ sec, vis: sec.tasks.filter((x) => shown(x.row)) }))
        .filter(({ vis }) => !readonly || vis.length)
        .map(({ sec, vis }) => `${heading(sec)}${vis.map((x) => rowHtml(x.row)).join("")}`).join("")
      : base.map(rowHtml).join("");

    const headRow = `<div class="g-row g-head"><div class="g-label"></div><div class="g-lane g-axis ${dayScale ? "day" : ""}" ${laneStyle}>${dayScale ? "" : `<span class="todaytag" style="left:${x(today)}">今日</span>`}${axis}</div></div>`;

    return `<section class="pg" aria-label="${esc(p.name)}">${head}<div class="gbody" style="--lanew:${laneW}"><div class="gov under">${grid}</div><div class="gov over">${msLines}${todayLine}</div>${headRow}${msRow}${sumRow}${rows}</div></section>`;
  }).join("");

  return `${top}<div class="gscroll" data-todayfrac="${(diffDays(today, s0) / total).toFixed(5)}" data-s0="${s0}" data-span="${total}"><div class="gwide">${sections}</div></div>${readonly ? legend(showActual) : ""}`;
}

return { GANTT_WINDOWS, renderGantt };
})();

/* src/ui/views/schedule.js */
const { snapStart, weekStartOf, calendarGeometry, renderCalendar, renderSchedule } = (() => {
// スケジュール画面（週／日）。位置と高さは勤務時間に対する % で表し、カレンダーの高さは CSS で画面に追従させる。








const DEFAULT_WORKDAY = { start: "09:00", end: "18:00" };
const SLOT_STEP = 15;

/** 15 分刻みに丸め、勤務時間内に収める（開始の分を返す） */
function snapStart(minutes, durationMin, workday = DEFAULT_WORKDAY) {
  const [ws, we] = [toMin(workday.start), toMin(workday.end)];
  return Math.max(ws, Math.min(Math.round(minutes / SLOT_STEP) * SLOT_STEP, we - durationMin));
}

const weekStartOf = (d) => addDays(d, -((weekday(d) + 6) % 7));

/** 勤務時間 → 位置計算（すべて % ） */
function calendarGeometry(data) {
  const wd = data.settings?.workday ?? DEFAULT_WORKDAY;
  const h0 = toMin(wd.start);
  const span = toMin(wd.end) - h0;
  const pc = (m) => ((m - h0) / span) * 100;
  return { wd, h0, span, pc, tp: (m) => `${pc(m).toFixed(3)}%`, ht: (a, b) => `calc(${(pc(b) - pc(a)).toFixed(3)}% - 2px)` };
}

const allSessions = (data) => data.tasks.flatMap((t) => (t.sessions ?? []).map((s) => ({ ...s, taskId: t.id, title: t.title })));
const hoursHtml = (g) => {
  let s = "";
  for (let h = Math.ceil(g.h0 / 60); h * 60 <= g.h0 + g.span; h++) s += `<div class="hour" style="top:${(((h * 60 - g.h0) / g.span) * 100).toFixed(3)}%"><span>${h}:00</span></div>`;
  return s;
};

function meetingBlocks(data, d, full, g, ctx) {
  return (data.events ?? []).filter((m) => m.date === d).map((m) => {
    const a = Math.max(toMin(m.start), g.h0);
    const b = Math.min(toMin(m.end), g.h0 + g.span);
    if (b <= a) return "";
    const manual = m.source === "manual";
    const kind = meetingKind(m, ctx.now);
    const kc = kind === "actual" ? "act" : kind === "unconfirmed" ? "unconf" : "";
    const mark = m.skip ? " 不参加" : kind === "actual" ? " ✓" : kind === "unconfirmed" ? " 未確認" : "";
    const pname = (data.projects ?? []).find((p) => p.id === m.projectId)?.name;
    const by = m.projectBy === "manual" ? "（手動）" : m.projectBy === "rule" ? "（規則）" : "";
    const proj = full ? `<span class="mp">${pname ? `プロジェクト: ${esc(pname)}${by}` : "プロジェクト未設定"}</span>` : "";
    const confirm = full && kind === "unconfirmed" ? `<span class="bb"><button class="btn" data-confirmmtg="${esc(m.id)}">実績にする</button></span>` : "";
    return `<div class="blk mtg ${m.skip ? "skip" : ""} ${kc} ${ctx.selMtg === m.id ? "sel" : ""}" data-mtg="${esc(m.id)}" tabindex="0" ${manual ? `draggable="true" data-dragmtg="${esc(m.id)}"` : ""} style="top:${g.tp(a)};height:${g.ht(a, b)}" title="${esc(m.title)}${m.skip ? "(参加しない)" : ""}${manual ? "" : "(予定表から取得)"}"><span class="tm">${esc(m.start)}-${esc(m.end)}${mark}</span>${esc(m.title)}${proj}${confirm}${manual ? `<i class="rz" data-rzm="${esc(m.id)}" aria-label="終了時刻を変更"></i>` : ""}</div>`;
  }).join("");
}

const KIND_CLS = { actual: "act", unconfirmed: "unconf", planned: "plan" };
const KIND_JA = { act: "実績", unconf: "未確認", plan: "予定" };
/** 日表示の枠に出す、タスクの状態の文字 */
const STATUS_JA = { "To Do": "未着手", "In Progress": "着手中", Waiting: "待ち", Done: "完了", Cancelled: "中止" };

function sessionBlocks(data, d, full, g, ctx) {
  return allSessions(data).filter((s) => s.date === d).map((s) => {
    const kind = sessionKind(s, ctx.now);
    const c = KIND_CLS[kind];
    const confirm = full && kind === "unconfirmed" ? `<span class="bb"><button class="btn" data-confirm="${esc(s.id)}">実績にする</button></span>` : "";
    const st = full ? ` <span class="stt">${STATUS_JA[data.tasks.find((t) => t.id === s.taskId).status] ?? ""}</span>` : "";
    return `<div class="blk task ${c} ${ctx.selSess === s.id ? "sel" : ""}" draggable="true" tabindex="0" data-dragsess="${esc(s.id)}" style="top:${g.tp(toMin(s.start))};height:${g.ht(toMin(s.start), toMin(s.end))}" title="${esc(s.title)}(${KIND_JA[c]})"><span class="tm">${esc(s.start)}-${esc(s.end)}${c === "act" ? " ✓" : c === "unconf" ? " 未確認" : ""}</span>${full ? `${esc(s.taskId)} ` : ""}${esc(s.title)}${st}${confirm}<i class="rz" data-rz="${esc(s.id)}" aria-label="終了時刻を変更"></i></div>`;
  }).join("");
}

/** 会議と配置済みの枠を除いた空き時間 */
function freeOf(data, d, g, isOff) {
  if (isOff(d)) return [];
  const busy = [...(data.events ?? []), ...allSessions(data)].filter((x) => x.date === d);
  return freeSlots(busy, d, g.wd);
}

function meetingForm(data, ctx) {
  const draft = ctx.mtgDraft;
  const m = draft ?? (data.events ?? []).find((o) => o.id === ctx.selMtg);
  if (!m) return "";
  const isNew = !!draft;
  const lock = !isNew && m.source === "mcp" ? "disabled" : "";
  const projects = data.projects ?? [];
  const autoId = matchProject(m.title, (data.settings?.projectRules ?? []).filter((r) => projects.some((p) => p.id === r.projectId)));
  const autoName = projects.find((p) => p.id === autoId)?.name ?? "未設定";
  const cur = isNew ? (m.projectId ?? "") : m.projectBy === "manual" ? m.projectId : "";
  const projOpts = [`<option value=""${cur === "" ? " selected" : ""}>自動（規則）→ ${esc(autoName)}</option>`, ...projects.map((p) => `<option value="${esc(p.id)}"${cur === p.id ? " selected" : ""}>${esc(p.name)}</option>`)].join("");
  return `<div class="mtgform" role="group" aria-label="会議の${isNew ? "追加" : "編集"}">
    <label>件名<input class="in" data-mt="title" value="${esc(m.title)}" placeholder="会議名" style="min-width:200px" ${lock}></label>
    <label>日付<input class="in" type="date" data-mt="date" value="${esc(m.date)}" ${lock}></label>
    <label>開始<input class="in" type="time" step="900" data-mt="start" value="${esc(m.start)}" ${lock}></label>
    <label>終了<input class="in" type="time" step="900" data-mt="end" value="${esc(m.end)}" ${lock}></label>
    <label>プロジェクト<select class="in" data-mt="projectId" aria-label="会議のプロジェクト">${projOpts}</select></label>
    <label class="chk"><input type="checkbox" data-mt="skip" ${m.skip ? "checked" : ""}>参加しない(空き時間として扱う)</label>
    <div style="display:flex;gap:6px;align-items:center">${isNew ? `<button class="btn" data-mtgsave>追加</button><button class="btn" data-mtgcancel>キャンセル</button>` : `${m.source === "manual" ? `<button class="btn danger" data-delsel>会議を削除</button>` : ""}<button class="btn" data-mtgclose>閉じる</button>`}</div>
    ${!isNew && m.source === "manual" ? `<p class="note" style="flex-basis:100%;margin:0">カレンダー上でドラッグして移動（別の日へも）、下端をドラッグして長さを変えられます。</p>` : ""}${!isNew && m.source === "mcp" ? `<p class="note" style="flex-basis:100%;margin:0">予定表から取得した会議です。件名と時間は取得内容が正のため変更できません。プロジェクトは、規則で自動に付き、ここで手動に変えられます。出席しない会議は「参加しない」にします（削除しても、次の取得で戻ります）。</p>` : ""}
  </div>`;
}

/** カレンダー部分（週または日）＋凡例。会議の編集中はここだけを描き直す */
function renderCalendar(data, today, opts) {
  const { view = "week", date = today } = opts;
  const ctx = { now: opts.now ?? { date: today, time: "00:00" }, selSess: opts.selSess ?? null, selMtg: opts.selMtg ?? null };
  const g = calendarGeometry(data);
  const isOff = offDayChecker(data.settings);
  let cal;
  if (view === "week") {
    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStartOf(date), i));
    const heads = days.map((d) => {
      const free = freeOf(data, d, g, isOff).reduce((a, x) => a + toMin(x.end) - toMin(x.start), 0);
      return `<button class="dh ${d === today ? "t" : ""}" data-day="${d}" aria-label="${fmtMD(d)}の1日表示">${fmtMD(d)}(${wdJa(d)})<small class="mono">${isOff(d) ? "—" : `空き ${(free / 60).toFixed(1)}h`}</small></button>`;
    }).join("");
    const cols = days.map((d) => `<div class="col dz ${d === today ? "today" : ""} ${isOff(d) ? "weekend" : ""}" data-date="${d}">${meetingBlocks(data, d, false, g, ctx)}${sessionBlocks(data, d, false, g, ctx)}</div>`).join("");
    const dues = days.map((d) => {
      const due = data.tasks.filter((t) => t.due === d && t.status !== "Done" && t.status !== "Cancelled");
      return `<div class="duecell">${due.map((t) => `<div style="display:flex;gap:6px;align-items:baseline"><i class="dot ${STATUS_UI[t.status].dot}${t.due < today ? " is-late" : ""}"></i><span>${esc(t.title)}</span></div>`).join("") || '<span class="muted">—</span>'}</div>`;
    }).join("");
    cal = `<div class="cal wk"><div class="week"><div></div>${heads}<div class="hrs">${hoursHtml(g)}</div>${cols}</div><div class="week" style="margin-top:8px"><div class="note" style="padding-top:6px">期限</div>${dues}</div></div>
      <p class="note" style="margin:8px 0 0">日付を押すと1日表示に切り替わります。枠をクリックして選び、「枠を削除」か Delete キーで削除できます。</p>`;
  } else {
    const free = freeOf(data, date, g, isOff).filter((x) => toMin(x.end) - toMin(x.start) >= 20);
    const fb = free.map((x) => `<button class="free" data-free="${toMin(x.start)}" style="top:calc(${g.pc(toMin(x.start)).toFixed(3)}% + 1px);height:calc(${(g.pc(toMin(x.end)) - g.pc(toMin(x.start))).toFixed(3)}% - 3px)" aria-label="空き ${x.start}から${x.end}">${x.start}-${x.end} 空き</button>`).join("");
    const nowLine = date === ctx.now.date && toMin(ctx.now.time) >= g.h0 && toMin(ctx.now.time) <= g.h0 + g.span ? `<span class="nowline" style="top:${g.tp(toMin(ctx.now.time))}" title="現在 ${ctx.now.time}"></span>` : "";
    const offNote = isOff(date) ? `<p class="note" style="margin:0 0 8px">この日は休みです（土日・日本の祝日・休み）。作業枠は置けません。設定タブの「営業日として扱う日」に指定すると置けます。</p>` : "";
    cal = `${offNote}<div class="cal"><div class="cal-grid">${hoursHtml(g)}<div class="cal-body dz" id="calbody" data-date="${date}">${meetingBlocks(data, date, true, g, ctx)}${sessionBlocks(data, date, true, g, ctx)}${fb}${nowLine}</div></div></div>`;
  }
  const day = view === "day";
  const legend = `<div class="slegend" aria-label="色の凡例"><span><i class="sw mtg"></i>会議</span><span><i class="sw skipsw"></i>参加しない会議</span><span><i class="sw mtgun"></i>未確認の会議</span><span><i class="sw plan"></i>予定</span><span><i class="sw act"></i>実績(✓)</span><span><i class="sw unconf"></i>未確認(過ぎた予定)</span>${day ? '<span><i class="sw free"></i>空き時間</span><span><i class="sw now"></i>現在時刻</span>' : ""}<span><i class="sw sel"></i>選択中</span></div>`;
  return cal + legend;
}

/**
 * @param opts.view      "week" | "day"
 * @param opts.date      表示する日（週表示ではその日を含む週）
 * @param opts.now       {date, time}  現在時刻（過ぎた予定の判定に使う）
 * @param opts.selSess   選択中の枠 ID / opts.selMtg 選択中の会議 ID / opts.mtgDraft 追加中の会議の下書き
 * @param opts.picked    選択中のタスク ID（キーボード配置用）
 * @param opts.showPrio  false なら今日の優先を出さない
 */
function renderSchedule(data, today, opts) {
  const { view = "week", date = today } = opts;
  const now = opts.now ?? { date: today, time: "00:00" };
  const step = view === "week" ? 7 : 1;
  const days = view === "week" ? [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStartOf(date), i)) : [date];
  const title = view === "week" ? `${fmtMD(days[0])}〜${fmtMD(days[6])} の週` : `${fmtMD(date)}(${wdJa(date)})`;
  const inView = allSessions(data).filter((s) => days.includes(s.date));
  const kinds = inView.map((s) => sessionKind(s, now));
  const hours = inView.filter((s, i) => kinds[i] === "actual").reduce((a, s) => a + toMin(s.end) - toMin(s.start), 0) / 60;
  const planned = kinds.filter((k) => k === "planned").length;
  const unconfS = kinds.filter((k) => k === "unconfirmed").length;
  const unconfM = (data.events ?? []).filter((m) => days.includes(m.date) && meetingKind(m, now) === "unconfirmed").length;
  const unconf = unconfS + unconfM;
  const selSess = inView.find((s) => s.id === opts.selSess);
  const selMtg = (data.events ?? []).find((m) => m.id === opts.selMtg && days.includes(m.date));
  const delLabel = selSess ? `「${esc(selSess.title)}」の枠を削除` : selMtg && selMtg.source === "manual" ? `会議「${esc(selMtg.title)}」を削除` : "枠や会議を選んで削除";
  const delOk = !!selSess || (selMtg && selMtg.source === "manual");
  const calOpts = { ...opts, view, date, now, selSess: selSess?.id ?? null, selMtg: selMtg?.id ?? null };

  const nav = `<div class="toolbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" data-nav="${-step}" aria-label="前へ">←</button><button class="btn" data-nav="${step}" aria-label="次へ">→</button><button class="btn" data-sgoto>今日</button><strong style="margin-left:6px">${title}</strong></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" data-mtgadd>＋ 会議を追加</button><div class="seg" role="group" aria-label="表示"><button data-sview="week" aria-pressed="${view === "week"}">週</button><button data-sview="day" aria-pressed="${view === "day"}">日</button></div></div></div>
    <div class="summary"><span>実績 <b class="mono">${hours.toFixed(1)}時間</b></span><span>予定 <b class="mono">${planned}件</b></span>${unconf ? `<span class="pill wait">未確認 ${unconf}件（作業枠 ${unconfS}・会議 ${unconfM}）</span><button class="btn" data-confirmall>未確認をすべて実績にする</button>` : ""}<button class="btn danger" data-delsel ${delOk ? "" : "disabled"}>${delLabel}</button></div>`;
  return `<div class="cols${opts.showPrio === false ? " one" : ""}"><section class="panel">${nav}<div id="mtgslot">${meetingForm(data, { mtgDraft: opts.mtgDraft, selMtg: selMtg?.id })}</div><div id="calslot">${renderCalendar(data, today, calOpts)}</div></section>${opts.showPrio === false ? "" : renderSide(data, today, { sched: true, picked: opts.picked, pendingDone: opts.pendingDone })}</div>`;
}


return { snapStart, weekStartOf, calendarGeometry, renderCalendar, renderSchedule };
})();

/* src/ui/views/replan.js */
const { renderReplanPanel } = (() => {
// 日程変更の確認パネル（期限を変えたとき、後続への影響を見せて、反映のしかたを選んでもらう）



/**
 * @param pending {taskId, delta, impact, compress, cause, reason}  impact は computeImpact の結果
 * 保存はまだされていない状態の確認で、ボタンは data-replan="apply|only|cancel"、入力は data-rp="cause|reason|compress"
 */
function renderReplanPanel(data, pending) {
  const { taskId, delta, impact, compress = false, cause = "その他", reason = "" } = pending;
  const projectOf = (t) => data.projects.find((p) => p.id === t?.projectId);
  const self = impact.changes.find((c) => c.taskId === taskId) ?? impact.changes[0];
  const rows = impact.changes.map((c) => {
    const t = data.tasks.find((x) => x.id === c.taskId);
    const over = projectOf(t) && c.newDue > projectOf(t).due;
    return `<tr class="${over ? "over" : ""}"><td class="id">${esc(c.taskId)}</td><td>${esc(t?.title ?? "")}</td><td class="mono">${fmtMD(c.oldDue)}</td><td class="mono nd"><b>${fmtMD(c.newDue)}</b></td><td>${esc(c.reason)}</td></tr>`;
  }).join("");
  const warns = impact.projectDueExceeded.map((x) => {
    const p = data.projects.find((o) => o.id === x.projectId);
    return `<div class="rp-warn"><b>プロジェクト期限を超えます。</b> ${esc(p?.name ?? x.projectId)}の期限 <span class="mono">${fmtMD(x.due)}</span> に対し、最後のタスクは <span class="mono">${fmtMD(x.latestTaskDue)}</span> です。期限の見直しや、先行の短縮を検討してください。</div>`;
  }).join("");
  const early = delta < 0
    ? `<label class="chk"><input type="checkbox" data-rp="compress"${compress ? " checked" : ""}>後続も詰める（前倒しした日数だけ、後続も前倒しする）</label>`
    : "";
  return `<section class="panel replan" role="group" aria-label="日程変更の確認">
    <div class="rp-head"><h2>${esc(taskId)} の期限を <span class="mono">${fmtMD(self.oldDue)}</span> → <span class="mono">${fmtMD(self.newDue)}</span> に変更します <span class="muted">（${delta > 0 ? "+" : ""}${delta}日）</span></h2><span class="note">保存はまだされていません。確認して選んでください。</span></div>
    <table class="tbl"><thead><tr><th>ID</th><th>件名</th><th>旧期限</th><th>新期限</th><th>理由</th></tr></thead><tbody>${rows}</tbody></table>
    ${warns}
    <div class="rp-ctl">
      <label>原因<select class="in" data-rp="cause" aria-label="原因">${CAUSES.map((c) => `<option${c === cause ? " selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <label style="flex:1 1 280px">理由<input class="in" data-rp="reason" value="${esc(reason)}" placeholder="例: ベンダーの工事日程が変更になった" aria-label="理由"></label>
      ${early}
    </div>
    <div class="rp-act"><button class="btn primary" data-replan="apply">後続も反映して履歴に残す</button><button class="btn" data-replan="only">このタスクだけ変える</button><button class="btn" data-replan="cancel">やめる</button></div>
  </section>`;
}

return { renderReplanPanel };
})();

/* src/ui/views/reportpanel.js */
const { reportTarget, renderReportPreview, renderReportPanel } = (() => {
// レポート作成の設定パネル（対象のプロジェクトと期間を選ぶ）。保存はまだで、ボタンは data-rptgo（保存）・data-rptclose（閉じる）



const KIND_LABEL = { thisWeek: "今週", lastWeek: "先週", lastAndThis: "先週と今週", thisAndNext: "今週と来週", nextWeek: "来週", thisMonth: "今月", lastMonth: "先月", custom: "自由指定" };

/**
 * 選択（st: { kind, start, end, projectIds(null は全部) }）から、生成に使う値を求める。
 * 戻り値: { ids（data の順）, period（不正なら null）, name（拡張子なしのファイル名。作れないとき null）, problem（作れない理由。無ければ ""）}
 */
function reportTarget(data, st, today) {
  const all = data.projects.map((p) => p.id);
  const ids = st.projectIds ? all.filter((id) => st.projectIds.includes(id)) : all;
  let period = null, problem = "";
  try { period = reportPeriod(st.kind, today, { start: st.start, end: st.end }); } catch (e) { problem = e.message; }
  if (!problem && !ids.length) problem = "プロジェクトを1つ以上選んでください";
  const name = period && ids.length ? reportFileName({ projectIds: ids, allIds: all, period, today }) : null;
  return { ids, period, name, problem };
}

/** ファイル名の見本（作れないときは理由）。日付を打っている途中は、入力欄を作り直さずに、この部分だけ差し替える */
function renderReportPreview(data, st, today) {
  const t = reportTarget(data, st, today);
  return t.problem ? `<p class="note err" data-rptmsg>${esc(t.problem)}</p>` : `<p class="rpt-name">ファイル名: <code>${esc(t.name)}.html</code></p>`;
}

function renderReportPanel(data, st, today) {
  const t = reportTarget(data, st, today);
  const sel = new Set(t.ids);
  const projects = data.projects.map((p) => `<label class="chk"><input type="checkbox" data-rptp="${esc(p.id)}"${sel.has(p.id) ? " checked" : ""}>${esc(p.name)}</label>`).join("");
  const kinds = PERIOD_KINDS.map((k) => {
    let hint = "";
    if (k !== "custom") { const r = reportPeriod(k, today); hint = ` <span class="muted mono">${fmtMD(r.start)}〜${fmtMD(r.end)}</span>`; }
    return `<label class="chk"><input type="radio" name="rptk" data-rptk="${k}"${st.kind === k ? " checked" : ""}>${KIND_LABEL[k]}${hint}</label>`;
  }).join("");
  const custom = st.kind === "custom"
    ? `<div class="rp-ctl"><label>開始<input class="in" type="date" data-rptd="start" value="${esc(st.start)}"></label><label>終了<input class="in" type="date" data-rptd="end" value="${esc(st.end)}"></label></div>`
    : "";
  return `<section class="panel rptpanel" role="group" aria-label="レポートの作成">
    <div class="rp-head"><h2>レポートを作る</h2><span class="note">対象と期間を選んで、HTML ファイルとして保存します。</span></div>
    <fieldset class="rpt-set"><legend>プロジェクト</legend>
      <label class="chk"><input type="checkbox" data-rptall${t.ids.length === data.projects.length ? " checked" : ""}>全て</label>${projects}
    </fieldset>
    <fieldset class="rpt-set"><legend>期間</legend>${kinds}${custom}</fieldset>
    <label class="chk"><input type="checkbox" data-rptmt${st.showMeetingTitles ?? data.settings?.reportShowMeetingTitles === true ? " checked" : ""}>会議の件名を載せる</label>
    <div class="rpt-pre">${renderReportPreview(data, st, today)}</div>
    ${st.error ? `<p class="note err" role="alert">${esc(st.error)}</p>` : ""}
    <div class="rp-act"><button class="btn primary" data-rptgo${t.problem ? " disabled" : ""}>HTML で保存</button><button class="btn" data-rptclose>閉じる</button></div>
  </section>`;
}

return { reportTarget, renderReportPreview, renderReportPanel };
})();

/* src/ui/views/workload.js */
const { renderWorkload, shiftWorkloadDate } = (() => {
// 「稼働」画面: 期間（週・月）ごとに、プロジェクト別のタスク（実績の作業枠）と会議（確認済み・参加するもの）の時間を見せる。




const h = (v) => `${v.toFixed(1)}h`;

/**
 * @param opts.period "week" | "month"
 * @param opts.date   表示する日（その日を含む週・月）
 * @param opts.now    {date, time} 未確認の件数を数えるための現在時刻
 */
function renderWorkload(data, today, opts = {}) {
  const { period = "week", date = today, now } = opts;
  const range = periodRange(period, date);
  const w = workload(data, range, now);
  const [y, m] = date.split("-").map(Number);
  const title = period === "week" ? `${fmtMD(range.start)}〜${fmtMD(range.end)} の週` : `${y}年${m}月`;
  const todayLabel = period === "week" ? "今週" : "今月";
  const max = Math.max(0, ...w.rows.map((r) => r.total), w.unassigned);
  const bar = (task, meeting) => {
    const total = task + meeting;
    const width = max ? (total / max) * 100 : 0;
    const tp = total ? (task / total) * 100 : 0;
    return `<div class="wl-bar" style="width:${width.toFixed(1)}%"><i class="t" style="width:${tp.toFixed(1)}%"></i><i class="m" style="width:${(100 - tp).toFixed(1)}%"></i></div>`;
  };
  const rows = w.rows.map((r) => `<tr><td>${esc(data.projects.find((p) => p.id === r.projectId)?.name ?? r.projectId)}</td><td class="num mono">${h(r.task)}</td><td class="num mono">${h(r.meeting)}</td><td class="num mono"><b>${h(r.total)}</b></td><td>${bar(r.task, r.meeting)}</td></tr>`).join("");
  const un = w.unassigned > 0
    ? `<tr class="muted"><td>プロジェクト未設定の会議</td><td class="num mono">—</td><td class="num mono">${h(w.unassigned)}</td><td class="num mono"><b>${h(w.unassigned)}</b></td><td><div class="wl-bar un" style="width:${(max ? (w.unassigned / max) * 100 : 0).toFixed(1)}%"><i class="m" style="width:100%"></i></div></td></tr>`
    : "";
  const sumTask = w.rows.reduce((a, r) => a + r.task, 0);
  const sumMtg = w.rows.reduce((a, r) => a + r.meeting, 0) + w.unassigned;
  const note = w.unconfirmed > 0
    ? `<div class="banner">未確認 ${w.unconfirmed}件（作業枠 ${w.unconfirmedTasks}・会議 ${w.unconfirmedMeetings}）は、まだ含まれていません。スケジュール画面で「実績にする」と確認すると加わります。</div>`
    : "";
  const none = data.projects.length ? "" : `<p class="muted">プロジェクトがありません。プロジェクト画面から追加してください。</p>`;
  return `<section class="panel wl" aria-label="稼働">
    <div class="toolbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" data-wnav="-1" aria-label="前へ">←</button><button class="btn" data-wnav="1" aria-label="次へ">→</button><button class="btn" data-wtoday>${todayLabel}</button><strong style="margin-left:6px">${title}</strong></div>
      <div class="seg" role="group" aria-label="期間"><button data-wperiod="week" aria-pressed="${period === "week"}">週</button><button data-wperiod="month" aria-pressed="${period === "month"}">月</button></div></div>
    <div class="legend"><span><i class="sw wl-t"></i>タスク（実績の作業枠）</span><span><i class="sw wl-m"></i>会議（確認済み・参加するもの）</span></div>
    ${none}
    <div class="tscroll"><table class="tbl wl-tbl"><thead><tr><th>プロジェクト</th><th class="num">タスク</th><th class="num">会議</th><th class="num">合計</th><th>内訳</th></tr></thead><tbody>${rows}${un}</tbody>
      <tfoot><tr><td>合計</td><td class="num mono">${h(sumTask)}</td><td class="num mono">${h(sumMtg)}</td><td class="num mono">${h(w.total)}</td><td></td></tr></tfoot></table></div>
    ${note}
  </section>`;
}

/** 期間を 1 つ前後へ動かした日（週は 7 日、月は 1 か月） */
function shiftWorkloadDate(period, date, dir) {
  if (period === "week") return addDays(date, 7 * dir);
  const [y, m] = date.split("-").map(Number);
  const t = y * 12 + (m - 1) + dir;
  return `${String(Math.floor(t / 12)).padStart(4, "0")}-${String((t % 12) + 1).padStart(2, "0")}-01`;
}

return { renderWorkload, shiftWorkloadDate };
})();

/* src/ui/views/settings.js */

/** 基本の設定の入力に出す値。形が違う・無い項目は既定値（画面の描画と、不正な入力を元に戻すときに使う） */
function settingsInputValues(data) {
  const st = data.settings ?? {};
  const ok = st.workday && isTime(st.workday.start) && isTime(st.workday.end) && toMin(st.workday.start) < toMin(st.workday.end);
  const wd = ok ? st.workday : { start: "09:00", end: "18:00" };
  const lb = groupLabels(st);
  return { workdayStart: wd.start, workdayEnd: wd.end, waitingLongDays: Number.isInteger(st.waitingLongDays) && st.waitingLongDays >= 1 ? st.waitingLongDays : 7, labelGroup: lb.group, labelSubgroup: lb.subgroup };
}

  const st = data.settings ?? {};

  const basic = `<section class="panel" aria-labelledby="h-basic"><h2 id="h-basic" style="margin-top:0">基本の設定</h2>

      <div class="tscroll"><table class="tbl edit"><tbody>
        <tr><td data-l="項目">勤務時間</td><td data-l="値"><input class="in" type="time" data-set="workday-start" value="${esc(iv.workdayStart)}" aria-label="勤務時間の開始"> 〜 <input class="in" type="time" data-set="workday-end" value="${esc(iv.workdayEnd)}" aria-label="勤務時間の終了">${warnOf("workday")}</td><td class="muted" data-l="説明">スケジュールで作業枠を置ける範囲です。</td></tr>
        <tr><td data-l="項目">待ち長期化の日数</td><td data-l="値"><input class="in" type="number" min="1" step="1" data-set="waitingLongDays" value="${iv.waitingLongDays}" aria-label="待ち長期化とみなす日数"> 日${warnOf("waitingLongDays")}</td><td class="muted" data-l="説明">Waiting がこの日数を超えると、「今日の優先」と遅延バッジに出ます。</td></tr>
        <tr><td data-l="項目">見出しの呼び名</td><td data-l="値"><input class="in" data-set="label-group" value="${esc(iv.labelGroup)}" aria-label="大項目の呼び名"> <input class="in" data-set="label-subgroup" value="${esc(iv.labelSubgroup)}" aria-label="中項目の呼び名">${warnOf("labels")}</td><td class="muted" data-l="説明">ガント・リストの見出しの呼び名です。空にすると既定（大項目・中項目）に戻ります。</td></tr>
      </tbody></table></div>
    </section>`;

  // 休みと営業日の指定: 形が違う要素は出さず（validate の注意が節の上に出る）、日付の昇順で並べる
  const entries = (v) => (Array.isArray(v) ? v.filter((x) => x && typeof x === "object" && isDate(x.date)) : []).slice().sort((p, q) => p.date.localeCompare(q.date));
  const noteTd = (x) => `<td class="muted" data-l="メモ">${x.note ? esc(x.note) : ""}</td>`;
  const nh = st.nationalHolidays, nhDates = entries(nh?.dates);

  const nationalSec = `<section class="panel" aria-labelledby="h-nat"><h2 id="h-nat" style="margin-top:0">日本の祝日</h2>
      <p class="note" style="margin:0 0 10px">営業日の計算で飛ばす日です。内閣府の祝日一覧から、Claude Code が取得して保存します（更新は <span class="mono">/pj-lens:holidays</span>。この画面からは取得しません）。</p>
      ${warnOf("nationalHolidays")}
      ${nh && typeof nh === "object" && isDate(nh.fetchedAt) && nhDates.length
        ? `<p style="margin:0 0 8px">取得日 <span class="mono">${esc(nh.fetchedAt)}</span>・<span class="mono">${nhDates.length} 件</span>（<span class="mono">${esc(nhDates[0].date)}〜${esc(nhDates.at(-1).date)}</span>）。今日以降の祝日:</p>
         ${nhRows ? `<div class="tscroll"><table class="tbl"><tbody>${nhRows}</tbody></table></div>` : `<p class="muted" style="margin:0">今日以降の祝日は、取得した範囲にありません。<span class="mono">/pj-lens:holidays</span> で取り直してください。</p>`}`
        : `<p class="muted" style="margin:0">まだ取得していません。Claude Code で <span class="mono">/pj-lens:holidays</span> を実行すると取得します。</p>`}

  const kindOptions = (cur) => HOLIDAY_KINDS.concat(HOLIDAY_KINDS.includes(cur) || cur === undefined ? [] : [cur]).map((k) => `<option${k === (cur ?? HOLIDAY_KINDS[0]) ? " selected" : ""}>${esc(k)}</option>`).join("");
  const holidayRows = entries(st.holidays).map((x) => `<tr><td class="mono" data-l="日付">${esc(x.date)}</td><td data-l="区分"><select class="in sm" data-hrowkind="${esc(x.date)}" aria-label="${esc(x.date)} の区分">${kindOptions(x.kind)}</select></td>${noteTd(x)}<td data-l=""><button class="btn" data-hdel="${esc(x.date)}" aria-label="${esc(x.date)} を休みから外す">削除</button></td></tr>`).join("");
  const holidaySec = `<section class="panel" aria-labelledby="h-hol"><h2 id="h-hol" style="margin-top:0">休み（手動）</h2>

      ${warnOf("holidays")}
      <div class="tscroll"><table class="tbl edit"><thead><tr><th>日付</th><th>区分</th><th>メモ</th><th></th></tr></thead><tbody>${holidayRows || `<tr><td colspan="4" class="muted">休みは登録されていません。下の行から追加します。</td></tr>`}
        <tr><td data-l="日付"><input class="in" type="date" data-hnew aria-label="休みの開始日"> 〜 <input class="in" type="date" data-hto aria-label="休みの終了日（期間のとき）"></td><td data-l="区分"><select class="in sm" data-hkind aria-label="追加する休みの区分">${kindOptions()}</select></td><td data-l="メモ"><input class="in" data-hnote placeholder="メモ（任意）" aria-label="休みのメモ"></td><td data-l=""><button class="btn" data-hadd>＋ 追加</button></td></tr></tbody></table></div>

  const workdaySec = `<section class="panel" aria-labelledby="h-wrk"><h2 id="h-wrk" style="margin-top:0">営業日として扱う日</h2>
      <p class="note" style="margin:0 0 10px">土日・祝日・休みでも、この日は営業日として数えます（休日出勤など）。変更はその場でファイルに保存されます。</p>

      ${projects.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>プロジェクト</th><th>ファイル</th><th>日付</th><th>追加</th><th>更新</th></tr></thead><tbody>${wbsRows}</tbody></table></div>` : `<p class="muted" style="margin:0">プロジェクトがありません。</p>`}
    </section>
  </div>`;
}

return { settingsInputValues, renderSettings };
})();

const { renderInboxBar } = (() => {
// 画面下端の「Claude Code に依頼する」の帯と引き出し（依頼の入力・履歴・提案のカード）。描画のみで、副作用はない。
// 属性: 開閉 data-ib-toggle / 対象 data-ib-project / 入力 data-ib-text / 例 data-ib-example / 送信 data-ib-send /
//       提案 data-ib-reason・data-ib-cause・data-ib-approve・data-ib-reply・data-ib-replysend・data-ib-reject / 再提案 data-ib-retry（値は依頼の ID）




const STATUS = {
  pending: ["送信済み", "wait"], working: ["処理中", "wait"], question: ["聞き返しがあります", "warn"], proposed: ["提案があります", "ok"],
  applied: ["反映済み", "done"], rejected: ["却下", "off"], failed: ["失敗", "bad"],
};
const EXAMPLES = [["due", "期限が動いた"], ["pred", "先行を結ぶ"], ["add", "タスクを登録"]];

const two = (n) => String(n).padStart(2, "0");
/** ISO 日時 → 「10/21 14:32」（この端末の時刻） */
function fmtAt(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? "" : `${two(d.getMonth() + 1)}/${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
}

const taskLabel = (data, id) => { const t = (data.tasks ?? []).find((x) => x.id === id); return t ? `${esc(id)} ${esc(t.title)}` : esc(id); };

function sectionHtml(data, s) {
  if (s.kind === "due") {
    const rows = s.rows.map((r) => `<tr><td class="id">${esc(r.taskId)}</td><td>${esc(r.title)}</td><td class="mono">${fmtMD(r.oldDue)}</td><td class="mono"><b>${fmtMD(r.newDue)}</b></td><td>${esc(r.reason)}</td></tr>`).join("");
    return `<div class="ib-sec"><b>期限の変更（${s.rows.length} 件）</b><table class="tbl"><thead><tr><th>ID</th><th>件名</th><th>旧期限</th><th>新期限</th><th>理由</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (s.kind === "pred") {
    const label = { add: "追加", remove: "削除", same: "変更なし" };
    const rows = s.rows.map((r) => `<li><span class="mono">${esc(r.predId)} → ${esc(r.taskId)}</span> <span class="pill ${r.action === "same" ? "off" : "ok"}">${label[r.action] ?? esc(r.action)}</span> <span class="muted">${taskLabel(data, r.predId)} → ${taskLabel(data, r.taskId)}</span></li>`).join("");
    return `<div class="ib-sec"><b>先行の対応付け</b><ul class="ib-list">${rows}</ul></div>`;
  }
  if (s.kind === "add") {
    const rows = s.rows.map((r, i) => `<tr data-row="${i + 1}"><td class="mono">${i + 1}</td><td>${esc(r.title)}</td><td>${r.group ? esc(r.group) : "（なし）"}${r.subgroup ? ` ▸ ${esc(r.subgroup)}` : ""}</td><td class="mono">${esc(r.businessDays ?? "—")}</td><td class="mono">${fmtMD(r.due)}</td><td class="mono">${(r.predecessors ?? []).length ? esc(r.predecessors.join(", ")) : "—"}</td></tr>`).join("");
    return `<div class="ib-sec"><b>タスクの登録（${s.rows.length} 件）</b><table class="tbl"><thead><tr><th>#</th><th>件名</th><th>大項目 ▸ 中項目</th><th>営業日</th><th>期限</th><th>先行</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return "";
}

const threadHtml = (r) => r.thread.slice(1).map((m) => `<div class="ib-msg ${m.role}"><span class="muted">${m.role === "user" ? "あなた" : "Claude Code"}</span> ${esc(m.text)}</div>`).join("");

function detailHtml(data, r, ui) {
  if (r.status === "proposed" && r.proposal) {
    const p = r.proposal;
    const reason = ui.reasons?.[r.id] ?? p.reason ?? "";
    const cause = ui.causes?.[r.id] ?? p.cause ?? "その他";
    const warns = (p.warnings ?? []).map((w) => `<div class="ib-warn">${esc(w)}</div>`).join("");
    return `<div class="ib-card">${threadHtml(r)}${p.sections.map((s) => sectionHtml(data, s)).join("")}${warns}
      <div class="ib-ctl"><label>原因<select class="in" data-ib-cause="${esc(r.id)}" aria-label="原因">${CAUSES.map((c) => `<option${c === cause ? " selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <label style="flex:1 1 220px">変更履歴に残す理由<input class="in" data-ib-reason="${esc(r.id)}" value="${esc(reason)}" aria-label="変更履歴に残す理由"></label></div>
      <div class="ib-act"><button class="btn primary" data-ib-approve="${esc(r.id)}">承認して反映する</button><button class="btn" data-ib-reject="${esc(r.id)}">却下する</button></div>
      <div class="ib-ctl"><input class="in" data-ib-reply="${esc(r.id)}" value="${esc(ui.replies?.[r.id] ?? "")}" placeholder="修正の依頼（例: A5 は 5 営業日にして）" aria-label="修正の依頼" style="flex:1 1 240px"><button class="btn warm" data-ib-replysend="${esc(r.id)}">修正を依頼する</button></div></div>`;
  }
  if ((r.status === "pending" || r.status === "working") && r.thread.length > 1) {
    return `<div class="ib-card">${threadHtml(r)}</div>`;
  }
  if (r.status === "question") {
    return `<div class="ib-card">${threadHtml(r)}<div class="ib-ctl"><input class="in" data-ib-reply="${esc(r.id)}" value="${esc(ui.replies?.[r.id] ?? "")}" placeholder="返信" aria-label="返信" style="flex:1 1 240px"><button class="btn primary" data-ib-replysend="${esc(r.id)}">返信する</button></div></div>`;
  }
  if (r.status === "failed") {
    return `<div class="ib-card">${threadHtml(r)}<div class="ib-act"><button class="btn" data-ib-retry="${esc(r.id)}">もう一度提案してもらう</button></div></div>`;
  }
  if (r.status === "applied" && r.result) {
    return `<div class="ib-card muted">${esc(r.result.summary)}（${r.result.by === "claude" ? "Claude Code で承認" : "この画面で承認"}）</div>`;
  }
  return "";
}

/**
 * @param ui { open, canWrite, nowMs, text, projectId, replies, reasons, causes }  text は入力の下書き、projectId は対象（""＝すべて）
 */
function renderInboxBar(data, ui) {
  if (!ui.canWrite) {
    return `<div class="ib ib-off"><div class="ib-bar"><b>Claude Code に依頼する</b><span class="ib-hint">この機能には、ファイルへの直接保存が必要です（Edge か Chrome で、データファイルを開いて使います）</span></div></div>`;
  }
  const reqs = data.inbox?.requests ?? [];
  const proposed = reqs.filter((r) => r.status === "proposed").length;
  const watching = isWatching(data, ui.nowMs);
  const state = `<span class="ib-state ${watching ? "on" : "off"}"><i></i>${watching ? "Claude Code が見ています" : "Claude Code が見ていません"}</span>`;
  const badge = proposed ? `<span class="ib-badge">提案が ${proposed} 件届いています</span>` : "";
  const head = `<div class="ib-bar"><button class="ib-toggle" data-ib-toggle aria-expanded="${ui.open}">${ui.open ? "▼ 閉じる" : "▲ 開く"}</button><b>Claude Code に依頼する</b>${ui.open ? "" : `<span class="ib-hint">「A3 が 5 日遅れた」「A3 の後に A4, A5」「このタスクを登録して」など</span>`}<span class="ib-sp"></span>${badge}${state}</div>`;
  if (!ui.open) return `<div class="ib">${head}</div>`;

  const projects = data.projects ?? [];
  const select = `<select class="in" data-ib-project aria-label="対象のプロジェクト"><option value="">すべて</option>${projects.map((p) => `<option value="${esc(p.id)}"${p.id === ui.projectId ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`;
  const examples = EXAMPLES.map(([k, l]) => `<button class="ib-ex" data-ib-example="${k}">${l}</button>`).join("");
  const history = [...reqs].reverse().map((r) => {
    const [label, tone] = STATUS[r.status] ?? [r.status, "off"];
    const proj = r.projectId ? (projects.find((p) => p.id === r.projectId)?.name ?? r.projectId) : "すべて";
    return `<li class="ib-req" data-ib-req="${esc(r.id)}" data-status="${esc(r.status)}"><div class="ib-rh"><span class="mono muted">${esc(fmtAt(r.at))}</span><span class="pill ${tone}">${label}</span><span class="muted">対象: ${esc(proj)}</span></div><div class="ib-rt">${esc(r.thread[0]?.text ?? "")}</div>${detailHtml(data, r, ui)}</li>`;
  }).join("");
  const hint = watching ? "" : `<div class="ib-note">Claude Code が見ていないようです。Claude Code で <span class="mono">/pj-lens:watch</span> を実行すると、依頼を受け取ります。</div>`;
  return `<div class="ib open">${head}<section class="ib-drawer" role="dialog" aria-label="Claude Code に依頼する"><div class="ib-body">
    <div class="ib-compose"><div class="ib-row"><label>対象 ${select}</label><span class="muted">書き方の例（押すと入ります）:</span>${examples}</div>
      <label for="ib-text" class="muted">依頼（文章で。複数の種類を、まとめて書いても構いません）</label>
      <textarea id="ib-text" class="in" data-ib-text rows="7">${esc(ui.text)}</textarea>
      <div class="ib-row"><button class="btn primary" data-ib-send>依頼を送る</button><span class="muted">送ると、依頼がファイルに書かれます。承認するまで、タスクは変わりません。</span></div>${hint}</div>
    <div class="ib-hist"><div class="muted">これまでの依頼</div>${history ? `<ul class="ib-reqs">${history}</ul>` : `<p class="muted" style="margin:6px 0">まだ依頼はありません。</p>`}</div>
  </div></section></div>`;
}

return { renderInboxBar };
})();

/* src/ui/views/project.js */
const { renderProjects } = (() => {
// プロジェクト画面: 絞り込み × ガント／リスト、右に「今日のタスク」「今日の優先」











const actText = (data, id) => {
  const a = taskActual(data, id);
  return a.count ? `${a.hours.toFixed(1)}h${a.firstDate ? "・初回 " + fmtMD(a.firstDate) : ""}・${a.count}回` : "—";
};

function renderList(data, p, today, opts) {
  const prog = projectProgress(data, p.id);
  const tasks = data.tasks.filter((t) => t.projectId === p.id);
  const labels = groupLabels(data.settings);
  const shown = opts.group && opts.group !== "all" ? tasks.filter((t) => (t.group ?? "") === opts.group) : tasks;
  const rowOf = (t) => {
    const preds = t.predecessors ?? [];
    const cand = predecessorCandidates(data, t.id).map((id) => data.tasks.find((u) => u.id === id));
    const chips = preds.map((id) => `<span class="chip">${esc(id)}<button data-rmpre="${esc(t.id)}|${esc(id)}" aria-label="${esc(id)} を先行から外す">×</button></span>`).join("");
    const add = cand.length ? `<select class="in sm" data-addpre="${esc(t.id)}" aria-label="先行タスクを追加"><option value="">＋先行</option>${cand.map((u) => `<option value="${esc(u.id)}">${esc(u.id)} ${esc(u.title)}</option>`).join("")}</select>` : "";
    const needParty = t.status === "Waiting" && !t.waitingOn?.party ? `<span class="pill wait">待ち先を入力</span>` : "";
    const dependents = data.tasks.filter((o) => (o.predecessors ?? []).includes(t.id)).map((o) => o.id);
    const delCell = opts.askDel === t.id
      ? `<div class="ask">${dependents.length ? `後続 ${esc(dependents.join(", "))} の先行から外れます。` : "このタスクを削除します。"}<div style="display:flex;gap:6px;margin-top:4px"><button class="btn danger" data-delyes="${esc(t.id)}">削除する</button><button class="btn" data-delno>やめる</button></div></div>`
      : `<button class="btn" data-del="${esc(t.id)}" aria-label="${esc(t.id)} を削除">削除</button>`;
    const late = taskFlags(t, today, data.settings).includes("overdue");
    return `<tr data-row="${esc(t.id)}"><td class="id" data-l="ID">${esc(t.id)}</td>
      <td data-l="${esc(labels.group)}"><input class="in gi" data-f="group" data-id="${esc(t.id)}" value="${esc(t.group ?? "")}" aria-label="${esc(t.id)} の${esc(labels.group)}"></td>
      <td data-l="${esc(labels.subgroup)}"><input class="in gi" data-f="subgroup" data-id="${esc(t.id)}" value="${esc(t.subgroup ?? "")}" aria-label="${esc(t.id)} の${esc(labels.subgroup)}"></td>
      <td data-l="件名"><input class="in" id="f-${esc(t.id)}-t" data-f="title" data-id="${esc(t.id)}" value="${esc(t.title)}" aria-label="${esc(t.id)} の件名"></td>
      <td data-l="状態">${opts.pendingWait === t.id
        ? `<div class="ask" style="max-width:none">待ち先を入力<input class="in" data-waitparty="${esc(t.id)}" placeholder="ベンダー・部署名" aria-label="${esc(t.id)} の待ち先"><div style="display:flex;gap:6px;margin-top:4px"><button class="btn" data-waitok="${esc(t.id)}">Waiting にする</button><button class="btn" data-waitno>やめる</button></div></div>`
        : opts.pendingDone?.id === t.id && !opts.todayIds?.has(t.id)
        ? doneAskHtml(opts.pendingDone)
        : `<select class="in" data-f="status" data-id="${esc(t.id)}" aria-label="${esc(t.id)} の状態">${TASK_STATUS.map((o) => `<option ${o === t.status ? "selected" : ""}>${o}</option>`).join("")}</select>${late ? ` <span class="pill late">期限超過</span>` : ""}`}</td>
      <td data-l="開始">${preds.length ? `<span class="mono muted" title="先行タスクの期限から決まります">${fmtMD(taskStart(data, t.id))} <small>先行から</small></span>` : `<input class="in" type="date" data-f="start" data-id="${esc(t.id)}" value="${esc(t.start ?? "")}" aria-label="${esc(t.id)} の開始日">`}</td>
      <td data-l="期限"><input class="in" type="date" data-f="due" data-id="${esc(t.id)}" value="${esc(t.due)}" aria-label="${esc(t.id)} の期限"></td>
      <td data-l="先行"><div class="chips">${chips}${add}</div></td>
      <td data-l="待ち先"><input class="in" data-f="party" data-id="${esc(t.id)}" value="${esc(t.waitingOn?.party ?? "")}" placeholder="${t.status === "Waiting" ? "ベンダー・部署名" : "—"}" ${t.status === "Waiting" ? "" : "disabled"} aria-label="${esc(t.id)} の待ち先">${needParty}</td>
      <td data-l="重要度"><select class="in sm" data-f="importance" data-id="${esc(t.id)}" aria-label="${esc(t.id)} の重要度">${[["", "—"], ["high", "高"], ["mid", "中"], ["low", "低"]].map(([v, l]) => `<option value="${v}" ${(t.importance ?? "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
      <td data-l="メモ"><input class="in" data-f="memo" data-id="${esc(t.id)}" value="${esc(t.memo ?? "")}" placeholder="メモ" aria-label="${esc(t.id)} のメモ"></td>
      <td data-l="実績" class="mono muted">${actText(data, t.id)}</td><td data-l="">${delCell}</td></tr>`;
  };
  // (大項目, 中項目) ごとに見出し行を入れて並べる。「＋」はそのグループへ追加する入口なので、0 件でも「（なし）」を出す（絞り込み中は除く）
  const filtered = opts.group && opts.group !== "all";
  const secs = groupSections(shown, { ensureNone: !filtered });
  if (filtered && !secs.length) secs.push({ group: opts.group, subgroup: "", tasks: [] }); // 絞り込んだ大項目のタスクがなくても、そこへ追加できるように
  const rows = secs.map((sec) => {
    const name = `${sec.group || "（なし）"}${sec.subgroup ? ` ▸ ${sec.subgroup}` : ""}`;
    return `<tr class="grp-tr"><td colspan="13"><b>${esc(sec.group || "（なし）")}</b>${sec.subgroup ? ` <span class="muted">▸ ${esc(sec.subgroup)}</span>` : ""} <button class="plus" data-addat="${esc(p.id)}" data-ag="${esc(sec.group)}" data-asg="${esc(sec.subgroup)}" aria-label="${esc(name)} にタスクを追加">＋</button></td></tr>${sec.tasks.map(rowOf).join("")}`;
  }).join("");

  const projTaskIds = new Set(tasks.map((t) => t.id));
  const log = (data.changeLog ?? []).filter((l) => l.source == null || Number(l.deltaDays) !== 0 || l.superseded === true).filter((l) => (l.taskIds ?? []).some((id) => projTaskIds.has(id)))
    .map((l) => `<li><span class="d">${fmtMD(l.at)}</span><span><span class="pill">${esc(l.cause ?? "—")}</span> ${esc(l.reason)} <span class="mono muted">(${esc((l.taskIds ?? []).join(", "))}${l.superseded === true ? "" : `・${Number(l.deltaDays) > 0 ? "+" : ""}${Number(l.deltaDays)}日`})</span></span></li>`).join("")
    || `<li class="muted">変更履歴はありません。</li>`;

  const ms = (p.milestones ?? []).map((m, i) => `<div class="msrow"><input class="in" data-mf="name" data-pid="${esc(p.id)}" data-i="${i}" value="${esc(m.name)}" aria-label="マイルストーン名"><input class="in sm" type="date" data-mf="date" data-pid="${esc(p.id)}" data-i="${i}" value="${esc(m.date)}" aria-label="マイルストーンの日付"><button class="btn" data-msdel="${esc(p.id)}|${i}" aria-label="${esc(m.name)} を削除">削除</button></div>`).join("")
    || '<p class="muted" style="margin:0">マイルストーンはありません。</p>';

  const delProj = opts.askDelProject === p.id
    ? `<span class="ask" style="max-width:none">プロジェクトと配下のタスク ${tasks.length} 件を削除します。 <button class="btn danger" data-pdelyes="${esc(p.id)}">削除する</button> <button class="btn" data-pdelno>やめる</button></span>`
    : `<button class="btn" data-pdel="${esc(p.id)}">プロジェクトを削除</button>`;

  return `<section class="panel" aria-label="${esc(p.name)}"><div class="phead"><div><h2><input class="in" data-pf="name" data-pid="${esc(p.id)}" value="${esc(p.name)}" style="font-size:17px;font-weight:700" aria-label="プロジェクト名"></h2><div class="kv" style="align-items:center">
      <label>種別 <select class="in sm" data-pf="type" data-pid="${esc(p.id)}" aria-label="種別">${PROJECT_TYPE.map((o) => `<option ${o === p.type ? "selected" : ""}>${o}</option>`).join("")}</select></label>
      <label>状態 <select class="in sm" data-pf="status" data-pid="${esc(p.id)}" aria-label="${esc(p.name)} の状態">${PROJECT_STATUS.map((o) => `<option ${o === p.status ? "selected" : ""}>${o}</option>`).join("")}</select></label>
      <label>開始 <input class="in sm" type="date" data-pf="start" data-pid="${esc(p.id)}" value="${esc(p.start)}" aria-label="${esc(p.name)} の開始日"></label>
      <label>期限 <input class="in sm" type="date" data-pf="due" data-pid="${esc(p.id)}" value="${esc(p.due)}" aria-label="${esc(p.name)} の期限"></label>
      <span>進捗 <b class="mono">${prog.done}/${prog.total}</b> (${Math.round(prog.rate * 100)}%)</span><span class="mono hrs">${(() => { const hh = projectHours(data, p.id); return `稼働 ${(hh.task + hh.meeting).toFixed(1)}h（タスク ${hh.task.toFixed(1)}h・会議 ${hh.meeting.toFixed(1)}h）`; })()}</span></div></div><div>${flagPills(data, p.id, today, projectFlags(data, p.id, today))}</div></div>
    <div class="tscroll"><table class="tbl edit"><thead><tr><th>ID</th><th>${esc(labels.group)}</th><th>${esc(labels.subgroup)}</th><th>件名</th><th>状態</th><th>開始</th><th>期限</th><th>先行</th><th>待ち先</th><th>重要度</th><th>メモ</th><th>実績</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap"><span class="note">変更はその場でファイルに保存されます。後続の日程をまとめて見直すときは、Claude Code の replan に頼みます。</span></div>
    <h2 style="margin:18px 0 8px;font-size:13px">マイルストーン</h2>
    <div class="mslist">${ms}<div><button class="btn" data-msadd="${esc(p.id)}">＋ マイルストーンを追加</button> <span class="note">ガントに◆で表示されます。</span></div></div>
    <h2 style="margin:18px 0 2px;font-size:13px">日程変更の履歴</h2><p class="note" style="margin:0 0 8px">日程が動いたとき、いつ・何が・なぜ動いたか(原因: ベンダー／社内／自分)の記録です。新しい報告に置き換えられた古いメール報告は、日程の変更がなくても、要点だけを残します。Claude Code の replan が日程を更新したときだけ記録され、画面での日付変更は記録されません。</p><ul class="log">${log}</ul>
    <div style="margin-top:18px">${delProj}</div></section>`;
}

/**
 * @param opts.filter  "all" か projectId
 * @param opts.view    "gantt" | "list"
 * @param opts.window  ガントの表示期間
 * @param opts.pendingReplan 日程変更の確認待ち(あれば確認パネルを出す)
 * @param opts.group   "all" か大項目の名前(その大項目のタスクだけを出す)
 * @param opts.showPrio / opts.showActual  今日の優先・ガントの実績を出すか(既定は出す)
 */
function renderProjects(data, today, opts = {}) {
  const { view = "gantt", hideDone = false, showPrio = true, showActual = true } = opts;
  const addBtn = `<button class="btn" data-addproject>＋ プロジェクトを追加</button>`;
  if (!data.projects.length) {
    return `<div class="toolbar"><div></div>${addBtn}</div><section class="panel"><p class="muted" style="margin:0">プロジェクトがありません。「＋ プロジェクトを追加」から追加してください。</p></section>`;
  }
  const filter = opts.filter && data.projects.some((p) => p.id === opts.filter) ? opts.filter : "all";
  const ids = filter === "all" ? data.projects.map((p) => p.id) : [filter];
  const chips = [["all", "すべて"], ...data.projects.map((p) => [p.id, p.name])]
    .map(([k, l]) => `<button class="chip-btn" data-filter="${esc(k)}" aria-pressed="${filter === k}">${esc(l)}</button>`).join("");
  const names = groupNames(data.tasks.filter((t) => ids.includes(t.projectId)));
  const group = names.includes(opts.group) ? opts.group : "all";
  const labels = groupLabels(data.settings);
  const gsel = names.length
    ? `<label class="gfilter">${esc(labels.group)} <select class="in sm" data-groupfilter aria-label="${esc(labels.group)}で絞り込み"><option value="all"${group === "all" ? " selected" : ""}>すべて</option>${names.map((n) => `<option value="${esc(n)}"${n === group ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></label>`
    : "";
  const todayIds = showPrio ? new Set(todayTaskIds(data, today)) : new Set();
  const body = view === "gantt"
    ? `<section class="panel"><h2 class="sr">ガントチャート</h2>${renderGantt(data, ids, today, { window: opts.window, hideDone, askDel: opts.askDel, showActual, group, addAt: opts.addAt })}</section>`
    : `<div style="display:flex;flex-direction:column;gap:16px">${ids.map((id) => renderList(data, data.projects.find((p) => p.id === id), today, { ...opts, group, todayIds })).join("")}</div>`;
  return `<div class="toolbar ptool"><div style="display:flex;gap:6px;flex-wrap:wrap" role="group" aria-label="プロジェクトで絞り込み">${chips}${gsel}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${addBtn}<div class="seg" role="group" aria-label="表示"><button data-pview="gantt" aria-pressed="${view === "gantt"}">ガント</button><button data-pview="list" aria-pressed="${view === "list"}">リスト</button></div></div></div>
    ${opts.pendingReplan ? renderReplanPanel(data, opts.pendingReplan) : ""}
    <div class="cols${showPrio ? "" : " one"}">${body}${showPrio ? renderSide(data, today, { sched: false, pendingDone: opts.pendingDone }) : ""}</div>`;
}

return { renderProjects };
})();

/* src/ui/views/report.js */
const { buildReport } = (() => {
// 進捗レポート(自己完結の HTML)の生成。Node にもブラウザにも依存しない純関数







const PRINT_CSS = `

const cell = (s) => `<td>${s}</td>`;

const hm = (h) => `${h.toFixed(1)}h`;

function overview(data, projects, today, asOf, rows) {
  const body = projects.map((p) => {
    const prog = progressAsOf(data, p.id, asOf);
    const next = (p.milestones ?? []).find((m) => m.date >= today);
    const hours = rows.find((r) => r.projectId === p.id)?.total ?? 0;
    return `<tr>${cell(`<strong>${esc(p.name)}</strong>`)}${cell(esc(p.type))}${cell(esc(p.status))}${cell(`<span class="mono">${fmtMD(p.start)}〜${fmtMD(p.due)}</span>`)}${cell(`<span class="mono">${prog.done}/${prog.total}（${Math.round(prog.rate * 100)}%）</span>`)}${cell(`<span class="mono">${hm(hours)}</span>`)}${cell(next ? `${esc(next.name)} <span class="mono">${fmtMD(next.date)}</span>` : "—")}${cell(flagPills(data, p.id, today, projectFlags(data, p.id, today)) || "—")}</tr>`;
  }).join("");
  return `<table><thead><tr><th>プロジェクト</th><th>種別</th><th>状態</th><th>期間</th><th>進捗（${fmtMD(asOf)}時点）</th><th>稼働（期間内）</th><th>次のマイルストーン</th><th>遅延・リスク</th></tr></thead><tbody>${body}</tbody></table>`;
}

function detail(data, p, today, period, row) {
  const tasks = data.tasks.filter((t) => t.projectId === p.id);
  const trs = tasks.map((t) => {
    const a = row?.tasks.find((x) => x.id === t.id) ?? { hours: 0, count: 0 };
    const late = taskFlags(t, today, data.settings).includes("overdue");
    return `<tr>${cell(`<span class="mono">${esc(t.id)}</span>`)}${cell(esc(t.title))}${cell(statusDotHtml(t, late))}${cell(`<span class="mono">${fmtMD(taskStart(data, t.id))}〜${fmtMD(t.due)}</span>`)}${cell(esc((t.predecessors ?? []).join(", ")) || "—")}${cell(t.waitingOn ? `${esc(t.waitingOn.party)}（${esc(t.waitingOn.since.slice(5).replace("-", "/"))}〜）` : "—")}${cell(a.count ? `<span class="mono">${hm(a.hours)}・${a.count}回</span>` : "—")}</tr>`;
  }).join("");
  const ids = new Set(tasks.map((t) => t.id));
  const log = (data.changeLog ?? []).filter((l) => l.source == null || Number(l.deltaDays) !== 0 || l.superseded === true).filter((l) => l.at >= period.start && l.at <= period.end).filter((l) => (l.taskIds ?? []).some((id) => ids.has(id)))
    .map((l) => `<tr>${cell(`<span class="mono">${fmtMD(l.at)}</span>`)}${cell(esc((l.taskIds ?? []).join(", ")))}${cell(l.superseded === true ? "—" : `<span class="mono">${Number(l.deltaDays) > 0 ? "+" : ""}${Number(l.deltaDays)}日</span>`)}${cell(esc(l.cause ?? "—"))}${cell(esc(l.reason))}</tr>`).join("");
  // ガントの見出しにプロジェクト名と概要が出るので、タスクがあるときは重ねて出さない
  const heading = tasks.length ? "" : `<h3>${esc(p.name)}</h3><div class="sub">${esc(p.type)} ・ ${esc(p.status)} ・ ${fmtMD(p.start)}〜${fmtMD(p.due)}</div>`;
  return `<section class="proj">${heading}
    ${renderGantt(data, [p.id], today, { window: "all", readonly: true })}
    ${tasks.length ? `<table style="margin-top:10px"><thead><tr><th>ID</th><th>件名</th><th>状態</th><th>計画（開始〜期限）</th><th>先行</th><th>待ち先</th><th>実績（期間内）</th></tr></thead><tbody>${trs}</tbody></table>` : ""}
    <h4 style="margin:12px 0 4px;font-size:13px">日程変更の履歴</h4>
    ${log ? `<table><thead><tr><th>日付</th><th>対象</th><th>動いた日数</th><th>原因</th><th>理由</th></tr></thead><tbody>${log}</tbody></table>` : `<p class="muted" style="margin:0;font-size:12px">期間内の変更履歴はありません。</p>`}</section>`;
}

function actuals(data, projects, rows, unassigned) {
  const name = (id) => esc(projects.find((p) => p.id === id)?.name ?? id);
  // プロジェクト未設定の会議は、表の中では 1 行として扱う（合計に入れるため）
  const um = unassigned && (unassigned.meetingHours > 0 || unassigned.unconfirmedMeetings > 0)
    ? [{ label: "プロジェクト未設定の会議", taskHours: 0, taskCount: 0, meetingHours: unassigned.meetingHours, total: unassigned.meetingHours, unconfirmedTasks: 0, unconfirmedMeetings: unassigned.unconfirmedMeetings }] : [];
  const tableRows = [...rows, ...um];
  const sum = (f) => tableRows.reduce((a, r) => a + f(r), 0);
  const unc = (r) => (r.unconfirmedTasks || r.unconfirmedMeetings ? `${r.unconfirmedTasks + r.unconfirmedMeetings}件（作業枠 ${r.unconfirmedTasks}・会議 ${r.unconfirmedMeetings}）` : "—");
  const trs = tableRows.map((r) => `<tr>${cell(`<strong>${r.label ? esc(r.label) : name(r.projectId)}</strong>`)}${cell(`<span class="mono">${hm(r.taskHours)}・${r.taskCount}回</span>`)}${cell(`<span class="mono">${hm(r.meetingHours)}</span>`)}${cell(`<span class="mono">${hm(r.total)}</span>`)}${cell(unc(r))}</tr>`).join("");
  const total = tableRows.length > 1 ? `<tr><td><strong>合計</strong></td>${cell(`<span class="mono">${hm(sum((r) => r.taskHours))}・${sum((r) => r.taskCount)}回</span>`)}${cell(`<span class="mono">${hm(sum((r) => r.meetingHours))}</span>`)}${cell(`<span class="mono">${hm(sum((r) => r.total))}</span>`)}${cell("")}</tr>` : "";
  const each = rows.map((r) => {
    const tasks = r.tasks.length ? `<table><thead><tr><th>ID</th><th>件名</th><th>作業時間</th><th>回数</th></tr></thead><tbody>${r.tasks.map((t) => `<tr>${cell(`<span class="mono">${esc(t.id)}</span>`)}${cell(esc(t.title))}${cell(`<span class="mono">${hm(t.hours)}</span>`)}${cell(`<span class="mono">${t.count}回</span>`)}</tr>`).join("")}</tbody></table>` : `<p class="muted" style="margin:0;font-size:12px">期間内に作業した実績はありません。</p>`;
    const done = r.done.length ? `<ul style="margin:4px 0 0;padding-left:18px;font-size:12px">${r.done.map((t) => `<li><span class="mono">${esc(t.id)}</span> ${esc(t.title)} <span class="muted mono">${fmtMD(t.doneAt)}</span></li>`).join("")}</ul>` : `<p class="muted" style="margin:0;font-size:12px">なし</p>`;
    return `<section class="proj"><h3>${name(r.projectId)}</h3>${tasks}<h4 style="margin:10px 0 4px;font-size:13px">完了したタスク</h4>${done}</section>`;
  }).join("");
  return `<table><thead><tr><th>プロジェクト</th><th>作業</th><th>会議（確認済み）</th><th>計</th><th>未確認（含みません）</th></tr></thead><tbody>${trs}${total}</tbody></table>${each}`;
}

/** 期間のうち今日以降の予定（日別）。selected は選んだプロジェクトの ID の集合。全プロジェクトを選んだときだけ、プロジェクト未設定の会議も載せる */
function plan(data, from, to, selected, all, today, now, showTitles) {
  const known = new Set(data.projects.map((p) => p.id));
  const mine = (m) => selected.has(m.projectId) || (all && !known.has(m.projectId));
  const days = [];
  for (let d = from; d <= to; d = addDays(d, 1)) days.push(d);
  const body = days.map((d) => {
    const meetings = (data.events ?? []).filter((m) => m.date === d && !m.skip && mine(m)).map((m) => ({ s: m.start, html: `<div class="slot"><span class="t">${esc(m.start)}〜${esc(m.end)}</span><span class="tag mtg">会議</span>${showTitles ? esc(m.title) : ""}</div>` }));
    const sessions = data.tasks.filter((t) => selected.has(t.projectId)).flatMap((t) => (t.sessions ?? []).filter((s) => s.date === d).map((s) => {
      const kind = sessionKind(s, now);
      const label = { planned: ["plan", "予定"], actual: ["act", "実績"], unconfirmed: ["unconf", "未確認"] }[kind];
      return { s: s.start, html: `<div class="slot"><span class="t">${esc(s.start)}〜${esc(s.end)}</span><span class="tag ${label[0]}">${label[1]}</span>${esc(t.title)}</div>` };
    }));
    const due = data.tasks.filter((t) => selected.has(t.projectId) && t.due === d && t.status !== "Done" && t.status !== "Cancelled").map((t) => `<div class="slot"><span class="t">期限</span>${esc(t.title)}</div>`);
    const slots = [...meetings, ...sessions].sort((a, b) => toMin(a.s) - toMin(b.s)).map((x) => x.html);
    return { d, html: [...slots, ...due].join("") };
  }).filter((x) => x.html || !isWeekend(x.d));
  return body.map((x) => `<div class="day"><h3>${fmtMD(x.d)}(${wdJa(x.d)})</h3>${x.html || `<div class="slot muted">予定なし</div>`}</div>`).join("");
}

/**
 * 自己完結の HTML を作る。css はダッシュボードのスタイル。会議の件名は opts.showMeetingTitles（保存ごとの選択）が true のとき、省略時は settings.reportShowMeetingTitles が true のときだけ載せる。
 * opts: { showMeetingTitles（会議の件名を載せるか。既定は設定）, projectIds（既定は全部）, period（reportPeriod の結果。既定は今週）, title（<title>。既定は「プロジェクト進捗レポート 日付」）, now（{date, time}。未確認の判定に使う。既定は今日の 00:00 =今日の分は過去にしない）}
 */
function buildReport(data, today, css, opts = {}) {
  const period = opts.period ?? reportPeriod("thisWeek", today);
  const ids = new Set(opts.projectIds ?? data.projects.map((p) => p.id));
  const projects = data.projects.filter((p) => ids.has(p.id));
  const asOf = period.end < today ? period.end : today;
  const now = opts.now ?? { date: today, time: "00:00" };
  const allSelected = projects.length === data.projects.length;
  const { rows, unassigned } = periodReport(data, projects.map((p) => p.id), period, now, { includeUnassigned: allSelected });
  const title = opts.title ?? `プロジェクト進捗レポート ${today}`;
  const scope = allSelected ? "全プロジェクト" : projects.map((p) => esc(p.name)).join("、");
  const from = period.start > today ? period.start : today;
  const planBody = period.end >= today && projects.length ? plan(data, from, period.end, new Set(projects.map((p) => p.id)), allSelected, today, now, opts.showMeetingTitles ?? data.settings?.reportShowMeetingTitles === true) : "";
  const empty = (n, h) => `<h2 class="sec">${n}. ${h}</h2><p class="muted">プロジェクトがありません。</p>`;
  const body = projects.length
    ? `<h2 class="sec">1. 全体一覧</h2>${overview(data, projects, today, asOf, rows)}<h2 class="sec">2. プロジェクト別の詳細</h2>${projects.map((p) => detail(data, p, today, period, rows.find((r) => r.projectId === p.id))).join("")}<h2 class="sec">3. ${esc(period.label)}の実績</h2>${actuals(data, projects, rows, unassigned)}${planBody ? `<h2 class="sec">4. ${esc(period.label)}の予定</h2>${planBody}` : ""}`
    : `${empty(1, "全体一覧")}${empty(2, "プロジェクト別の詳細")}`;
  return `<!doctype html>
<html lang="ja" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)}</title>
<style>${css}\n${PRINT_CSS}</style></head>
<body><div class="rep"><h1>プロジェクト進捗レポート</h1><div class="sub">${today.replace(/-/g, "/")}(${wdJa(today)}) 時点 ・ 対象: ${scope} ・ 期間: ${esc(period.label)}（${fmtMD(period.start)}〜${fmtMD(period.end)}）</div>${body}</div></body></html>
`;
}

return { buildReport };
})();

/* src/ui/app.js */
(() => {
// ダッシュボード本体: 状態の保持、描画、保存、イベントの結線。判断ロジックは src/core、見た目は src/ui/views、データ編集は src/ui/edit.js。
const store = createStore();
let settingTimer = null; // 勤務時間の保存待ちのタイマー（changeSettingSoon）。render が最初に呼ばれる前に宣言しておく
const params = new URLSearchParams(location.search);
// ?today=2026-10-20&time=10:15 で「現在」を固定できる(デモ・動作確認用)
const clock = () => (params.get("today") ? { date: params.get("today"), time: params.get("time") ?? "10:15" } : nowLocal());

const S = {
  data: null, openError: "", saveFailed: false,
  screen: "project",

function toast(msg) {

/* ---------- 描画 ---------- */
function startScreen() {
  const canPick = typeof window.showOpenFilePicker === "function";
  return `<section class="panel"><h2>データファイルを開いてください</h2>
