header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin-block:-8px 0}

.toolbar.ptool{position:sticky;top:var(--hh,0px);z-index:9;background:var(--bg);padding:6px 0 10px;margin-bottom:0}

<script>/* src/core/dates.js */
const { isDate, isTime, addDays, dueAfter, diffDays, weekday, isWeekend, toMin, toHHMM, today, nowLocal } = (() => {
// 日付(YYYY-MM-DD)・時刻(HH:MM)の文字列演算。Date の UTC 変換によるずれを避けるため、数値分解で計算する。

const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
const TIME_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;

// 暦日 → 1970-01-01 からの通算日数（グレゴリオ暦、proleptic）
function toDays(y, m, d) {
  y -= m <= 2 ? 1 : 0;
  const era = Math.floor(y / 400);
  const yoe = y - era * 400;
  const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
  const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}

function fromDays(z) {
  z += 719468;
  const era = Math.floor(z / 146097);
  const doe = z - era * 146097;
  const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
  const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  const mp = Math.floor((5 * doy + 2) / 153);
  const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
  const m = mp + (mp < 10 ? 3 : -9);
  return [yoe + era * 400 + (m <= 2 ? 1 : 0), m, d];
}

const pad = (n, w = 2) => String(n).padStart(w, "0");

/** 実在する YYYY-MM-DD か */
function isDate(s) {
  if (typeof s !== "string") return false;
  const m = DATE_RE.exec(s);
  if (!m) return false;
  const [y, mo, d] = [+m[1], +m[2], +m[3]];
  const [y2, m2, d2] = fromDays(toDays(y, mo, d));
  return y === y2 && mo === m2 && d === d2;
}

/** HH:MM（00:00〜23:59）か */
function isTime(s) {
  return typeof s === "string" && TIME_RE.test(s);
}

function parse(s) {
  if (!isDate(s)) throw new Error(`日付の形式が不正です: ${s}`);
  const m = DATE_RE.exec(s);
  return toDays(+m[1], +m[2], +m[3]);
}

function addDays(date, n) {
  const [y, m, d] = fromDays(parse(date) + n);
  return `${pad(y, 4)}-${pad(m)}-${pad(d)}`;
}

/**
 * baseDate の businessDays 営業日後。businessDays は 0 以上の整数で、0 なら baseDate のまま。
 * cal.on（営業日の指定）の日は営業日。それ以外は、cal.off（休み）と土日を飛ばす。
 */
function dueAfter(baseDate, businessDays, cal = {}) {
  if (!Number.isInteger(businessDays) || businessDays < 0) throw new Error(`営業日は 0 以上の整数にしてください: ${businessDays}`);
  const set = (key, label) => {
    const list = cal?.[key] ?? [];
    if (!Array.isArray(list) || !list.every(isDate)) throw new Error(`${label}は日付（YYYY-MM-DD）の配列にしてください`);
    return new Set(list);
  };
  if (cal === null || typeof cal !== "object" || Array.isArray(cal)) throw new Error("休みと営業日の指定は { off, on } で渡してください");
  const off = set("off", "休み"), on = set("on", "営業日の指定");
  let d = baseDate;
  parse(d);
  for (let n = 0; n < businessDays;) {
    d = addDays(d, 1);
    if (on.has(d) || !(off.has(d) || isWeekend(d))) n++;
  }
  return d;
}

/** a - b（日数） */
function diffDays(a, b) {
  return parse(a) - parse(b);
}

/** 曜日（0=日 … 6=土） */
function weekday(date) {
  return (((parse(date) + 4) % 7) + 7) % 7;
}

const isWeekend = (date) => [0, 6].includes(weekday(date));

function toMin(hhmm) {
  if (!isTime(hhmm) && hhmm !== "24:00") throw new Error(`時刻の形式が不正です: ${hhmm}`);
  const [h, m] = hhmm.split(":");
  return +h * 60 + +m;
}

function toHHMM(min) {
  return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
}

/** 実行環境のローカル日付 */
function today() {
  const n = new Date();
  return `${pad(n.getFullYear(), 4)}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
}

/** 実行環境のローカル現在時刻 */
function nowLocal() {
  const n = new Date();
  return { date: today(), time: `${pad(n.getHours())}:${pad(n.getMinutes())}` };
}

return { isDate, isTime, addDays, dueAfter, diffDays, weekday, isWeekend, toMin, toHHMM, today, nowLocal };
})();

/* src/core/holidays.js */
const { calendarOf, offDayChecker, decodeHolidayCsv, parseHolidayCsv, pickRecent } = (() => {
// 営業日の計算に使う休みと営業日の指定（settings から取り出す）と、内閣府の祝日一覧（CSV）の解析。ネットワークには触れない。


const datesOf = (list) => (Array.isArray(list) ? list.filter((x) => isDate(x?.date)).map((x) => x.date) : []);

/** settings → dueAfter の cal。休み = 手動の休み + 日本の祝日、営業日 = 営業日の指定。形が違う値は無視する（validate が注意を出す） */
function calendarOf(settings) {
  const st = settings ?? {};
  return { off: [...datesOf(st.holidays), ...datesOf(st.nationalHolidays?.dates)], on: datesOf(st.workdays) };
}

/** 休みの日か（土日・休み・日本の祝日）。営業日の指定の日は、それらでも休みでない。スケジュールで枠を置けない日の判定に使う */
function offDayChecker(settings) {
  const { off, on } = calendarOf(settings);
  const offSet = new Set(off), onSet = new Set(on);
  return (date) => !onSet.has(date) && (isWeekend(date) || offSet.has(date));
}

/** 内閣府の祝日一覧（Shift_JIS）を文字列にする */
const decodeHolidayCsv = (bytes) => new TextDecoder("shift_jis").decode(bytes);

/** 「2026/1/1,元日」の行を { date, name } にして昇順で返す。ヘッダ・空行・日付でない行は飛ばす。有効な行が無ければ例外 */
function parseHolidayCsv(text) {
  const rows = [];
  for (const line of String(text).split(/\r?\n/)) {
    const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2}),(.*)$/.exec(line.trim());
    if (!m) continue;
    const date = `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    if (isDate(date)) rows.push({ date, name: m[4].trim() });
  }
  if (!rows.length) throw new Error("祝日の一覧を読み取れませんでした");
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

/* src/core/schema.js */
const { TASK_STATUS, PROJECT_STATUS, PROJECT_TYPE, IMPORTANCE, CAUSES, HOLIDAY_KINDS, REQUEST_STATUS, OP_KINDS, validate } = (() => {
// data.json の検証。errors は保存してはいけない不整合、warnings は保存を止めない注意。


const TASK_STATUS = ["To Do", "In Progress", "Waiting", "Done", "Cancelled"];
const PROJECT_STATUS = ["計画中", "進行中", "保留", "完了", "中止"];
const PROJECT_TYPE = ["増設", "更改", "改善", "不具合対処", "その他"];
const IMPORTANCE = ["high", "mid", "low"];
const CAUSES = ["ベンダー", "社内", "自分", "その他"];
const HOLIDAY_KINDS = ["祝日", "有給", "その他"];
const REQUEST_STATUS = ["pending", "working", "question", "proposed", "applied", "rejected", "failed"];
const OP_KINDS = ["moveDue", "addPred", "removePred", "addTask"];

const isDone = (t) => t.status === "Done" || t.status === "Cancelled";

/** 同じ日の枠が重なるか（端が接するだけは重ならない） */
const overlap = (a, b) => a.date === b.date && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);

/** 先行の循環を DFS で探す。循環に含まれるタスク ID の一覧を返す */
function findCycle(tasks) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const state = new Map(); // 1=探索中, 2=完了
  const stack = [];
  let found = null;
  const dfs = (id) => {
    if (found) return;
    state.set(id, 1);
    stack.push(id);
    for (const p of byId.get(id)?.predecessors ?? []) {
      if (!byId.has(p)) continue;
      if (state.get(p) === 1) { found = [...stack.slice(stack.indexOf(p)), p]; return; }
      if (!state.has(p)) dfs(p);
      if (found) return;
    }
    stack.pop();
    state.set(id, 2);
  };
  for (const t of tasks) if (!state.has(t.id)) dfs(t.id);
  return found;

/**
 * @param {object} data
 * @param {{date:string,time:string}} [now] 「未来の予定枠」の判定に使う現在時刻
 */
function validate(data, now = nowLocal()) {
  const errors = [];
  const warnings = [];
  const err = (m) => errors.push(m);
  const warn = (m) => warnings.push(m);

  if (!data || typeof data !== "object") return { errors: ["データがオブジェクトではありません"], warnings };
  for (const k of ["projects", "tasks", "events", "changeLog"]) {
    if (!Array.isArray(data[k])) err(`${k} が配列ではありません`);
  }
  if (errors.length) return { errors, warnings };

  const dup = (list, label) => {
    const seen = new Set();
    for (const x of list) {
      if (seen.has(x.id)) err(`${label} の ID が重複しています: ${x.id}`);
      seen.add(x.id);
    }
  };
  dup(data.projects, "プロジェクト");
  dup(data.tasks, "タスク");
  dup(data.events, "会議");

  const projectIds = new Set(data.projects.map((p) => p.id));
  const taskIds = new Set(data.tasks.map((t) => t.id));

  for (const p of data.projects) {
    if (!PROJECT_STATUS.includes(p.status)) err(`プロジェクト ${p.id}: 不明な状態 "${p.status}"`);
    if (!isDate(p.start)) err(`プロジェクト ${p.id}: 開始日の形式が不正です (${p.start})`);
    if (!isDate(p.due)) err(`プロジェクト ${p.id}: 期限の形式が不正です (${p.due})`);
    if (isDate(p.start) && isDate(p.due) && p.start > p.due) err(`プロジェクト ${p.id}: 開始日が期限より後です`);
    for (const m of p.milestones ?? []) {
      if (!isDate(m.date)) err(`プロジェクト ${p.id}: マイルストーン "${m.name}" の日付が不正です`);
    }
  }

  for (const t of data.tasks) {
    if (!TASK_STATUS.includes(t.status)) err(`タスク ${t.id}: 不明な状態 "${t.status}"`);
    if (!projectIds.has(t.projectId)) err(`タスク ${t.id}: 不明な projectId "${t.projectId}"`);
    if (!isDate(t.due)) err(`タスク ${t.id}: 期限の形式が不正です (${t.due})`);
    if (t.start != null && !isDate(t.start)) err(`タスク ${t.id}: 開始日の形式が不正です (${t.start})`);
    if (t.doneAt != null && !isDate(t.doneAt)) err(`タスク ${t.id}: 完了日の形式が不正です (${t.doneAt})`);
    if (t.importance != null && !IMPORTANCE.includes(t.importance)) err(`タスク ${t.id}: 不明な重要度 "${t.importance}"`);
    const preds = t.predecessors ?? [];
    for (const pid of preds) {
      if (!taskIds.has(pid)) err(`タスク ${t.id}: 存在しない先行 "${pid}"`);
      if (pid === t.id) err(`タスク ${t.id}: 自分自身を先行にしています（循環）`);
    }
    const predDue = preds.map((id) => data.tasks.find((x) => x.id === id)?.due).filter(isDate);
    if (isDate(t.due) && predDue.length && predDue.reduce((a, b) => (a > b ? a : b)) > t.due) warn(`タスク ${t.id}: 先行の期限が自分の期限より後です`);
    if (t.waitingOn && !isDate(t.waitingOn.since)) err(`タスク ${t.id}: 待ち開始日 (waitingOn.since) の形式が不正です`);
    if (t.status === "Waiting" && !t.waitingOn) warn(`タスク ${t.id}: Waiting なのに待ち先 (waitingOn) がありません`);
    if (preds.length && t.start != null) warn(`タスク ${t.id}: 先行があるため start は無視されます`);
    if (!preds.length && isDate(t.start) && isDate(t.due) && t.start > t.due) warn(`タスク ${t.id}: 開始日が期限より後です`);

    for (const s of t.sessions ?? []) {
      const label = `タスク ${t.id} の枠 ${s.id}`;
      if (!isDate(s.date) || !isTime(s.start) || !isTime(s.end)) { err(`${label}: 日付または時刻の形式が不正です`); continue; }
      if (toMin(s.end) <= toMin(s.start)) err(`${label}: 終了が開始以前です`);
      if (!["planned", "actual"].includes(s.kind)) err(`${label}: 不明な kind "${s.kind}"`);
      const notStarted = s.date > now.date || (s.date === now.date && s.start > now.time); // 進行中の枠は、完了にしても残す（futurePlanned）
      if (isDone(t) && s.kind === "planned" && notStarted) warn(`タスク ${t.id}: ${t.status} なのに未来の予定枠 ${s.id} が残っています`);

  }

  const cycle = findCycle(data.tasks);
  if (cycle) err(`先行が循環しています: ${cycle.join(" → ")}`);

  // 同じ日の枠どうしの重なり（タスクをまたいで判定）
  const all = data.tasks.flatMap((t) => (t.sessions ?? []).map((s) => ({ ...s, taskId: t.id })))
    .filter((s) => isDate(s.date) && isTime(s.start) && isTime(s.end));
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      if (overlap(all[i], all[j])) err(`枠 ${all[i].id} と ${all[j].id} が重なっています (${all[i].date})`);
    }
  }

  for (const e of data.events) {
    if (!isDate(e.date) || !isTime(e.start) || !isTime(e.end)) err(`会議 ${e.id}: 日付または時刻の形式が不正です`);
    else if (toMin(e.end) <= toMin(e.start)) err(`会議 ${e.id}: 終了が開始以前です`);
    if (!["mcp", "manual"].includes(e.source)) err(`会議 ${e.id}: 不明な source "${e.source}"`);
    if (e.projectId != null && !projectIds.has(e.projectId)) err(`会議 ${e.id}: 不明な projectId "${e.projectId}"`);
    if (e.projectBy != null && !["rule", "manual"].includes(e.projectBy)) err(`会議 ${e.id}: 不明な projectBy "${e.projectBy}"`);
    if (e.confirmed != null && typeof e.confirmed !== "boolean") err(`会議 ${e.id}: confirmed が真偽値ではありません`);
  }

  const st = data.settings ?? {};
  // 形の違う設定は、注意にとどめる（読む側は、既定値で動く。workday だけは、HH:MM でないと画面が動かない）
  const w = st.workday;
  if (w != null && !(typeof w === "object" && isTime(w.start) && isTime(w.end) && toMin(w.start) < toMin(w.end))) {
    warn("settings.workday: start・end は HH:MM で、開始 < 終了にしてください。直すまでスケジュール画面は正しく動きません");
  }
  if (st.waitingLongDays != null && !(Number.isInteger(st.waitingLongDays) && st.waitingLongDays >= 1)) {
    warn("settings.waitingLongDays: 1 以上の整数にしてください（直すまで、遅延バッジと「今日の優先」の待ち長期化が正しく出ません）");
  }
  const lb = st.labels;
  if (lb != null && !(typeof lb === "object" && !Array.isArray(lb) && ["group", "subgroup"].every((k) => lb[k] === undefined || typeof lb[k] === "string"))) {
    warn("settings.labels: group・subgroup は文字列にしてください（既定の呼び名で動きます）");
  }
  if (st.reportShowMeetingTitles != null && typeof st.reportShowMeetingTitles !== "boolean") {
    warn("settings.reportShowMeetingTitles: true か false にしてください（既定の false で動きます）");
  }
  const listOf = (v, ok) => Array.isArray(v) && v.every((x) => x && typeof x === "object" && isDate(x.date) && ok(x));
  if (st.holidays != null && !listOf(st.holidays, (x) => HOLIDAY_KINDS.includes(x.kind))) {
    warn(`settings.holidays: { date, kind } の配列にしてください（kind は ${HOLIDAY_KINDS.join("・")}。文字列の配列など、形の違う要素は画面から消せないので、data.json から直接直してください）`);
  }
  if (st.workdays != null && !listOf(st.workdays, () => true)) {
    warn("settings.workdays: { date } の配列にしてください（形の違う要素は、data.json から直接直してください）");
  }
  const nh = st.nationalHolidays;
  if (nh != null && !(typeof nh === "object" && isDate(nh.fetchedAt) && listOf(nh.dates, () => true))) {
    warn("settings.nationalHolidays: { fetchedAt, dates: [{ date }] } にしてください（/pj-lens:holidays で取り直せます）");
  }
  (st.projectRules ?? []).forEach((r, i) => {
    if (!String(r?.keyword ?? "").trim()) err(`settings.projectRules[${i}]: keyword が空です`);
    if (!projectIds.has(r?.projectId)) err(`settings.projectRules[${i}]: 不明な projectId "${r?.projectId}"`);
  });
  for (const [pid, m] of Object.entries(st.wbsMappings ?? {})) {
    if (!projectIds.has(pid)) err(`settings.wbsMappings: 不明なプロジェクト "${pid}"`);
    if (!m || typeof m !== "object" || Object.values(m).some((x) => typeof x !== "string")) err(`settings.wbsMappings.${pid}: 値は文字列のオブジェクトにしてください`);
  }

  for (const [pid, w] of Object.entries(st.wbsImports ?? {})) {
    if (!projectIds.has(pid)) err(`settings.wbsImports: 不明なプロジェクト "${pid}"`);
    const okCount = (n) => Number.isInteger(n) && n >= 0;
    if (!w || typeof w !== "object" || !(w.file === null || typeof w.file === "string") || !isDate(w.at) || !okCount(w.added) || !okCount(w.updated)) {
      err(`settings.wbsImports.${pid}: file（文字列か null）・at（日付）・added と updated（0 以上の整数）にしてください`);
    }
  }

  const ib = data.inbox;
  if (ib != null) {
    if (typeof ib !== "object" || Array.isArray(ib)) err("inbox: オブジェクトにしてください");
    else {
      if (ib.watching != null && !(typeof ib.watching === "object" && typeof ib.watching.at === "string" && ib.watching.at)) err("inbox.watching: at（日時の文字列）が必要です");
      if (!Array.isArray(ib.requests)) err("inbox.requests: 配列にしてください");
      else {
        const seen = new Set();
        ib.requests.forEach((r, i) => {
          const w = `inbox.requests[${i}]`;
          if (!r || typeof r.id !== "string" || !r.id) { err(`${w}: id が必要です`); return; }
          if (seen.has(r.id)) err(`${w}: id "${r.id}" が重複しています`);
          seen.add(r.id);
          if (!REQUEST_STATUS.includes(r.status)) err(`${w}: 不明な status "${r.status}"`);
          if (r.projectId != null && !projectIds.has(r.projectId)) err(`${w}: 不明な projectId "${r.projectId}"`);
          if (!Array.isArray(r.thread) || r.thread.some((m) => !m || !["user", "claude"].includes(m.role) || typeof m.text !== "string" || typeof m.at !== "string")) err(`${w}: thread は {role（user か claude）, at, text} の配列にしてください`);

  for (const c of data.changeLog) {
    if (!isDate(c.at)) err("changeLog: 日付が不正です");
    for (const id of c.taskIds ?? []) if (!taskIds.has(id)) warn(`changeLog: 存在しないタスク ${id}`);

})();

/* src/core/metrics.js */
const { taskStart, ganttRows, ganttLayout, timeTicks, projectProgress, taskFlags, projectFlags } = (() => {
// 進捗率・遅延判定・ガント用の算出（純関数）


const WINDOW_DAYS = { m1: 31, m3: 92, m6: 183, y1: 365 };
const MARGIN_DAYS = 7;

const taskOf = (data, id) => data.tasks.find((t) => t.id === id);
const maxDate = (list) => list.reduce((a, b) => (a > b ? a : b));
const minDate = (list) => list.reduce((a, b) => (a < b ? a : b));

/** 先行があれば先行の期限の最大値（start は無視）、なければ start、それもなければ期限 */
function taskStart(data, taskId) {
  const t = taskOf(data, taskId);
  const preds = (t.predecessors ?? []).map((id) => taskOf(data, id)).filter(Boolean);
  if (preds.length) return maxDate(preds.map((p) => p.due));
  return t.start ?? t.due;
}

/** 実績の線: 最初の実績枠の日 → 完了日（未完了なら today） */
function actualSpan(t, today) {
  const days = (t.sessions ?? []).filter((s) => s.kind === "actual").map((s) => s.date).sort();
  if (!days.length) return null;
  const finished = t.status === "Done" || t.status === "Cancelled";
  let end = finished ? (t.doneAt ?? days[days.length - 1]) : today;
  if (end < days[0]) end = days[0];
  return { start: days[0], end };
}

function ganttRows(data, projectId, today) {
  const p = data.projects.find((x) => x.id === projectId);
  const tasks = data.tasks.filter((t) => t.projectId === projectId);
  const milestones = [...(p.milestones ?? [])].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const rows = tasks.map((t) => {
    const s = taskStart(data, t.id);
    const point = s >= t.due;
    return {
      taskId: t.id,
      start: point ? t.due : s,
      end: t.due,
      point,
      actual: actualSpan(t, today),
    };
  });
  const dates = [p.start, p.due, ...milestones.map((m) => m.date), ...rows.flatMap((r) => [r.start, r.end, ...(r.actual ? [r.actual.start, r.actual.end] : [])])];
  return {
    range: { start: addDays(minDate(dates), -MARGIN_DAYS), end: addDays(maxDate(dates), MARGIN_DAYS) },
    rows,
    milestones,
  };
}

/** 表示期間 → 範囲全体の幅が画面幅の何倍か（ratio）と目盛りの種類 */
function ganttLayout(range, window) {
  const total = diffDays(range.end, range.start) + 1;
  const visibleDays = Math.min(window === "all" ? total : WINDOW_DAYS[window], total);
  const scale = visibleDays <= 40 ? "day" : visibleDays <= 100 ? "week" : visibleDays <= 420 ? "month" : "quarter";
  return { visibleDays, ratio: total / visibleDays, scale };
}

const ymd = (date) => date.split("-").map(Number);
const monthFirst = (y, m) => `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-01`;

function timeTicks(range, scale) {
  const out = [];
  if (scale === "day" || scale === "week") {
    for (let d = range.start; d <= range.end; d = addDays(d, 1)) {
      const [, m, day] = ymd(d);
      if (scale === "day") {
        out.push({ date: d, label: day === 1 ? `${m}/${day}` : String(day), yearStart: m === 1 && day === 1, weekend: isWeekend(d) });
      } else if (weekday(d) === 1) {
        // 1 月 1 日を含む週の月曜に年の境目を付ける
        out.push({ date: d, label: `${m}/${day}`, yearStart: ymd(addDays(d, 6))[0] !== ymd(d)[0] || (m === 1 && day === 1), weekend: false });
      }
    }
    return out;
  }
  const step = scale === "quarter" ? 3 : 1;
  let [y, m] = ymd(range.start);
  if (step === 3) m = Math.floor((m - 1) / 3) * 3 + 1; // 範囲開始を含む四半期の頭から
  for (; monthFirst(y, m) <= range.end; m += step) {
    if (m > 12) { y += 1; m -= 12; }
    const first = monthFirst(y, m);
    if (first > range.end) break;
    const label = scale === "quarter" ? `${y} Q${Math.floor((m - 1) / 3) + 1}` : m === 1 ? `${y}/${m}` : `${m}月`;
    // 範囲開始より前の月初は、範囲開始の位置に寄せる
    out.push({ date: first < range.start ? range.start : first, label, yearStart: m === 1, weekend: false });
  }
  return out;
}

function projectProgress(data, projectId) {
  const ts = data.tasks.filter((t) => t.projectId === projectId && t.status !== "Cancelled");
  const done = ts.filter((t) => t.status === "Done").length;
  return { done, total: ts.length, rate: ts.length ? done / ts.length : 0 };
}

function taskFlags(task, today, settings) {
  const flags = [];
  const open = task.status !== "Done" && task.status !== "Cancelled";
  if (open && task.due < today) flags.push("overdue");
  const long = settings?.waitingLongDays ?? 7;
  if (task.status === "Waiting" && task.waitingOn && isDate(task.waitingOn.since) && diffDays(today, task.waitingOn.since) >= long) flags.push("waiting-long");
  return flags;
}

function projectFlags(data, projectId, today) {
  const p = data.projects.find((x) => x.id === projectId);
  const all = data.tasks.filter((t) => t.projectId === projectId).flatMap((t) => taskFlags(t, today, data.settings));
  const flags = [];
  if (all.includes("overdue")) flags.push("overdue-tasks");
  if (all.includes("waiting-long")) flags.push("waiting-long");
  if (p.due < today && !["完了", "中止"].includes(p.status)) flags.push("past-due");
  return flags;
}

return { taskStart, ganttRows, ganttLayout, timeTicks, projectProgress, taskFlags, projectFlags };
})();

/* src/core/sessions.js */
const { sessionKind, addSession, moveSession, resizeSession, confirmSession, removeSession, taskActual, projectActualHours, runningPlanned, futurePlanned } = (() => {
// 作業枠（予定／実績）の規則。枠は「作業した時間の記録」で、タスクの状態は変えない。すべて不変更新。



const MIN_LEN = 15;
const DEFAULT_WORKDAY = { start: "09:00", end: "18:00" };

const workdayOf = (data) => data.settings?.workday ?? DEFAULT_WORKDAY;
const allSessions = (data) => data.tasks.flatMap((t) => (t.sessions ?? []).map((s) => ({ ...s, taskId: t.id })));
const findSession = (data, id) => allSessions(data).find((s) => s.id === id);
const clash = (a, b) => a.date === b.date && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
const isPast = (slot, now) => slot.date < now.date || (slot.date === now.date && slot.end <= now.time);

/** 過ぎた予定は unconfirmed、実績は actual、それ以外は planned */
function sessionKind(session, now) {
  if (session.kind === "actual") return "actual";
  return isPast(session, now) ? "unconfirmed" : "planned";
}

const nextId = (data) => {
  const max = allSessions(data).reduce((m, s) => Math.max(m, +(/^S(\d+)$/.exec(s.id)?.[1] ?? 0)), 0);
  return `S${max + 1}`;
};

/** 枠の置き場所の検証。他の枠との重なりは error、会議との重なりは warning */
function check(data, slot, ignoreId) {
  const wd = workdayOf(data);
  const [s, e] = [toMin(slot.start), toMin(slot.end)];
  if (e <= s) return { error: "終了は開始より後にしてください" };
  if (e - s < MIN_LEN) return { error: `枠は${MIN_LEN}分以上にしてください` };
  if (s < toMin(wd.start) || e > toMin(wd.end)) return { error: `勤務時間（${wd.start}〜${wd.end}）の中に置いてください` };
  // 休みの日に置けないのは、新しく置く・別の日から動かすとき。休みの日にすでにある枠は、同じ日の中なら直せる
  const stays = ignoreId && allSessions(data).some((x) => x.id === ignoreId && x.date === slot.date);
  if (!stays && offDayChecker(data.settings)(slot.date)) return { error: `${isWeekend(slot.date) ? "土日" : "休みの日"}には置けません（設定タブの「営業日として扱う日」に指定すると置けます）` };
  const other = allSessions(data).find((x) => x.id !== ignoreId && clash(x, slot));
  if (other) return { error: `他の枠（${other.start}〜${other.end}）と重なっています` };
  const mtg = (data.events ?? []).find((m) => !m.skip && clash(m, slot));
  return mtg ? { warning: `会議「${mtg.title}」（${mtg.start}〜${mtg.end}）と重なっています` } : {};
}

const withTask = (data, taskId, fn) => ({ ...data, tasks: data.tasks.map((t) => (t.id === taskId ? fn(t) : t)) });
const mapSessions = (data, id, fn) => ({
  ...data,
  tasks: data.tasks.map((t) => ((t.sessions ?? []).some((s) => s.id === id) ? { ...t, sessions: t.sessions.map((s) => (s.id === id ? fn(s) : s)) } : t)),
});

function addSession(data, taskId, slot, now) {
  if (!data.tasks.some((t) => t.id === taskId)) return { data, error: `タスク ${taskId} がありません` };
  const r = check(data, slot);
  if (r.error) return { data, error: r.error };
  const s = { id: nextId(data), date: slot.date, start: slot.start, end: slot.end, kind: isPast(slot, now) ? "actual" : "planned" };
  return { data: withTask(data, taskId, (t) => ({ ...t, sessions: [...(t.sessions ?? []), s] })), ...(r.warning && { warning: r.warning }) };
}

/** slot は { date, start }。長さは元のまま。種別は変えない（予定を過去へ動かしても未確認のまま） */
function moveSession(data, sessionId, slot, now) {
  const cur = findSession(data, sessionId);
  if (!cur) return { data, error: `枠 ${sessionId} がありません` };
  const len = toMin(cur.end) - toMin(cur.start);
  const next = { date: slot.date, start: slot.start, end: toHHMM(toMin(slot.start) + len) };
  if (toMin(slot.start) + len > 24 * 60) return { data, error: "勤務時間の外になります" };
  const r = check(data, next, sessionId);
  if (r.error) return { data, error: r.error };
  // 実績の枠を未来へ動かしたら予定に戻す（未来の枠は実績にできない）
  const kind = cur.kind === "actual" && !isPast(next, now) ? "planned" : cur.kind;
  return { data: mapSessions(data, sessionId, (s) => ({ ...s, ...next, kind })), ...(r.warning && { warning: r.warning }) };
}

function resizeSession(data, sessionId, end, now) {
  const cur = findSession(data, sessionId);
  if (!cur) return { data, error: `枠 ${sessionId} がありません` };
  const r = check(data, { date: cur.date, start: cur.start, end }, sessionId);
  if (r.error) return { data, error: r.error };
  const kind = now && cur.kind === "actual" && !isPast({ date: cur.date, end }, now) ? "planned" : cur.kind;
  return { data: mapSessions(data, sessionId, (s) => ({ ...s, end, kind })) };
}

function confirmSession(data, sessionId, now) {
  const cur = findSession(data, sessionId);
  if (!cur) return { data, error: `枠 ${sessionId} がありません` };
  if (!isPast(cur, now)) return { data, error: "未来の枠は実績にできません" };
  return { data: mapSessions(data, sessionId, (s) => ({ ...s, kind: "actual" })) };
}

function removeSession(data, sessionId) {
  return { ...data, tasks: data.tasks.map((t) => ((t.sessions ?? []).some((s) => s.id === sessionId) ? { ...t, sessions: t.sessions.filter((s) => s.id !== sessionId) } : t)) };
}

function taskActual(data, taskId) {
  const t = data.tasks.find((x) => x.id === taskId);
  const ss = t?.sessions ?? [];
  const actual = ss.filter((s) => s.kind === "actual");
  const minutes = actual.reduce((sum, s) => sum + toMin(s.end) - toMin(s.start), 0);
  return { hours: minutes / 60, firstDate: actual.length ? actual.map((s) => s.date).sort()[0] : null, count: ss.length };
}

function projectActualHours(data, projectId) {
  return data.tasks.filter((t) => t.projectId === projectId).reduce((h, t) => h + taskActual(data, t.id).hours, 0);
}

/** 進行中（開始済みで未終了）の予定枠の ID。タスクを完了にしても残す枠（futurePlanned に含めない） */
function runningPlanned(data, taskId, now) {
  const t = data.tasks.find((x) => x.id === taskId);
  const started = (s) => s.date < now.date || (s.date === now.date && s.start <= now.time);
  return (t?.sessions ?? []).filter((s) => s.kind === "planned" && started(s) && !isPast(s, now)).map((s) => s.id);
}

/** まだ開始していない予定枠の ID（進行中の枠・終了した枠・実績は含まない。完了にするとき解除する対象。進行中の枠は残り、終わったあとに実績にできる） */
function futurePlanned(data, taskId, now) {
  const t = data.tasks.find((x) => x.id === taskId);
  const notStarted = (s) => s.date > now.date || (s.date === now.date && s.start > now.time);
  return (t?.sessions ?? []).filter((s) => s.kind === "planned" && notStarted(s)).map((s) => s.id);
}

return { sessionKind, addSession, moveSession, resizeSession, confirmSession, removeSession, taskActual, projectActualHours, runningPlanned, futurePlanned };
})();

/* src/core/impact.js */
const { computeImpact, needsReplan, applyReplan, commitReplan } = (() => {
// タスクの期限が動いたときの影響範囲。後続は「最小限だけ」動かす（先行の新しい期限を超えないようにする）。



const closed = (t) => t.status === "Done" || t.status === "Cancelled";

/**
 * opts.compress: 前倒し(deltaDays < 0)のとき、後続も同じ日数だけ前倒しする(先行の新しい期限より前にはしない)
 */
function computeImpact(data, taskId, deltaDays, { compress = false } = {}) {
  const byId = new Map(data.tasks.map((t) => [t.id, t]));
  const target = byId.get(taskId);
  if (!target) throw new Error(`タスク ${taskId} がありません`);

  const successors = new Map(); // 先行ID → 後続タスクの配列
  for (const t of data.tasks) {
    for (const p of t.predecessors ?? []) {
      if (!successors.has(p)) successors.set(p, []);
      successors.get(p).push(t);
    }
  }

  const newDue = new Map([[taskId, addDays(target.due, deltaDays)]]);
  const reason = new Map();
  const queue = [taskId];
  if (compress && deltaDays < 0) {
    // 期限は減る方向にしか更新しないので、循環があっても止まる
    while (queue.length) {
      const cur = queue.shift();
      for (const s of successors.get(cur) ?? []) {
        if (s.id === taskId || closed(s)) continue;
        const lower = s.predecessors.map((p) => newDue.get(p) ?? byId.get(p)?.due).filter(Boolean).reduce((a, b) => (a > b ? a : b), "");
        const shifted = addDays(s.due, deltaDays);
        const cand = lower > shifted ? lower : shifted;
        if (cand < (newDue.get(s.id) ?? s.due)) {
          newDue.set(s.id, cand);
          reason.set(s.id, `先行 ${cur} の前倒し`);
          queue.push(s.id);
        }
      }
    }
    queue.length = 0;
  }
  // 期限は増える方向にしか更新しないので、循環があっても既存の期限の最大値で止まる
  while (queue.length) {
    const cur = queue.shift();
    for (const s of successors.get(cur) ?? []) {
      if (s.id === taskId || closed(s)) continue;
      let best = s.due;
      let by = null;
      for (const p of s.predecessors) {
        const d = newDue.get(p); // 動いた先行だけが対象（元からの不整合は直さない）
        if (d && d > best) { best = d; by = p; }
      }
      if (best > (newDue.get(s.id) ?? s.due)) {
        newDue.set(s.id, best);
        reason.set(s.id, `先行 ${by} の遅れ`);
        queue.push(s.id);
      }
    }
  }

  const changes = [...newDue].map(([id, nd]) => ({
    taskId: id,
    oldDue: byId.get(id).due,
    newDue: nd,
    reason: id === taskId ? `指定（${deltaDays >= 0 ? "+" : ""}${deltaDays}日）` : reason.get(id),
  })).filter((c) => c.oldDue !== c.newDue || c.taskId === taskId);

  const projectDueExceeded = [];
  for (const p of data.projects ?? []) {
    const latest = data.tasks.filter((t) => t.projectId === p.id).map((t) => newDue.get(t.id) ?? t.due)
      .reduce((a, b) => (a > b ? a : b), "");
    const moved = changes.some((c) => byId.get(c.taskId).projectId === p.id && c.newDue > p.due);
    if (moved) projectDueExceeded.push({ projectId: p.id, due: p.due, latestTaskDue: latest });
  }
  return { changes, projectDueExceeded };
}

/** 後続が動く、またはプロジェクト期限を超えるなら、利用者に確認してから反映する */
function needsReplan(impact) {
  return impact.changes.length > 1 || impact.projectDueExceeded.length > 0;
}

/**
 * impact の変更を due に反映し、changeLog に日程変更の記録を足す。extra は記録に足す項目(source・messageIds など)
 */
function applyReplan(data, impact, { reason, cause, deltaDays, at, extra = {} }) {
  if (!String(reason ?? "").trim()) throw new Error("理由を入力してください");
  if (!CAUSES.includes(cause)) throw new Error(`原因は ${CAUSES.join("・")} のいずれかにしてください`);
  const to = new Map(impact.changes.map((c) => [c.taskId, c.newDue]));
  return {
    ...data,
    tasks: data.tasks.map((t) => (to.has(t.id) ? { ...t, due: to.get(t.id) } : t)),
    changeLog: [...(data.changeLog ?? []), { at, taskIds: impact.changes.map((c) => c.taskId), reason: String(reason).trim(), cause, deltaDays, ...extra }],
  };
}

/**
 * 確認のあとの反映。利用者の編集(edit: data → data)を、いまの最新のデータに対してやり直し、後続の影響もいまのデータで計算し直す。
 * 確認パネルを出している間に入った別の編集を消さないため、パネルを出した時点のスナップショットは使わない
 */
function commitReplan(data, edit, taskId, deltaDays, { compress = false, reason, cause, at, extra }) {
  const base = edit(data);
  const impact = computeImpact(data, taskId, deltaDays, { compress });
  return applyReplan(base, impact, { reason, cause, deltaDays, at, extra });
}

return { computeImpact, needsReplan, applyReplan, commitReplan };
})();

/* src/core/rules.js */
const { matchProject, assignMeetingProjects, setProjectRule, removeProjectRule, moveProjectRule, renameProjectRule, ruleMeetingCounts } = (() => {
// 会議のプロジェクト規則（件名のキーワード → プロジェクト）。すべて不変更新。
// 手動で付けたもの（projectBy: "manual"）は、規則の再適用で変えない。

/** text が keyword を含む最初の規則の projectId。大文字小文字は区別せず、空の keyword は無視する */
function matchProject(text, rules) {
  const t = String(text ?? "").toLowerCase();
  for (const r of rules ?? []) {
    const k = String(r?.keyword ?? "").trim().toLowerCase();
    if (k && t.includes(k)) return r.projectId;
  }
  return null;
}

/** 手動以外の会議に、規則でプロジェクトを付け直す（当たらなければ、規則で付けた分だけ外す）。存在しないプロジェクトの規則は無視する */
function assignMeetingProjects(data) {
  const ids = new Set((data.projects ?? []).map((p) => p.id));
  const rules = (data.settings?.projectRules ?? []).filter((r) => ids.has(r.projectId));
  const events = (data.events ?? []).map((e) => {
    // 手動、または projectBy の無い projectId（手で書かれたもの）は変えない
    if (e.projectBy === "manual" || (e.projectBy === undefined && e.projectId)) return e;
    const m = matchProject(e.title, rules);
    if (m) return e.projectId === m && e.projectBy === "rule" ? e : { ...e, projectId: m, projectBy: "rule" };
    if (e.projectBy === undefined) return e;
    const { projectBy, ...rest } = e;
    void projectBy;
    return { ...rest, projectId: null };
  });
  return { ...data, events };
}

const sameKey = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

/** 規則を追加（同じ keyword なら置き換え）して、会議へ反映する */
function setProjectRule(data, keyword, projectId) {
  const k = String(keyword ?? "").trim();
  if (!k) throw new Error("キーワードを入力してください");
  if (!(data.projects ?? []).some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);
  const rules = data.settings?.projectRules ?? [];
  const next = rules.some((r) => sameKey(r.keyword, k))
    ? rules.map((r) => (sameKey(r.keyword, k) ? { keyword: k, projectId } : r))
    : [...rules, { keyword: k, projectId }];
  return assignMeetingProjects({ ...data, settings: { ...data.settings, projectRules: next } });
}

/** 規則を消して、会議へ反映する（手動のひも付けは残る） */
function removeProjectRule(data, keyword) {
  const rules = (data.settings?.projectRules ?? []).filter((r) => !sameKey(r.keyword, keyword));
  return assignMeetingProjects({ ...data, settings: { ...data.settings, projectRules: rules } });
}

/** 規則を 1 つ上（delta = -1）・下（delta = 1）へ動かし、会議へ付け直す（上の規則が先に当たるため）。端では動かさない。不明なキーワードは例外 */
function moveProjectRule(data, keyword, delta) {
  const rules = data.settings?.projectRules ?? [];
  const at = rules.findIndex((r) => sameKey(r.keyword, keyword));
  if (at < 0) throw new Error(`キーワード「${keyword}」の規則がありません`);
  const to = at + delta;
  if (to < 0 || to >= rules.length) return data;
  const next = [...rules];
  [next[at], next[to]] = [next[to], next[at]];
  return assignMeetingProjects({ ...data, settings: { ...data.settings, projectRules: next } });
}

/** 規則のキーワードを書き換える（順序とプロジェクトは保つ）。会議へ付け直す。空・不明な元・他の規則と同じキーワードは例外 */
function renameProjectRule(data, oldKeyword, newKeyword) {
  const k = String(newKeyword ?? "").trim();
  if (!k) throw new Error("キーワードを入力してください");
  const rules = data.settings?.projectRules ?? [];
  const at = rules.findIndex((r) => sameKey(r.keyword, oldKeyword));
  if (at < 0) throw new Error(`キーワード「${oldKeyword}」の規則がありません`);
  if (rules.some((r, i) => i !== at && sameKey(r.keyword, k))) throw new Error(`キーワード「${k}」の規則がすでにあります`);
  const next = rules.map((r, i) => (i === at ? { ...r, keyword: k } : r));
  return assignMeetingProjects({ ...data, settings: { ...data.settings, projectRules: next } });
}

/** 規則の並びで、その規則で付いている会議（projectBy が rule）の件数。複数の規則に当たる会議は、先の規則だけが数える */
function ruleMeetingCounts(data) {
  const rules = data.settings?.projectRules ?? [];
  const ids = new Set((data.projects ?? []).map((p) => p.id));
  const counts = rules.map(() => 0);
  for (const e of data.events ?? []) {
    if (e.projectBy !== "rule") continue;
    const t = String(e.title ?? "").toLowerCase();
    const at = rules.findIndex((r) => ids.has(r.projectId) && String(r.keyword ?? "").trim() && t.includes(String(r.keyword).trim().toLowerCase()));
    if (at >= 0) counts[at]++;
  }
  return counts;
}

return { matchProject, assignMeetingProjects, setProjectRule, removeProjectRule, moveProjectRule, renameProjectRule, ruleMeetingCounts };
})();

/* src/core/schedule.js */
const { freeSlots, rankTasks, addMeeting, updateMeeting, meetingKind, confirmMeeting, deleteMeeting, syncMcpEvents } = (() => {
// 空き時間・優先順位・会議の操作（純関数、不変更新）



const DEFAULT_WORKDAY = { start: "09:00", end: "18:00" };
const closed = (t) => t.status === "Done" || t.status === "Cancelled";

/** 対象日の空き時間。skip の会議は無視し、重なりを統合して勤務時間内に切り詰める */
function freeSlots(events, date, workday = DEFAULT_WORKDAY) {
  const [ws, we] = [toMin(workday.start), toMin(workday.end)];
  const busy = events
    .filter((e) => e.date === date && !e.skip)
    .map((e) => [Math.max(ws, toMin(e.start)), Math.min(we, toMin(e.end))])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  const out = [];
  let cur = ws;
  for (const [s, e] of busy) {
    if (s > cur) out.push({ start: toHHMM(cur), end: toHHMM(s) });
    cur = Math.max(cur, e);
  }
  if (cur < we) out.push({ start: toHHMM(cur), end: toHHMM(we) });
  return out;
}

/** このタスクを（推移的に）先行とする未完了タスクの数。循環でも終了する */
function openDownstream(tasks, id) {
  const next = new Map();
  for (const t of tasks) for (const p of t.predecessors ?? []) next.set(p, [...(next.get(p) ?? []), t]);
  const seen = new Set([id]);
  const stack = [id];
  let n = 0;
  while (stack.length) {
    for (const t of next.get(stack.pop()) ?? []) {
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      stack.push(t.id);
      if (!closed(t)) n++;
    }
  }
  return n;
}

/**
 * 今日の優先。対象は Done/Cancelled 以外で、先行がすべて完了しているもの。
 * 点数 = 期限超過 100 + max(0,14-日数)×3 + 後続の未完了 1 件ごとに 10 + 重要度(高12/中・未設定4/低0) + Waiting 15
 */
function rankTasks(data, today) {
  const byId = new Map(data.tasks.map((t) => [t.id, t]));
  const out = [];
  for (const t of data.tasks) {
    if (closed(t)) continue;
    if ((t.predecessors ?? []).some((p) => byId.has(p) && !closed(byId.get(p)))) continue;
    const left = diffDays(t.due, today);
    const reasons = [];
    let score = 0;
    if (left < 0) { score += 100; reasons.push(`期限超過 ${-left}日`); }
    score += Math.max(0, 14 - left) * 3;
    if (left >= 0 && left <= 14) reasons.push(left === 0 ? "期限は今日" : `期限まで ${left}日`);
    const blocked = openDownstream(data.tasks, t.id);
    score += blocked * 10;
    if (blocked) reasons.push(`後続 ${blocked} 件を止めている`);
    score += t.importance === "high" ? 12 : t.importance === "low" ? 0 : 4;
    if (t.importance === "high") reasons.push("重要度: 高");
    let action = "work";
    if (t.status === "Waiting") {
      action = "chase";
      score += 15;
      const w = t.waitingOn;
      reasons.unshift(w ? `${w.party} への${left < 0 ? "催促" : "確認"}${isDate(w.since) ? `（回答待ち ${diffDays(today, w.since)}日）` : ""}` : "待ち先が未設定");
    }
    out.push({ taskId: t.id, score, reasons, action, due: t.due });
  }
  return out.sort((a, b) => b.score - a.score || (a.due < b.due ? -1 : a.due > b.due ? 1 : a.taskId < b.taskId ? -1 : 1));
}

// ---- 会議の操作 ----
const maxMeetingNo = (events) => events.reduce((m, e) => Math.max(m, +(/^m(\d+)$/.exec(e.id)?.[1] ?? 0)), 0);
const nextMeetingId = (events) => `m${maxMeetingNo(events) + 1}`;

function assertTimes(m) {
  if (!isDate(m.date) || !isTime(m.start) || !isTime(m.end)) throw new Error("日付または時刻の形式が不正です");
  if (toMin(m.end) <= toMin(m.start)) throw new Error("終了は開始より後にしてください");
}

function addMeeting(data, m) {
  assertTimes(m);
  const id = nextMeetingId(data.events);
  const e = { id, date: m.date, start: m.start, end: m.end, title: (m.title ?? "").trim() || "会議", source: "manual", skip: !!m.skip, externalId: null, confirmed: false, projectId: null };
  if (m.projectId) {
    if (!(data.projects ?? []).some((p) => p.id === m.projectId)) throw new Error(`プロジェクト ${m.projectId} がありません`);
    e.projectId = m.projectId;
    e.projectBy = "manual";
  }
  return { data: assignMeetingProjects({ ...data, events: [...data.events, e] }), id };
}

function updateMeeting(data, id, patch) {
  const cur = data.events.find((e) => e.id === id);
  if (!cur) throw new Error(`会議 ${id} がありません`);
  const common = ["skip", "projectId", "confirmed"];
  const allowed = cur.source === "manual" ? ["title", "date", "start", "end", ...common] : common;
  for (const k of Object.keys(patch)) {
    if (!allowed.includes(k) && patch[k] !== cur[k]) throw new Error(`この会議は ${k} を変更できません（予定表から取得した会議は「参加しない」のみ）`);
  }
  const next = { ...cur, ...Object.fromEntries(Object.entries(patch).filter(([k]) => allowed.includes(k) && k !== "projectId")) };
  if (cur.source === "manual") { assertTimes(next); next.title = (next.title ?? "").trim() || "会議"; }
  // 日時が変わったら、確認済みは外す(別の時間の会議を、確認したことにしない)。confirmed を明示したときは、その値に従う
  if (!("confirmed" in patch) && cur.confirmed === true && (next.date !== cur.date || next.start !== cur.start || next.end !== cur.end)) next.confirmed = false;
  let auto = false;
  if ("projectId" in patch) {
    if (patch.projectId === "" || patch.projectId == null) { delete next.projectBy; next.projectId = null; auto = true; }
    else {
      if (!(data.projects ?? []).some((p) => p.id === patch.projectId)) throw new Error(`プロジェクト ${patch.projectId} がありません`);
      next.projectId = patch.projectId;
      next.projectBy = "manual";
    }
  }
  const out = { ...data, events: data.events.map((e) => (e.id === id ? next : e)) };
  return assignMeetingProjects(out); // 件名が変わったときも、規則で付けたものを付け直す(手動は変わらない)
}

const meetingPast = (m, now) => m.date < now.date || (m.date === now.date && m.end <= now.time);

/** 会議の状態: 参加しない=skipped / 確認済み=actual / 過ぎて未確認=unconfirmed / それ以外=planned */
function meetingKind(m, now) {
  if (m.skip) return "skipped";
  if (m.confirmed === true) return "actual";
  return meetingPast(m, now) ? "unconfirmed" : "planned";
}

/** 過ぎた会議を実績として確認する。未来の会議と、参加しない会議は確認できない */
function confirmMeeting(data, id, now) {
  const cur = data.events.find((e) => e.id === id);
  if (!cur) throw new Error(`会議 ${id} がありません`);
  if (cur.skip) throw new Error("参加しない会議は実績にできません");
  if (!meetingPast(cur, now)) throw new Error("未来の会議は実績にできません");
  return { ...data, events: data.events.map((e) => (e.id === id ? { ...e, confirmed: true } : e)) };
}

function deleteMeeting(data, id) {
  const cur = data.events.find((e) => e.id === id);
  if (!cur) throw new Error(`会議 ${id} がありません`);
  if (cur.source !== "manual") throw new Error("予定表から取得した会議は削除できません（「参加しない」にしてください）");
  return { ...data, events: data.events.filter((e) => e.id !== id) };
}

/** 取得結果で、range 内の MCP 由来の会議だけを追加・更新・削除する。skip と手入力の会議は保つ */
function syncMcpEvents(data, fetched, range) {
  const inRange = (d) => d >= range.start && d <= range.end;
  fetched = fetched.filter((f, k) => fetched.findIndex((x) => x.externalId === f.externalId) === k); // 同じ externalId は 1 件
  let seq = maxMeetingNo(data.events); // 消えた会議の ID を使い回さない
  const seen = new Set(fetched.map((f) => f.externalId));
  const existing = new Map(data.events.filter((e) => e.source === "mcp").map((e) => [e.externalId, e]));
  const kept = data.events.filter((e) => e.source !== "mcp" || seen.has(e.externalId) || !inRange(e.date));
  const events = kept.map((e) => {
    const f = e.source === "mcp" ? fetched.find((x) => x.externalId === e.externalId) : null;
    if (!f) return e;
    const moved = f.date !== e.date || f.start !== e.start || f.end !== e.end;
    return { ...e, title: f.title, date: f.date, start: f.start, end: f.end, ...(moved && e.confirmed ? { confirmed: false } : {}) };
  });
  for (const f of fetched) {
    if (existing.has(f.externalId)) continue;
    events.push({ id: `m${++seq}`, date: f.date, start: f.start, end: f.end, title: f.title, source: "mcp", skip: false, externalId: f.externalId });
  }
  return { ...data, events };
}

return { freeSlots, rankTasks, addMeeting, updateMeeting, meetingKind, confirmMeeting, deleteMeeting, syncMcpEvents };
})();

/* src/core/workload.js */
const { projectHours, workload, periodRange } = (() => {
// 稼働の集計（純関数）: 実績の作業枠（タスク）と、確認済みで参加する会議の時間をプロジェクト別に集める。




const hours = (x) => (toMin(x.end) - toMin(x.start)) / 60;
const inRange = (d, r) => !r || (d >= r.start && d <= r.end);
const sumBy = (list, f) => list.reduce((a, x) => a + f(x), 0);

const actualSessions = (data, range) =>
  data.tasks.flatMap((t) => (t.sessions ?? []).filter((s) => s.kind === "actual" && inRange(s.date, range)).map((s) => ({ ...s, projectId: t.projectId })));
const countedMeetings = (data, range) => (data.events ?? []).filter((m) => m.confirmed === true && !m.skip && inRange(m.date, range));

/** 全期間の、プロジェクトの稼働時間（h）: タスク（実績の作業枠）と会議（確認済み・参加するもの） */
function projectHours(data, projectId) {
  return {
    task: sumBy(actualSessions(data).filter((s) => s.projectId === projectId), hours),
    meeting: sumBy(countedMeetings(data).filter((m) => m.projectId === projectId), hours),
  };
}

/**
 * 期間内の稼働。rows は data.projects の順（0 時間でも出す）。unassigned はプロジェクト未設定（または存在しない）の会議。
 * unconfirmed は、期間内で過ぎたのに未確認の作業枠と会議の件数（now があるときだけ数える。内訳は unconfirmedTasks・unconfirmedMeetings）
 */
function workload(data, range, now) {
  const ids = new Set(data.projects.map((p) => p.id));
  const sessions = actualSessions(data, range);
  const meetings = countedMeetings(data, range);
  const rows = data.projects.map((p) => {
    const task = sumBy(sessions.filter((s) => s.projectId === p.id), hours);
    const meeting = sumBy(meetings.filter((m) => m.projectId === p.id), hours);
    return { projectId: p.id, task, meeting, total: task + meeting };
  });
  const unassigned = sumBy(meetings.filter((m) => !ids.has(m.projectId)), hours);
  let unconfirmedTasks = 0, unconfirmedMeetings = 0;
  if (now) {
    unconfirmedTasks = data.tasks.flatMap((t) => t.sessions ?? []).filter((s) => inRange(s.date, range) && sessionKind(s, now) === "unconfirmed").length;
    unconfirmedMeetings = (data.events ?? []).filter((m) => inRange(m.date, range) && meetingKind(m, now) === "unconfirmed").length;
  }
  return { rows, unassigned, total: sumBy(rows, (r) => r.total) + unassigned, unconfirmed: unconfirmedTasks + unconfirmedMeetings, unconfirmedTasks, unconfirmedMeetings };
}

/** 週（月曜〜日曜）または月（月初〜月末）の範囲 */
function periodRange(period, date) {
  if (period === "week") {
    const start = addDays(date, -((weekday(date) + 6) % 7));
    return { start, end: addDays(start, 6) };
  }
  const [y, m] = date.split("-").map(Number);
  const start = `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-01`;
  const next = m === 12 ? `${String(y + 1).padStart(4, "0")}-01-01` : `${String(y).padStart(4, "0")}-${String(m + 1).padStart(2, "0")}-01`;
  return { start, end: addDays(next, -1) };
}

return { projectHours, workload, periodRange };
})();

/* src/core/reportspec.js */
const { PERIOD_KINDS, reportPeriod, reportFileName, periodReport, progressAsOf } = (() => {
// レポートの対象（プロジェクト・期間）の規則と、期間の集計（純関数）。





const PERIOD_KINDS = ["thisWeek", "lastWeek", "lastAndThis", "thisAndNext", "nextWeek", "thisMonth", "lastMonth", "custom"];

const compact = (d) => d.replace(/-/g, "");
const slash = (d) => d.replace(/-/g, "/");

/** ISO 8601 の週番号（月曜始まり。その週の木曜が属する年の第何週か）。monday はその週の月曜 */
function isoWeekKey(monday) {
  const thu = addDays(monday, 3);
  const year = thu.slice(0, 4);
  return `${year}-W${String(Math.floor(diffDays(thu, `${year}-01-01`) / 7) + 1).padStart(2, "0")}`;
}

/** レポートの期間。{ kind, start, end, label, key }。key はファイル名に使う。custom は { start, end } が要る */
function reportPeriod(kind, today, custom) {
  const week = (d) => periodRange("week", d);
  const make = (start, end, label, key) => ({ kind, start, end, label, key });
  if (kind === "thisWeek") { const r = week(today); return make(r.start, r.end, "今週", isoWeekKey(r.start)); }
  if (kind === "lastWeek") { const r = week(addDays(today, -7)); return make(r.start, r.end, "先週", isoWeekKey(r.start)); }
  if (kind === "lastAndThis") {
    const [a, b] = [week(addDays(today, -7)), week(today)];
    return make(a.start, b.end, "先週と今週", `${compact(a.start)}--${compact(b.end)}`);
  }
  if (kind === "thisAndNext") {
    const [a, b] = [week(today), week(addDays(today, 7))];
    return make(a.start, b.end, "今週と来週", `${compact(a.start)}--${compact(b.end)}`);
  }
  if (kind === "nextWeek") { const r = week(addDays(today, 7)); return make(r.start, r.end, "来週", isoWeekKey(r.start)); }
  if (kind === "thisMonth" || kind === "lastMonth") {
    const r = periodRange("month", kind === "thisMonth" ? today : addDays(periodRange("month", today).start, -1));
    return make(r.start, r.end, kind === "thisMonth" ? "今月" : "先月", r.start.slice(0, 7));
  }
  if (kind === "custom") {
    if (!isDate(custom?.start) || !isDate(custom?.end)) throw new Error("期間の日付の形式が不正です（YYYY-MM-DD）");
    if (custom.start > custom.end) throw new Error("期間の開始は終了以前にしてください");
    return make(custom.start, custom.end, `${slash(custom.start)}〜${slash(custom.end)}`, `${compact(custom.start)}--${compact(custom.end)}`);
  }
  throw new Error(`不明な期間です: ${kind}`);
}

/**
 * ファイル名（拡張子なし）: pj-lens_report_<対象>_<期間>_<作成日>。
 * 対象は全プロジェクトなら all、3 件までは ID を + でつなぎ、それより多いと <N>projects。使えない文字は _
 */
function reportFileName({ projectIds, allIds, period, today }) {
  const ids = [...new Set(projectIds)];
  let target;
  if (!ids.length || (ids.length === allIds.length && allIds.every((id) => ids.includes(id)))) target = "all";
  else target = ids.length <= 3 ? ids.join("+") : `${ids.length}projects`;
  return `pj-lens_report_${target}_${period.key}_${compact(today)}`.replace(/[\\/:*?"<>|\s]/g, "_");
}

const hours = (x) => (toMin(x.end) - toMin(x.start)) / 60;
const inRange = (d, r) => d >= r.start && d <= r.end;

/**
 * 期間内の実績。includeUnassigned のときは、プロジェクト未設定（または存在しない）会議の確認済み時間と未確認件数も unassigned に集める（全プロジェクトを選んだときのため）。
 * プロジェクトごと（projectIds の順）に、作業時間・回数・会議時間（確認済みで参加するもの）、
 * 期間内に作業したタスク、期間内に完了したタスク、期間内で過ぎたのに未確認の作業枠と会議の件数
 */
function periodReport(data, projectIds, range, now, { includeUnassigned = false } = {}) {
  const rows = projectIds.map((projectId) => {
    const tasks = data.tasks.filter((t) => t.projectId === projectId);
    const worked = tasks.map((t) => {
      const ss = (t.sessions ?? []).filter((s) => s.kind === "actual" && inRange(s.date, range));
      return { id: t.id, title: t.title, hours: ss.reduce((a, s) => a + hours(s), 0), count: ss.length };
    }).filter((x) => x.count > 0);
    const meetings = (data.events ?? []).filter((m) => m.projectId === projectId && inRange(m.date, range));
    const taskHours = worked.reduce((a, x) => a + x.hours, 0);
    const meetingHours = meetings.filter((m) => m.confirmed === true && !m.skip).reduce((a, m) => a + hours(m), 0);
    return {
      projectId, taskHours, taskCount: worked.reduce((a, x) => a + x.count, 0), meetingHours, total: taskHours + meetingHours,
      tasks: worked,
      done: tasks.filter((t) => t.status === "Done" && t.doneAt && inRange(t.doneAt, range)).map((t) => ({ id: t.id, title: t.title, doneAt: t.doneAt })),
      unconfirmedTasks: tasks.flatMap((t) => t.sessions ?? []).filter((s) => inRange(s.date, range) && sessionKind(s, now) === "unconfirmed").length,
      unconfirmedMeetings: meetings.filter((m) => meetingKind(m, now) === "unconfirmed").length,
    };
  });
  let unassigned = null;
  if (includeUnassigned) {
    const known = new Set(data.projects.map((p) => p.id));
    const free = (data.events ?? []).filter((m) => !known.has(m.projectId) && inRange(m.date, range));
    unassigned = { meetingHours: free.filter((m) => m.confirmed === true && !m.skip).reduce((a, m) => a + hours(m), 0), unconfirmedMeetings: free.filter((m) => meetingKind(m, now) === "unconfirmed").length };
  }
  return { rows, unassigned };
}

/** 指定日時点の進捗。完了 = Done で完了日が asOf 以前（完了日が無い Done は完了済み）。総数は Cancelled を除く。完了日以外の履歴は無いので近似 */
function progressAsOf(data, projectId, asOf) {
  const tasks = data.tasks.filter((t) => t.projectId === projectId && t.status !== "Cancelled");
  const done = tasks.filter((t) => t.status === "Done" && (!t.doneAt || t.doneAt <= asOf)).length;
  return { done, total: tasks.length, rate: tasks.length ? done / tasks.length : 0 };
}

return { PERIOD_KINDS, reportPeriod, reportFileName, periodReport, progressAsOf };
})();

/* src/core/groups.js */
const { groupLabels, groupSections, groupNames } = (() => {
// 大項目（group）・中項目（subgroup）の扱い（純関数）。階層の集計はせず、見出しと絞り込みに使う文字列として持つ。

const DEFAULT_LABELS = { group: "大項目", subgroup: "中項目" };

/** 画面での見出しの呼び名。settings.labels の非空の文字列で上書きできる */
function groupLabels(settings) {
  const l = settings?.labels ?? {};
  const pick = (k) => (typeof l[k] === "string" && l[k].trim() ? l[k].trim() : DEFAULT_LABELS[k]);
  return { group: pick("group"), subgroup: pick("subgroup") };
}

/**
 * 大項目の最初の登場順に、その中は中項目の最初の登場順に束ねる。タスクの順序は保つ。未設定は空文字。
 * 大項目が空の組は最後のブロックに置く。ensureNone なら、(空, 空) の組がなくても空の組を末尾に足す（追加の入口にするため）
 */
function groupSections(tasks, { ensureNone = false } = {}) {
  const out = [];
  const at = new Map();
  for (const t of tasks) {
    const group = t.group ?? "", subgroup = t.subgroup ?? "";
    const key = `${group}\u0000${subgroup}`;
    if (!at.has(key)) { at.set(key, out.length); out.push({ group, subgroup, tasks: [] }); }
    out[at.get(key)].tasks.push(t);
  }
  const first = new Map();
  out.forEach((s, i) => { if (!first.has(s.group)) first.set(s.group, i); });
  // 大項目の最初の登場位置で並べ（安定ソート）、大項目が空の組は最後に回す
  out.sort((a, b) => (a.group === "") - (b.group === "") || first.get(a.group) - first.get(b.group));
  if (ensureNone && !out.some((s) => s.group === "" && s.subgroup === "")) out.push({ group: "", subgroup: "", tasks: [] });
  return out;
}

/** 空でない大項目の名前を、重複なしで登場順に */
function groupNames(tasks) {
  return [...new Set(tasks.map((t) => t.group).filter(Boolean))];
}

return { groupLabels, groupSections, groupNames };
})();

/* src/core/inbox.js */
const { MAX_REQUESTS, MAX_TEXT, MAX_THREAD, WATCH_FRESH_MS, getRequest, pruneRequests, submitRequest, claimRequest, askQuestion, replyToRequest, setProposal, rejectRequest, markApplied, markFailed, retryRequest, touchWatching, isWatching } = (() => {
// 受信箱（HTML から Claude Code への依頼）のデータ操作。すべて不変更新の純関数。now は ISO 日時の文字列（呼び出し側が渡す）。
// 依頼: { id, at, projectId, status, thread: [{ role: "user"|"claude", at, text }], proposal, result }。状態の遷移は下の表のとおりで、合わない遷移は例外にする。
const MAX_REQUESTS = 20;
const MAX_TEXT = 4000;
const MAX_THREAD = 40;
const WATCH_FRESH_MS = 90000;

const FINISHED = ["applied", "rejected", "failed"];
const emptyInbox = (d) => d.inbox ?? { watching: null, requests: [] };
const requestsOf = (d) => emptyInbox(d).requests ?? [];
const withInbox = (d, patch) => ({ ...d, inbox: { watching: null, ...emptyInbox(d), ...patch } });

const getRequest = (data, id) => requestsOf(data).find((r) => r.id === id);

/** 20 件を超えたら、完了（applied・rejected・failed）の古いものから消す。処理中は消さない */
function pruneRequests(requests) {
  let over = requests.length - MAX_REQUESTS;
  if (over <= 0) return requests;
  const drop = new Set();
  for (const r of requests) {
    if (over <= 0) break;
    if (FINISHED.includes(r.status)) { drop.add(r.id); over--; }
  }
  return requests.filter((r) => !drop.has(r.id));
}

function checkText(text, label) {
  const t = String(text ?? "").trim();
  if (!t) throw new Error(`${label}を入力してください`);
  if (t.length > MAX_TEXT) throw new Error(`${label}は ${MAX_TEXT} 文字までにしてください`);
  return t;
}

const pushThread = (r, role, at, text) => {
  if (r.thread.length >= MAX_THREAD) throw new Error(`${r.id}: やりとりが ${MAX_THREAD} 件に達しました。新しい依頼として送ってください`);
  return [...r.thread, { role, at, text }];
};

/** id の依頼を、許された状態からだけ変える。fn(依頼) が新しい依頼を返す */
function transition(data, id, from, to, fn) {
  const r = getRequest(data, id);
  if (!r) throw new Error(`依頼 ${id} がありません`);
  if (!from.includes(r.status)) throw new Error(`依頼 ${id} は ${r.status} なので、${to} にできません`);
  const next = { ...fn(r), status: to };
  return withInbox(data, { requests: requestsOf(data).map((x) => (x.id === id ? next : x)) });
}

/** 依頼を足す（状態 pending）。履歴は 20 件まで */
function submitRequest(data, { text, projectId = null, now, working = false }) {
  const t = checkText(text, "依頼");
  if (projectId != null && !(data.projects ?? []).some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);
  const reqs = requestsOf(data);
  const n = reqs.reduce((m, r) => Math.max(m, Number(/^R(\d+)$/.exec(r.id)?.[1] ?? 0)), 0) + 1;
  const r = { id: `R${n}`, at: now, projectId, status: working ? "working" : "pending", thread: [{ role: "user", at: now, text: t }], proposal: null, result: null, ...(working ? { claimedAt: now } : {}) };
  return withInbox(data, { requests: pruneRequests([...reqs, r]) });
}

const claimRequest = (data, id, now) => transition(data, id, ["pending"], "working", (r) => ({ ...r, claimedAt: now }));

const askQuestion = (data, id, text, now) =>
  transition(data, id, ["working"], "question", (r) => ({ ...r, thread: pushThread(r, "claude", now, checkText(text, "質問")) }));

/** 利用者の返信（聞き返しへの答え、提案への修正の依頼）。提案は消えて、pending に戻る */
const replyToRequest = (data, id, text, now) =>
  transition(data, id, ["question", "proposed", "failed"], "pending", (r) => ({ ...r, thread: pushThread(r, "user", now, checkText(text, "返信")), proposal: null }));

const setProposal = (data, id, proposal, now) =>
  transition(data, id, ["working", "proposed"], "proposed", (r) => ({ ...r, thread: pushThread(r, "claude", now, checkText(proposal?.summary || "提案を作りました", "提案の要約")), proposal }));

const rejectRequest = (data, id, now) =>
  transition(data, id, ["pending", "working", "question", "proposed"], "rejected", (r) => ({ ...r, result: { at: now, by: null, summary: "却下" } }));

/** 反映済みにする。proposed のときだけ（二重適用の防止）。by: "html" | "claude" */
const markApplied = (data, id, { by, summary, now }) =>
  transition(data, id, ["proposed"], "applied", (r) => ({ ...r, result: { at: now, by, summary } }));

const markFailed = (data, id, message, now) =>
  transition(data, id, ["pending", "working", "question", "proposed"], "failed", (r) => ({ ...r, thread: pushThread(r, "claude", now, checkText(message, "理由")), proposal: null }));

/** 失敗した依頼を、もう一度提案してもらう（pending に戻す） */
const retryRequest = (data, id, now) =>
  transition(data, id, ["failed"], "pending", (r) => ({ ...r, thread: pushThread(r, "user", now, "もう一度提案してください"), proposal: null }));

const touchWatching = (data, now) => withInbox(data, { watching: { at: now } });

/** Claude Code が見ているか（印が WATCH_FRESH_MS 以内） */
function isWatching(data, nowMs) {
  const at = Date.parse(emptyInbox(data).watching?.at ?? "");
  return Number.isFinite(at) && nowMs - at <= WATCH_FRESH_MS;
}

return { MAX_REQUESTS, MAX_TEXT, MAX_THREAD, WATCH_FRESH_MS, getRequest, pruneRequests, submitRequest, claimRequest, askQuestion, replyToRequest, setProposal, rejectRequest, markApplied, markFailed, retryRequest, touchWatching, isWatching };
})();

/* src/ui/store.js */
const { createStore } = (() => {
// データファイル(JSON)の読み書き。File System Access API を使い、選んだファイルのハンドルを IndexedDB に覚える。
// 保存前に更新日時を比べ、他（Claude Code など）が更新していたら上書きせず conflict を返す。
// 開き直しは、権限が許可済みなら restore（確認なし）、確認が必要なら reopen（ボタンの押下で確認だけ）。ファイル選択は choose だけが出す。

const KEY = "dataFileHandle";
const PICKER_TYPES = [{ description: "プロジェクトデータ (JSON)", accept: { "application/json": [".json"] } }];

/** 既定の IndexedDB 保存先。get は失敗を投げ（理由を画面に出すため）、set は失敗しても false を返すだけ（記憶できないだけで、使えなくはしない） */
function defaultIdb() {
  const open = () => new Promise((resolve, reject) => {
    const req = indexedDB.open("pj-lens", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const req = fn(db.transaction("kv", mode).objectStore("kv"));
      req.onsuccess = () => resolve(req.result);

const { saveHtmlFile } = (() => {
// HTML ファイルの保存。保存ダイアログが使えるブラウザ（File System Access API）では、保存先を選ばせる（初期の場所はダウンロードフォルダ。前回の場所は覚えない）。
// 使えないブラウザや、取り消し以外で失敗したときは、ブラウザのダウンロードとして規約のファイル名で保存する（保存先はブラウザのダウンロード先）。

function download(file, html, w) {
  const url = w.URL.createObjectURL(new w.Blob([html], { type: "text/html" }));
  const a = w.document.createElement("a");
  a.href = url;
  a.download = file;
  a.click();
  w.setTimeout(() => w.URL.revokeObjectURL(url), 60000);
  return { ok: true, name: file, picked: false };
}

/**
 * @param file 規約のファイル名（保存ダイアログの初期の名前）
 * @param w ブラウザの window（テストでは差し替える）
 * @returns { ok: true, name, picked }（picked は保存ダイアログで選んだか。選んだ場所に書けずにダウンロードへ落としたときは fallback: true も付く）、
 *          または利用者が保存ダイアログを閉じたときの { ok: false, cancelled: true }
 */
async function saveHtmlFile(file, html, w = window) {
  if (typeof w.showSaveFilePicker !== "function") return download(file, html, w);
  let handle;
  try {
    handle = await w.showSaveFilePicker({ suggestedName: file, startIn: "downloads", types: [{ description: "HTML", accept: { "text/html": [".html"] } }] });
  } catch (e) {
    // 取り消しは、ダイアログを閉じたときだけ。権限がない・使えないなどは、何も作られていないので、ダウンロードに落とす
    return e?.name === "AbortError" ? { ok: false, cancelled: true } : download(file, html, w);
  }
  let out;
  try {
    out = await handle.createWritable();
    await out.write(html);
    await out.close();
    return { ok: true, name: handle.name ?? file, picked: true };
  } catch {
    // 選んだ場所に書けなかった（共有フォルダの権限・切断など）。書きかけを破棄して、ダウンロードに落とす（呼び出し側が利用者に知らせる）
    try { await out?.abort?.(); } catch { /* 破棄できなくても続ける */ }
    return { ...download(file, html, w), fallback: true };
  }
}

return { saveHtmlFile };
})();

const { esc, fmtMD, wdJa, hm, hh, STATUS_UI, statusDotHtml, flagPills } = (() => {

/** 分 → "09:05" */
const hh = toHHMM;

function flagPills(data, projectId, today, flags) {
  const out = [];

// 画面からの編集（追加・削除・更新）。すべて不変更新で、不正な入力は例外にする（呼び出し側が理由を表示する）。





const mapTask = (data, id, fn) => {
  if (!data.tasks.some((t) => t.id === id)) throw new Error(`タスク ${id} がありません`);
  return { ...data, tasks: data.tasks.map((t) => (t.id === id ? fn(t) : t)) };

const mapProject = (data, id, fn) => {
  if (!data.projects.some((p) => p.id === id)) throw new Error(`プロジェクト ${id} がありません`);
  return { ...data, projects: data.projects.map((p) => (p.id === id ? fn(p) : p)) };
};
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

/** このタスクの後続（推移的）の ID 集合 */
function downstream(data, id) {
  const down = new Set();
  const stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    for (const t of data.tasks) {
      if ((t.predecessors ?? []).includes(cur) && !down.has(t.id)) { down.add(t.id); stack.push(t.id); }

}

function predecessorCandidates(data, taskId) {
  const t = data.tasks.find((x) => x.id === taskId);

  return data.tasks
    .filter((u) => u.projectId === t.projectId && u.id !== taskId && !(t.predecessors ?? []).includes(u.id) && !down.has(u.id))

function updateTask(data, taskId, patch, today = nowLocal().date) {
  return mapTask(data, taskId, (t) => {
    const n = { ...t };

      if (!title) throw new Error("件名を入力してください");
      n.title = title;
    }
    if ("due" in patch) {
      if (!isDate(patch.due)) throw new Error("期限は YYYY-MM-DD の形式で入力してください");
      n.due = patch.due;
    }
    if ("start" in patch) {
      if (patch.start != null && patch.start !== "" && !isDate(patch.start)) throw new Error("開始日は YYYY-MM-DD の形式で入力してください");

    if ("name" in patch) next.name = String(patch.name ?? "").trim() || cur.name;
    if ("date" in patch) {

  return { data: next, ...(later.length && { warning: `後続 ${later.join(", ")} の期限より後になりました（replan で見直せます）` }) };
}

function moveProjectDates(data, projectId, edge, days) {
  const p = data.projects.find((x) => x.id === projectId);
  if (!p) throw new Error(`プロジェクト ${projectId} がありません`);
  const v = addDays(p[edge], days);
  if ((edge === "start" ? v > p.due : v < p.start)) return { data, error: "開始日が期限より後になります" };
  return { data: mapProject(data, projectId, (x) => ({ ...x, [edge]: v })) };

  let n = data.tasks.filter((t) => t.projectId === projectId).length + 1;
  while (data.tasks.some((t) => t.id === `${projectId}${n}`)) n++;
  return `${projectId}${n}`;
}

const newTask = (data, projectId, title, due, extra = {}) => ({
  id: nextTaskId(data, projectId), projectId, title, due, start: null, status: "To Do", memo: "",
  predecessors: [], waitingOn: null, importance: null, doneAt: null, sessions: [], ...extra,
});

  if (!data.projects.some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);

  for (const k of ["group", "subgroup"]) if (k in place) extra[k] = String(place[k] ?? "").trim() || null;

  return { ...data, tasks: [...data.tasks, newTask(data, projectId, name, addDays(today, 7), { start: today, ...extra })] };

function addTask(data, task) {
  if (!data.projects.some((p) => p.id === task.projectId)) throw new Error(`プロジェクト ${task.projectId} がありません`);
  const title = String(task.title ?? "").trim();
  if (!title) throw new Error("件名を入力してください");
  if (!isDate(task.due)) throw new Error("期限は YYYY-MM-DD の形式で入力してください");
  const { id, ...rest } = task;
  void id;
  return { ...data, tasks: [...data.tasks, newTask(data, task.projectId, title, task.due, { ...rest, title })] };
}

/** 他のタスクの先行になっていれば dependents を返し、force でなければ何も変えない。force なら参照を取り除いて削除する */
function deleteTask(data, taskId, { force = false } = {}) {
  if (!data.tasks.some((t) => t.id === taskId)) throw new Error(`タスク ${taskId} がありません`);
  const dependents = data.tasks.filter((t) => (t.predecessors ?? []).includes(taskId)).map((t) => t.id);
  if (dependents.length && !force) return { data, dependents };
  return {
    data: { ...data, tasks: data.tasks.filter((t) => t.id !== taskId).map((t) => ((t.predecessors ?? []).includes(taskId) ? { ...t, predecessors: t.predecessors.filter((p) => p !== taskId) } : t)) },
    dependents,
  };
}

/**
 * 設定（勤務時間・待ち長期化の日数・見出しの呼び名）の変更。patch に含まれる項目だけ変える。
 * 勤務時間は開始・終了を組で渡す。呼び名は空にするとそのキーを消す（既定の呼び名に戻る）。不正な値は例外

function updateSettings(data, patch) {
  const s = { ...(data.settings ?? {}) };
  if ("workday" in patch) {
    const { start, end } = patch.workday ?? {};
    if (!isTime(start) || !isTime(end) || toMin(start) >= toMin(end)) throw new Error("勤務時間は HH:MM で、開始を終了より前にしてください");
    s.workday = { start, end };
  }
  if ("waitingLongDays" in patch) {
    if (!Number.isInteger(patch.waitingLongDays) || patch.waitingLongDays < 1) throw new Error("待ち長期化の日数は 1 以上の整数にしてください");
    s.waitingLongDays = patch.waitingLongDays;
  }
  if ("labels" in patch) {
    const labels = s.labels && typeof s.labels === "object" && !Array.isArray(s.labels) ? { ...s.labels } : {};
    for (const k of ["group", "subgroup"]) {
      if (!(k in patch.labels)) continue;
      const v = String(patch.labels[k] ?? "").trim();
      if (v) labels[k] = v; else delete labels[k];
    }
    if (Object.keys(labels).length) s.labels = labels; else delete s.labels;
  }
  return { ...data, settings: s };
}

// ---- 休み（settings.holidays）と営業日の指定（settings.workdays）。どちらも { date, ... } の配列で、日付の昇順。同じ日は置き換える ----
const isEntry = (x) => x && typeof x === "object" && isDate(x.date);

/** list に entry を足す（同じ日は置き換え、日付の昇順）。形の違う既存の要素は消さず、末尾に残す（validate が注意を出す） */
function upsertByDate(list, entry) {
  const cur = Array.isArray(list) ? list : [];
  return [...cur.filter((x) => isEntry(x) && x.date !== entry.date), entry].sort((p, q) => p.date.localeCompare(q.date)).concat(cur.filter((x) => !isEntry(x)));
}

function removeByDate(list, date) {
  const rest = (Array.isArray(list) ? list : []).filter((x) => !(isEntry(x) && x.date === date));
  return rest.length ? rest : undefined;
}

const withSetting = (data, key, value) => {
  const s = { ...data.settings };
  if (value === undefined) delete s[key]; else s[key] = value;
  return { ...data, settings: s };
};

const entryOf = ({ date, note }, extra = {}) => {
  if (!isDate(date)) throw new Error(`実在する日付（YYYY-MM-DD）にしてください: ${date}`);
  const n = String(note ?? "").trim();
  return { date, ...extra, ...(n ? { note: n } : {}) };
};

/** 休みを 1 日足す。区分は 祝日・有給・その他 */
function addHoliday(data, { date, kind, note }) {
  if (!HOLIDAY_KINDS.includes(kind)) throw new Error(`区分は ${HOLIDAY_KINDS.join("・")} のどれかにしてください`);
  return withSetting(data, "holidays", upsertByDate(data.settings?.holidays, entryOf({ date, note }, { kind })));
}

/** from〜to（両端を含む）の各日から、土日と日本の祝日（取得済みのとき）を除いた日と、除いた日数。to < from と 366 日を超える期間は例外 */
function holidayRangeDays(data, from, to) {
  if (!isDate(from) || !isDate(to)) throw new Error(`実在する日付（YYYY-MM-DD）にしてください: ${isDate(from) ? to : from}`);
  if (to < from) throw new Error("終了日は開始日以降にしてください");
  if (diffDays(to, from) >= 366) throw new Error("期間は 366 日以内にしてください");
  const national = new Set(calendarOf({ nationalHolidays: data.settings?.nationalHolidays }).off);
  const days = [];
  for (let d = from; d <= to; d = addDays(d, 1)) if (!isWeekend(d) && !national.has(d)) days.push(d);
  return { days, skipped: diffDays(to, from) + 1 - days.length };
}

/** 期間の休みを 1 日ずつ足す（土日と日本の祝日は除く）。除いた結果が 0 日なら例外 */
function addHolidayRange(data, { from, to, kind, note }) {
  const { days } = holidayRangeDays(data, from, to);
  if (!days.length) throw new Error("期間内に休みにできる日がありません（土日と日本の祝日は除きます）");
  return days.reduce((d, date) => addHoliday(d, { date, kind, note }), data);
}

/** 休みを外す。無い日は何もしない。空になったらキーを消す */
const removeHoliday = (data, date) => withSetting(data, "holidays", removeByDate(data.settings?.holidays, date));

/** 営業日として扱う日（土日・祝日・休みでも営業日として数える）を足す */
const addWorkday = (data, { date, note }) => withSetting(data, "workdays", upsertByDate(data.settings?.workdays, entryOf({ date, note })));

const removeWorkday = (data, date) => withSetting(data, "workdays", removeByDate(data.settings?.workdays, date));

function addProject(data, { name, type = "その他" }, today = nowLocal().date) {
  const n = String(name ?? "").trim();
  if (!n) throw new Error("プロジェクト名を入力してください");
  const used = new Set(data.projects.map((p) => p.id));
  let id = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].find((c) => !used.has(c));
  for (let i = 1; !id; i++) if (!used.has(`P${i}`)) id = `P${i}`;
  const p = { id, name: n, type, status: "計画中", start: today, due: addDays(today, 30), milestones: [] };
  return { ...data, projects: [...data.projects, p] };
}

function deleteProject(data, projectId) {
  if (!data.projects.some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);
  const taskCount = data.tasks.filter((t) => t.projectId === projectId).length;
  // そのプロジェクトを指す会議のひも付け・規則・WBS の対応も消す(ID が再利用されても、別のプロジェクトへ付け替わらないように)
  const events = (data.events ?? []).map((e) => {
    if (e.projectId !== projectId) return e;
    const { projectBy, ...rest } = e;
    void projectBy;
    return { ...rest, projectId: null };
  });
  let settings = data.settings;
  if (settings) {
    settings = { ...settings };
    if (settings.projectRules) settings.projectRules = settings.projectRules.filter((r) => r.projectId !== projectId);
    if (settings.wbsMappings) settings.wbsMappings = Object.fromEntries(Object.entries(settings.wbsMappings).filter(([k]) => k !== projectId));
    if (settings.wbsImports) settings.wbsImports = Object.fromEntries(Object.entries(settings.wbsImports).filter(([k]) => k !== projectId));
  }
  return { data: { ...data, settings, events, projects: data.projects.filter((p) => p.id !== projectId), tasks: data.tasks.filter((t) => t.projectId !== projectId) }, taskCount };
}

return { predecessorCandidates, updateTask, updateProject, addMilestone, updateMilestone, deleteMilestone, moveMilestone, moveTaskDates, moveProjectDates, addTaskQuick, addTask, deleteTask, updateSettings, addHoliday, holidayRangeDays, addHolidayRange, removeHoliday, addWorkday, removeWorkday, addProject, deleteProject };
})();

/* src/ui/inboxops.js */
const { summarizeSections, planOps, applyProposal } = (() => {
// 受信箱の依頼の「変更の操作（ops）」の計画と適用。HTML と CLI（tools/inbox.js）が共有する。
// 計画（planOps）は、操作を作業用のコピーに当てて、変更案の表・警告・適用前の確認用の値（base）を作る。データは変えない。
// 適用（applyProposal）は、base が現在のデータと同じときだけ、同じ手順で操作を当てて、変更履歴を足す。
// 当てる順: addTask → addPred・removePred → moveDue（それぞれ書かれた順）。後続の動きは computeImpact の規則に合わせる。






const closed = (t) => t.status === "Done" || t.status === "Cancelled";
const max = (a, b) => (a > b ? a : b);

function simulate(data, ops, today) {
  if (!Array.isArray(ops) || !ops.length) throw new Error("操作がありません");
  for (const o of ops) if (!OP_KINDS.includes(o?.op)) throw new Error(`不明な操作です: ${o?.op}`);

  const before = new Map(data.tasks.map((t) => [t.id, t]));
  let w = data;
  const T = (id) => w.tasks.find((t) => t.id === id);
  const need = (id) => { const t = T(id); if (!t) throw new Error(`タスク ${id} がありません`); return t; };

  const refs = new Map();       // ref → 追加したタスクの ID
  const touched = new Set();    // 操作が触る既存のタスク（base の対象）
  const changed = new Set();    // 期限が動いたタスク（動いた順）
  const reasons = new Map();    // タスク ID → 期限が動いた理由
  const warnings = [];
  const predRows = [], addInfo = [], moves = [];
  const inboxIds = new Set();   // source: inbox の記録に載せるタスク
  const projects = new Set();
  let predCount = 0, addCount = 0;

  const setDue = (id, due, reason) => {
    w = updateTask(w, id, { due }, today);
    changed.add(id);
    reasons.set(id, reason);
  };
  /** id の期限を minDue 以上にする。動いたら、後続も先行の新しい期限を超えないように連鎖させる */
  const raise = (id, minDue, reason, group) => {
    const t = need(id);
    if (closed(t) || t.due >= minDue) return;
    setDue(id, minDue, reason);
    group.add(id);
    for (const s of w.tasks.filter((x) => (x.predecessors ?? []).includes(id))) raise(s.id, minDue, `先行 ${id} の遅れ`, group);
  };
  const resolve = (token) => refs.get(token) ?? token;

  // ① addTask（まず全部足し、先行は、足し終えてから結ぶ。ref で別の addTask を指せるように）
  // businessDays 指定の期限は、先行（既存のタスク、または別の addTask の ref）が決まってから計算する。ops の書く順には依存しない
  const adds = ops.filter((o) => o.op === "addTask");
  const dueOf = new Map(); // ref → 計算した期限（businessDays 指定のもの）
  const pending = adds.filter((o) => o.businessDays !== undefined);
  for (const o of adds) {
    const ref = String(o.ref ?? "").trim();
    if (!ref) throw new Error("addTask には ref が必要です");
    if (o.days !== undefined) throw new Error(`addTask（${ref}）には days は使えません。営業日は businessDays で指定してください`);
    const hasDue = o.due !== undefined, hasDays = o.businessDays !== undefined;
    if (hasDue === hasDays) throw new Error(`addTask（${ref}）には due か businessDays のどちらか一方が必要です`);
  }
  // 期限を動かす操作と同じ依頼に営業日指定の登録があると、先行の期限が動いて営業日が吸収される。2 回に分けてもらう（addTask 自体の誤りを先に知らせる）
  if (ops.some((o) => o.op === "moveDue") && pending.length) {
    throw new Error("期限の移動（moveDue）と営業日指定の登録（businessDays）は、同じ依頼にできません。先に期限の移動を承認してから、登録を依頼してください");
  }
  const refDue = new Map(adds.filter((o) => o.due !== undefined).map((o) => [String(o.ref).trim(), o.due]));
  while (pending.length) {
    const ready = pending.filter((o) => (o.predecessors ?? []).every((p) => !adds.some((x) => String(x.ref).trim() === p) || refDue.has(p)));
    if (!ready.length) throw new Error("addTask の先行が循環しています");
    for (const o of ready) {
      const open = (o.predecessors ?? []).map((p) => (refDue.has(p) ? { due: refDue.get(p), status: "To Do" } : need(p))).filter((t) => !closed(t));
      const base = open.map((t) => t.due).reduce(max, "") || today;

      refDue.set(ref, dueOf.get(ref));
      pending.splice(pending.indexOf(o), 1);

  const planned = new Map(); // ref → businessDays を due に固定した op
  for (const o of adds) {
    const ref = String(o.ref ?? "").trim();
    if (refs.has(ref)) throw new Error(`ref "${ref}" が重複しています`);
    const due = o.due ?? dueOf.get(ref);

    const start = o.start ?? ((o.predecessors ?? []).length || due < today ? null : today);

    projects.add(o.projectId);

  }
  for (const o of adds) {
    const id = refs.get(String(o.ref).trim());
    const preds = (o.predecessors ?? []).map(resolve);
    if (!preds.length) continue;
    for (const p of preds) {
      const pt = need(p);
      if (pt.projectId !== T(id).projectId) throw new Error(`先行 ${p} は別のプロジェクトのタスクです`);
      if (before.has(p)) touched.add(p);

    const has = (t.predecessors ?? []).includes(predId);

    if (before.has(predId)) touched.add(predId);

      w = updateTask(w, taskId, patch, today);

      predCount++; inboxIds.add(taskId);
      if (!closed(p)) raise(taskId, p.due, `先行 ${predId} を追加`, inboxIds);
    } else {

      w = updateTask(w, taskId, { predecessors: t.predecessors.filter((x) => x !== predId) }, today);

  for (const o of adds.filter((x) => x.businessDays !== undefined)) {
