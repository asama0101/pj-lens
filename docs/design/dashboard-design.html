<title>NW Project Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 上部に画面切替、俯瞰はプロジェクト別のタイムライン（機器ラックのように1案件=1段）＋右に今日の優先 */
:root{
  --bg:#F0F3F7; --surface:#FFFFFF; --ink:#16202E; --muted:#5A6678; --line:#D6DDE8; --line-soft:#E8ECF3;
  --accent:#0B6E8A; --accent-soft:#DCEEF4;
  --ok:#2E7D5B; --warn:#B26B00; --warn-soft:#FBEBD0; --bad:#C23A3A; --bad-soft:#F9DEDE;
  --todo:#8794A8; --meeting:#EBE4F7; --meeting-ink:#43346F; --meeting-edge:#7B5CC4; --free:#E9F4EC;
  --f-body:"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162030; --ink:#E5EBF3; --muted:#9AA7B9; --line:#2A3850; --line-soft:#1F2C40;
  --accent:#55B8D4; --accent-soft:#17323D;
  --ok:#5CC08F; --warn:#E3A94B; --warn-soft:#3A2D14; --bad:#EE7B7B; --bad-soft:#3B1D1F;
  --todo:#7B889C; --meeting:#2D2548; --meeting-ink:#D3C9F0; --meeting-edge:#9C84E0; --free:#14301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162030; --ink:#E5EBF3; --muted:#9AA7B9; --line:#2A3850; --line-soft:#1F2C40;
  --accent:#55B8D4; --accent-soft:#17323D;
  --ok:#5CC08F; --warn:#E3A94B; --warn-soft:#3A2D14; --bad:#EE7B7B; --bad-soft:#3B1D1F;
  --todo:#7B889C; --meeting:#2D2548; --meeting-ink:#D3C9F0; --meeting-edge:#9C84E0; --free:#14301F; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
.today{color:var(--muted);font-size:13px}
nav[role=tablist]{display:flex;gap:2px;background:var(--line-soft);padding:3px;border-radius:8px}
nav button{font:inherit;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer}
nav button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,30,50,.12)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:14px;margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
/* 状態の見た目（LED のようなドット） */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:baseline}
.s-todo{border:2px solid var(--todo);background:transparent}
.s-prog{background:var(--accent)}
.s-wait{background:var(--warn-soft);border:2px solid var(--warn)}
.s-done{background:var(--ok);opacity:.55}
.s-cancel{background:var(--todo);opacity:.4}
.is-late{box-shadow:0 0 0 3px var(--bad-soft);border-color:var(--bad)!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.pill.late{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{color:var(--ok)}
/* 俯瞰タイムライン */
.tl-head,.tl-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
.tl-axis{position:relative;height:22px;border-bottom:1px solid var(--line)}
.tl-axis span{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(-1px);padding-left:4px;border-left:1px solid var(--line-soft);height:22px}
.tl-row{padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.tl-row:last-child{border-bottom:0}
.proj-name{font-weight:700;line-height:1.35;display:block;background:none;border:0;padding:0;font-family:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
.proj-name:hover{color:var(--accent)}
.proj-meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.bar{height:5px;background:var(--line-soft);border-radius:3px;width:100%;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.lane{position:relative;height:44px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--line-soft) calc(12.5% - 1px),var(--line-soft) 12.5%)}
.lane .mk{position:absolute;top:17px;transform:translateX(-50%)}
.lane .ms{position:absolute;top:6px;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:var(--ink);opacity:.75}
.lane .ms-l{position:absolute;top:-1px;transform:translateX(6px);font-size:10px;color:var(--muted);white-space:nowrap}
.todayline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad);z-index:2}
.todaytag{position:absolute;top:-2px;font-size:11px;color:var(--bad);transform:translateX(-50%);background:var(--surface);padding:0 4px;z-index:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* 優先リスト */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{padding:10px 0;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 8px}
.rank li:last-child{border-bottom:0}
.rank .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:2px}
.rank .t{font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.rank .why{grid-column:2;color:var(--muted);font-size:12px;line-height:1.5}
.rank .act{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-right:6px}
.rank li[data-pick]{cursor:pointer;border-radius:6px}
.rank li.picked{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
/* テーブル */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:400;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .id{font-family:var(--f-mono);color:var(--muted);font-size:12px;white-space:nowrap}
.scroll-x{overflow-x:auto}
.st{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-size:12px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
.log .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.phead{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.phead h2{font-size:17px;margin:0}
.kv{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:700}
/* 日・週カレンダー */
.cal{position:relative;--calh:clamp(340px,calc(100vh - 400px),1000px);--calh:clamp(340px,calc(100dvh - 400px),1000px)}
.cal.wk{--calh:clamp(340px,calc(100vh - 500px),1000px);--calh:clamp(340px,calc(100dvh - 500px),1000px)}
.cal-grid{position:relative;height:var(--calh)}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--line-soft);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hour span{position:absolute;left:0;top:-9px;background:var(--surface);padding-right:4px}
.cal-body{position:absolute;left:44px;right:0;top:0;bottom:0}
.blk{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 6px;font-size:12px;line-height:1.35;overflow:hidden}
.blk.mtg{background:var(--meeting);color:var(--meeting-ink)}
.blk.task{background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-left-width:4px}
.blk .tm{font-family:var(--f-mono);font-size:10px;opacity:.8;display:block}
button.free{position:absolute;left:2px;right:2px;border:1px dashed var(--ok);background:var(--free);border-radius:5px;color:var(--ok);font:inherit;font-size:12px;cursor:default;padding:0 6px;text-align:left}
body.picking button.free{cursor:copy}
body.picking button.free:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media(max-width:860px){.daygrid{grid-template-columns:minmax(0,1fr)}}
.summary{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:12px;color:var(--muted);font-size:13px}
.summary b{color:var(--ink)}
.weekwrap{overflow-x:auto}
.week{display:grid;grid-template-columns:44px repeat(7,minmax(120px,1fr));min-width:44px}
.week .dh{padding:6px 6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.week .dh small{display:block;color:var(--muted);font-size:11px}
.week .dh.t{color:var(--accent);font-weight:700}
.week .col{position:relative;border-left:1px solid var(--line-soft);height:var(--calh)}
.week .col.today{background:linear-gradient(var(--accent-soft),var(--accent-soft));background-blend-mode:normal}
.week .col.weekend{background:var(--line-soft);opacity:.55}
.week .hrs{position:relative;height:var(--calh)}
.week .blk{left:3px;right:3px;font-size:11px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
.note{font-size:12px;color:var(--muted)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:640px){.tl-head,.tl-row{grid-template-columns:minmax(0,1fr)}.tl-head>div:first-child{display:none}}
@media (prefers-reduced-motion: no-preference){.panel{animation:none}}

.chip-btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:99px;cursor:pointer}
.chip-btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gantt{min-width:640px;padding-right:44px}
.g-row{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:center;border-bottom:1px solid var(--line-soft)}
.g-row:last-child{border-bottom:0}
.g-head{border-bottom:1px solid var(--line)}
.g-label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 6px;padding:5px 0;font-size:13px;line-height:1.35}
.g-label .id{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.g-label .g-pre{grid-column:2;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.g-lane{position:relative;height:36px}
.g-axis{height:24px}
.g-axis span{position:absolute;top:0;font-size:11px;color:var(--muted);padding-left:4px;border-left:1px solid var(--line-soft);height:24px}
.g-axis .ms{top:12px}
.gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.gbar{position:absolute;top:9px;height:18px;border-radius:4px}
.b-todo{border:2px solid var(--todo);background:transparent}
.b-prog{background:var(--accent)}
.b-wait{background:var(--warn-soft);border:2px solid var(--warn)}
.b-done{background:var(--ok);opacity:.5}
.b-cancel{background:var(--todo);opacity:.35}
.g-due{position:absolute;top:10px;margin-left:8px;font-size:11px;color:var(--muted)}
.g-lane .mk{top:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--surface);color:var(--muted);border:0;padding:4px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.in{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:100%;min-width:0}
.in.sm{width:auto}
.in:disabled{background:transparent;border-color:transparent;color:var(--muted)}
.tbl.edit{min-width:860px}
.tbl.edit td{vertical-align:top}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;gap:2px;align-items:center;font-family:var(--f-mono);font-size:12px;background:var(--line-soft);border-radius:5px;padding:1px 2px 1px 7px}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--bad)}
.ask{font-size:12px;color:var(--bad);max-width:190px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.ghost{position:absolute;left:2px;right:2px;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:5px;font-size:12px;padding:2px 6px;color:var(--accent);pointer-events:none;z-index:5}
.ghost.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.rank li[draggable=true]{cursor:grab}
.blk.task[draggable=true]{cursor:grab}
label{font-size:13px}
.pg{padding:6px 0 14px;border-bottom:1px solid var(--line)}.pg:first-child{padding-top:0}.pg:last-of-type{border-bottom:0}

.gtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.gscroll{position:relative;padding-bottom:6px}
.gwide{min-width:100%}
.g-row{display:flex;gap:12px;align-items:stretch;border-bottom:1px solid var(--line-soft)}
.g-label{position:sticky;left:0;z-index:4;flex:none;width:230px;background:var(--surface)}
.g-lane{flex:none}
.g-head{border-bottom:1px solid var(--line)}
.g-axis{height:24px;position:relative}
.g-axis span.yr{font-weight:700;color:var(--ink);border-left-color:var(--ink)}
.gl.yr{border-left:1px solid var(--muted)}
.pg{padding:8px 0 18px}
.pg-head{position:sticky;left:0;width:var(--vw,100%);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px;z-index:5}
.gscroll{--vw:100%}
.g-sumrow .g-lane{height:28px}
.gsum{top:8px;height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.gsum u{position:absolute;left:0;top:0;bottom:0;background:var(--ok);opacity:.6;text-decoration:none}
.g-sumrow .gbar{top:8px}
.g-due{position:absolute;top:10px;margin-left:8px;font-size:11px;color:var(--muted);white-space:nowrap}
@media(max-width:640px){.g-row{display:flex}}

/* 幅は画面サイズに追従(全画面で統一) */
.wrap{max-width:none}
.cols{grid-template-columns:minmax(0,1fr) clamp(260px,22vw,340px)}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.cols>.panel>.toolbar{margin-bottom:10px}
.gscroll{container-type:inline-size;--lw:230px;overflow-x:auto;padding-bottom:6px}
@media(max-width:640px){.gscroll{--lw:112px}.g-label{font-size:12px}}
.gwide{width:max-content;min-width:100%}
.g-label{width:var(--lw)}
.pg-head{width:100cqw}
.g-lane{min-width:0}
.week{grid-template-columns:44px repeat(7,minmax(0,1fr))}
.week .dh{font:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.week .dh:hover{background:var(--accent-soft)}
.week .blk{overflow:hidden;text-overflow:ellipsis}
.duecell{padding:6px;border-left:1px solid var(--line-soft);font-size:12px;min-height:34px;min-width:0;overflow-wrap:anywhere}
.cal{min-width:0}
.tbl.edit{min-width:0;table-layout:auto}
@media(max-width:860px){
  .tbl.edit thead{display:none}
  .tbl.edit tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .tbl.edit td{display:block;padding:0;border:0}
  .tbl.edit td::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  .tbl.edit td[data-l=""]::before,.tbl.edit td[data-l="ID"]::before{display:none}
  .tbl.edit td:nth-child(2){grid-column:1/-1}
}

.g-lane .gbar{top:6px;height:14px}
.g-lane .gbar.gsum{top:8px;height:12px}
.gact{position:absolute;top:23px;height:5px;border-radius:3px;background:var(--ok)}
.mslist{display:flex;flex-direction:column;gap:6px}
.msrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msrow .in:first-child{flex:1 1 200px;width:auto}
.blk.task{padding-bottom:6px}
.blk.task.plan{background:var(--accent-soft);border:1px solid var(--accent);border-left-width:4px}
.blk.task.act{background:color-mix(in srgb,var(--ok) 22%,var(--surface));border:1px solid var(--ok);border-left-width:4px}
.blk.task.unconf{background:var(--warn-soft);border:1px dashed var(--warn);border-left:4px dashed var(--warn)}
.blk .bb{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.blk .bb .btn{padding:0 6px;font-size:11px}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize}
.blk .rz::after{content:"";position:absolute;left:50%;bottom:2px;width:16px;height:2px;margin-left:-8px;border-radius:1px;background:currentColor;opacity:.35}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:6;pointer-events:none}

.g-label{grid-template-columns:28px minmax(0,1fr) auto}
.g-label .g-pre{grid-column:2/-1}
.g-name{font:inherit;font-size:13px;text-align:left;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;line-height:1.35;overflow-wrap:anywhere}
.g-name:hover{color:var(--accent);text-decoration:underline}
.gx{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 4px;opacity:0;line-height:1}
.g-row:hover .gx,.gx:focus-visible{opacity:1}
.gx:hover{color:var(--bad)}
.g-add .in{font-size:12px;padding:3px 8px;background:transparent;border-style:dashed}
.g-add .g-lane{height:34px}
.gdrag{cursor:grab}
.gbar.fixl{cursor:default}
.gh{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.gh.l{left:-2px}.gh.r{right:-2px}
.gsum .gh{width:7px}.gsum .gh.l{left:0}.gsum .gh.r{right:0}
.gbar:hover .gh::after,.gsum:hover .gh::after{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:2px;border-radius:1px;background:currentColor;opacity:.55}
.ms{cursor:ew-resize}
tr.hl{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
tr.hl td{transition:background .3s}
.tbl.edit td[data-l="開始"] small{font-size:11px}
.g-add .g-label{display:block;padding:4px 0}.g-add .g-label .in{width:100%}

.g-lane .ms{position:absolute;transform:translateX(-50%) rotate(45deg);width:11px;height:11px;background:var(--ink);opacity:.9;cursor:ew-resize;z-index:3}
.g-lane .ms-l{position:absolute;transform:translateX(10px);font-size:11px;line-height:1.3;color:var(--ink);white-space:nowrap;pointer-events:none;z-index:3}

        :`<div class="g-label"><span class="id">${t.id}</span><button class="g-name" data-goto="${t.id}" title="リストで編集する">${esc(t.t)}</button><button class="gx" data-del="${t.id}" aria-label="${t.id} を削除">×</button><span class="g-pre">${hasPre?"← "+t.pre.join(", "):""}</span></div>`;
      return `<div class="g-row">${lab}<div class="g-lane" ${laneW}>${gp}${tl}${bar}${act}<span class="g-due mono" style="left:${x(e)}">${fmt(t.due)}</span></div></div>`}).join("");
    return `<section class="pg" aria-label="${esc(p.name)}">${head}<div class="g-row g-head"><div class="g-label"></div><div class="g-lane g-axis ${dayScale?"day":""}" ${laneW}>${dayScale?"":`<span class="todaytag" style="left:${x(dnum(TODAY))}">今日</span>`}${axis}</div></div>${msrow}${sum}${rows}<div class="g-row g-add"><div class="g-label"><input class="in" data-gadd="${p.id}" placeholder="＋ タスクを追加(名前を入力して Enter)" aria-label="${esc(p.name)} にタスクを追加"></div><div class="g-lane" ${laneW}>${gp}${tl}</div></div></section>`}).join("");
  return `${ganttTools()}<div class="gscroll" data-todayfrac="${((dnum(TODAY)-s0)/span).toFixed(5)}" data-s0="${s0}" data-span="${span}"><div class="gwide">${sec}</div></div>${GLEGEND}`}

/* 今日の優先(プロジェクト・スケジュールで共通) */
function prioPanel(sched){

    const pill=n?` <span class="pill ok">${n}回・実績 ${sessHrs(r.id).toFixed(1)}h</span>`:"";

  return `<section class="panel" aria-labelledby="h-rk"><h2 id="h-rk">今日の優先</h2><ol class="rank">${sched?rk:rk.split("</li>").slice(0,4).join("</li>")+"</li>"}</ol>

/* プロジェクト(俯瞰を統合): 絞り込み × リスト/ガント */
const SOPT=["To Do","In Progress","Waiting","Done","Cancelled"];
const PSOPT=["計画中","進行中","保留","完了","中止"];
function plist(p){
  const g=prog(p.id);
  const rows=T.filter(t=>t.p===p.id).map(t=>{
    const bad=downstream(t.id),cand=T.filter(u=>u.p===p.id&&u.id!==t.id&&!t.pre.includes(u.id)&&!bad.has(u.id));

    return `<tr data-row="${t.id}"><td class="id" data-l="ID">${t.id}</td>
     <td data-l="件名"><input class="in" id="f-${t.id}-t" data-f="t" data-id="${t.id}" value="${esc(t.t)}" aria-label="${t.id} の件名"></td>
     <td data-l="状態"><select class="in" data-f="s" data-id="${t.id}" aria-label="${t.id} の状態">${SOPT.map(o=>`<option ${o===t.s?"selected":""}>${o}</option>`).join("")}</select></td>
     <td data-l="開始">${t.pre.length?`<span class="mono muted" title="先行タスクの期限から決まります">${fmt(startOf(t))} <small>先行から</small></span>`:`<input class="in" type="date" data-f="st" data-id="${t.id}" value="${t.st||""}" aria-label="${t.id} の開始日">`}</td>
     <td data-l="期限"><input class="in" type="date" data-f="due" data-id="${t.id}" value="${t.due}" aria-label="${t.id} の期限"></td>
     <td data-l="先行"><div class="chips">${chips}${add}</div></td>
     <td data-l="待ち先"><input class="in" data-f="wp" data-id="${t.id}" value="${t.w?esc(t.w.party):""}" placeholder="${t.s==="Waiting"?"ベンダー・部署名":"—"}" ${t.s==="Waiting"?"":"disabled"} aria-label="${t.id} の待ち先">${wp}</td>
     <td data-l="実績" class="mono muted">${actTxt(t)}</td><td data-l="">${delCell}</td></tr>`}).join("");
  const log=LOG.filter(l=>l.p===p.id).map(l=>`<li><span class="d">${fmt(l.d)}</span><span><span class="pill">${l.c}</span> ${esc(l.m)}</span></li>`).join("")||`<li class="muted">変更履歴はありません。</li>`;
  return `<section class="panel" aria-label="${esc(p.name)}"><div class="phead"><div><h2><button class="proj-name" data-filter="${p.id}" style="font-size:17px">${esc(p.name)}</button></h2><div class="kv" style="align-items:center">
      <span>${p.type}</span><label>状態 <select class="in sm" data-pf="status" data-pid="${p.id}" aria-label="${esc(p.name)} の状態">${PSOPT.map(o=>`<option ${o===p.status?"selected":""}>${o}</option>`).join("")}</select></label>
      <label>開始 <input class="in sm" type="date" data-pf="start" data-pid="${p.id}" value="${p.start}" aria-label="${esc(p.name)} の開始日"></label>
      <label>期限 <input class="in sm" type="date" data-pf="due" data-pid="${p.id}" value="${p.due}" aria-label="${esc(p.name)} の期限"></label>
      <span>進捗 <b class="mono">${g.d}/${g.n}</b> (${g.r}%)</span><span>実績 <b class="mono">${projHrs(p.id).toFixed(1)}h</b></span></div></div><div>${projFlags(p.id)}</div></div>

    <h2 style="margin:18px 0 8px;font-size:13px">マイルストーン</h2>
    <div class="mslist">${p.ms.map((m,i)=>`<div class="msrow"><input class="in" data-mf="n" data-pid="${p.id}" data-i="${i}" value="${esc(m.n)}" aria-label="マイルストーン名"><input class="in sm" type="date" data-mf="d" data-pid="${p.id}" data-i="${i}" value="${m.d}" aria-label="マイルストーンの日付"><button class="btn" data-msdel="${p.id}|${i}" aria-label="${esc(m.n)} を削除">削除</button></div>`).join("")||'<p class="muted" style="margin:0">マイルストーンはありません。</p>'}<div><button class="btn" data-msadd="${p.id}">＋ マイルストーンを追加</button> <span class="note">ガントに◆で表示されます。</span></div></div>

function projects(){

    <div class="cols">${body}${prioPanel(false)}</div>`}

/* 枠の選択と削除(間違えて置いた・実績にしたときは、枠を選んで削除し、置き直す) */
let selSess=null,selMtg=null,mtgDraft=null,CALPART=null;
/* 会議: src は "mcp"(取得) か "manual"(手入力)。skip=true は「参加しない」(空き時間として扱う) */
let MTG=[],MSEQ=0;
Object.entries(EV).forEach(([d,l])=>l.forEach(e=>MTG.push({id:"m"+(++MSEQ),date:d,start:e[0],end:e[1],title:e[2],src:"mcp",skip:false})));
const evOn=d=>MTG.filter(m=>m.date===d&&!m.skip);
const evAll=d=>MTG.filter(m=>m.date===d);
function delSel(){
  if(selMtg){const m=MTG.find(o=>o.id===selMtg);
    if(m&&m.src==="mcp"){toast("MCPで取得した会議は削除できません。出席しない会議は「参加しない」にしてください");return}
    if(m){MTG=MTG.filter(o=>o.id!==m.id);selMtg=null;show();toast(`会議「${m.title}」を削除しました`);return}}
  const x=SES.find(o=>o.id===selSess);if(!x){toast("削除する枠を選んでください");return}
  SES=SES.filter(o=>o.id!==x.id);selSess=null;show();toast(`${task(x.task).t} の${x.st==="actual"?"実績":"予定"}の枠を削除しました`)}
/* カレンダー共通 */
const H0=9*60;
const pc=m=>(m-H0)/540*100,tp=m=>pc(m).toFixed(3)+"%",ht=(a,b)=>`calc(${(pc(b)-pc(a)).toFixed(3)}% - 2px)`;
const hoursHtml=()=>{let s="";for(let h=9;h<=18;h++)s+=`<div class="hour" style="top:${((h-9)/9*100).toFixed(3)}%"><span>${h}:00</span></div>`;return s};
function freeSlots(date,placed){
  const busy=[...evOn(date).map(e=>[tmin(e.start),tmin(e.end)]),...placed.map(x=>[tmin(x.start),tmin(x.end)])].sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=9*60;for(const[b0,b1]of busy){if(b0>cur)out.push([cur,b0]);cur=Math.max(cur,b1)}if(cur<18*60)out.push([cur,18*60]);return out}
const hm=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const hh=m=>hm(m).padStart(5,"0");
const placedOn=d=>SES.filter(s=>s.date===d);
const isWE=d=>["日","土"].includes(wday(d));
/* 作業枠(セッション): 未来=予定、過去=実績(未確認なら「実績にする」で確定)。1つのタスクが複数の枠を持てる */
const NOW="10:15";
const isPast=(d,end)=>d<TODAY||(d===TODAY&&tmin(end)<=tmin(NOW));
const sessCls=s=>s.st==="actual"?"act":(isPast(s.date,s.end)?"unconf":"plan");
function tryPlace(sid,startMin,date){
  const cur=SES.find(x=>x.id===sid),dur=cur?tmin(cur.end)-tmin(cur.start):60;
  const s=Math.max(9*60,Math.min(Math.round(startMin/15)*15,18*60-dur)),e=s+dur;
  const hit=placedOn(date).find(x=>x.id!==sid&&tmin(x.start)<e&&tmin(x.end)>s);
  const mt=evOn(date).find(m=>tmin(m.start)<e&&tmin(m.end)>s);
  return{s,e,dur,hit,mt,we:isWE(date)};
}
function addSession(taskId,date,s,e){const st=isPast(date,hh(e))?"actual":"planned";SES.push({id:"s"+(++SEQ),task:taskId,date,start:hh(s),end:hh(e),st});return st}
const blocksHtml=(d,full)=>{
  const mt=evAll(d).map(m=>{const a=Math.max(tmin(m.start),9*60),b=Math.min(tmin(m.end),18*60);if(b<=a)return "";
    return `<div class="blk mtg ${m.skip?"skip":""} ${selMtg===m.id?"sel":""}" data-mtg="${m.id}" tabindex="0" ${m.src==="manual"?`draggable="true" data-dragmtg="${m.id}"`:""} style="top:${tp(a)};height:${ht(a,b)}" title="${esc(m.title)}${m.skip?"(参加しない)":""}${m.src==="mcp"?"(MCP取得)":""}"><span class="tm">${full?m.start+"-"+m.end:m.start}${m.skip?" 不参加":""}</span>${esc(m.title)}${m.src==="manual"?`<i class="rz" data-rzm="${m.id}" aria-label="終了時刻を変更"></i>`:""}</div>`}).join("");
  const tk=placedOn(d).map(x=>{const c=sessCls(x),t=task(x.task);
    const btn=full?`<span class="bb">${x.st==="planned"&&isPast(d,x.start)||x.st==="planned"&&d===TODAY&&tmin(x.start)<=tmin(NOW)?`<button class="btn" data-confirm="${x.id}">実績にする</button>`:""}</span>`:"";
    return `<div class="blk task ${c} ${selSess===x.id?"sel":""}" draggable="true" tabindex="0" data-dragsess="${x.id}" style="top:${tp(tmin(x.start))};height:${ht(tmin(x.start),tmin(x.end))}" title="${esc(t.t)}(${c==="act"?"実績":c==="unconf"?"未確認":"予定"})"><span class="tm">${full?x.start+"-"+x.end:x.start}${c==="act"?" ✓":c==="unconf"?" 未確認":""}</span>${full?esc(x.task)+" ":""}${esc(t.t)}${btn}<i class="rz" data-rz="${x.id}" aria-label="終了時刻を変更"></i></div>`}).join("");
  return mt+tk};

/* スケジュール(週間と1日を統合): 配置した枠が予定、過ぎた枠が実績 */
function mtgPanel(){
  const m=mtgDraft||MTG.find(o=>o.id===selMtg);if(!m)return "";
  const isNew=!!mtgDraft,lock=!isNew&&m.src==="mcp"?"disabled":"";
  return `<div class="mtgform" role="group" aria-label="会議の${isNew?"追加":"編集"}">

    <label>終了<input class="in" type="time" step="900" data-mt="end" value="${m.end}" ${lock}></label>
    <label class="chk"><input type="checkbox" data-mt="skip" ${m.skip?"checked":""}>参加しない(空き時間として扱う)</label>
    <div style="display:flex;gap:6px;align-items:center">${isNew?`<button class="btn" data-mtgsave>追加</button><button class="btn" data-mtgcancel>キャンセル</button>`:`${m.src==="manual"?`<button class="btn danger" data-delsel>会議を削除</button>`:""}<button class="btn" data-mtgclose>閉じる</button>`}</div>
    ${!isNew&&m.src==="manual"?`<p class="note" style="flex-basis:100%;margin:0">カレンダー上でドラッグして移動（別の日へも）、下端をドラッグして長さを変えられます。</p>`:""}${!isNew&&m.src==="mcp"?`<p class="note" style="flex-basis:100%;margin:0">MCPで取得した会議です。件名と時間は取得内容が正のため変更できません。出席しない会議は「参加しない」にします（削除しても、次の取得で戻ります）。</p>`:""}
  </div>`}
function schedule(){
  const wk=weekStartOf(SDATE),days=[0,1,2,3,4,5,6].map(i=>addD(wk,i));
  const title=SVIEW==="week"?`${fmt(days[0])}〜${fmt(days[6])} の週`:`${fmt(SDATE)}(${wday(SDATE)})`;
  const step=SVIEW==="week"?7:1;
  const inView=SVIEW==="week"?SES.filter(s=>s.date>=days[0]&&s.date<=days[6]):placedOn(SDATE);
  const unconf=inView.filter(s=>sessCls(s)==="unconf").length;
  const sel=inView.find(s=>s.id===selSess);
  const act=inView.filter(s=>s.st==="actual").reduce((a,s)=>a+(tmin(s.end)-tmin(s.start)),0)/60;
  const nav=`<div class="toolbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" data-nav="${-step}" aria-label="前へ">←</button><button class="btn" data-nav="${step}" aria-label="次へ">→</button><button class="btn" data-sgoto>今日</button><strong style="margin-left:6px">${title}</strong></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" data-mtgadd>＋ 会議を追加</button><div class="seg" role="group" aria-label="表示"><button data-sview="week" aria-pressed="${SVIEW==="week"}">週</button><button data-sview="day" aria-pressed="${SVIEW==="day"}">日</button></div></div></div>
    <div class="summary"><span>実績 <b class="mono">${act.toFixed(1)}時間</b></span><span>予定 <b class="mono">${inView.filter(s=>s.st==="planned"&&!isPast(s.date,s.end)).length}件</b></span>${unconf?`<span class="pill wait">未確認 ${unconf}件</span><button class="btn" data-confirmall>未確認をすべて実績にする</button>`:""}${(()=>{const m=MTG.find(o=>o.id===selMtg);return `<button class="btn danger" data-delsel ${sel||(m&&m.src==="manual")?"":"disabled"}>${sel?`「${esc(task(sel.task).t)}」の枠を削除`:m&&m.src==="manual"?`会議「${esc(m.title)}」を削除`:"枠や会議を選んで削除"}</button>`})()}</div>`;
  const calendarPart=()=>{let cal;
  if(SVIEW==="week"){
    const heads=days.map(d=>{const fr=isWE(d)?0:freeSlots(d,placedOn(d)).reduce((a,x)=>a+x[1]-x[0],0);return `<button class="dh ${d===TODAY?"t":""}" data-day="${d}" aria-label="${fmt(d)}の1日表示">${fmt(d)}(${wday(d)})<small class="mono">${isWE(d)?"—":"空き "+(fr/60).toFixed(1)+"h"}</small></button>`}).join("");
    const cols=days.map(d=>`<div class="col dz ${d===TODAY?"today":""} ${isWE(d)?"weekend":""}" data-date="${d}">${blocksHtml(d,false)}</div>`).join("");
    const dues=days.map(d=>{const due=T.filter(t=>t.due===d&&t.s!=="Done"&&t.s!=="Cancelled");return `<div class="duecell">${due.map(t=>`<div style="display:flex;gap:6px;align-items:baseline"><i class="dot ${ST[t.s][0]}${late(t)?" is-late":""}"></i><span>${esc(t.t)}</span></div>`).join("")||'<span class="muted">—</span>'}</div>`}).join("");
    cal=`<div class="cal wk"><div class="week"><div></div>${heads}<div class="hrs">${hoursHtml()}</div>${cols}</div><div class="week" style="margin-top:8px"><div class="note" style="padding-top:6px">期限</div>${dues}</div></div>
      <p class="note" style="margin:8px 0 0">日付を押すと1日表示に切り替わります。枠をクリックして選び、「枠を削除」か Delete キーで削除できます。</p>`;
  }else{
    const d=SDATE,pl=placedOn(d),fr=isWE(d)?[]:freeSlots(d,pl);
    const fb=fr.filter(x=>x[1]-x[0]>=20).map(x=>`<button class="free" data-free="${x[0]}" style="top:calc(${pc(x[0]).toFixed(3)}% + 1px);height:calc(${(pc(x[1])-pc(x[0])).toFixed(3)}% - 3px)" aria-label="空き ${hm(x[0])}から${hm(x[1])}">${hm(x[0])}-${hm(x[1])} 空き</button>`).join("");
    const nowLine=d===TODAY?`<span class="nowline" style="top:${tp(tmin(NOW))}" title="現在 ${NOW}"></span>`:"";
    cal=`<div class="cal"><div class="cal-grid">${hoursHtml()}<div class="cal-body dz" id="calbody" data-date="${d}">${blocksHtml(d,true)}${fb}${nowLine}</div></div></div>`;
  }
  const day=SVIEW==="day";
  const legend=`<div class="slegend" aria-label="色の凡例"><span><i class="sw mtg"></i>会議</span><span><i class="sw skipsw"></i>参加しない会議</span><span><i class="sw plan"></i>予定</span><span><i class="sw act"></i>実績(✓)</span><span><i class="sw unconf"></i>未確認(過ぎた予定)</span>${day?'<span><i class="sw free"></i>空き時間</span><span><i class="sw now"></i>現在時刻</span>':""}<span><i class="sw sel"></i>選択中</span></div>`;
  return cal+legend};
  CALPART=calendarPart;
  return `<div class="cols"><section class="panel">${nav}<div id="mtgslot">${mtgPanel()}</div><div id="calslot">${calendarPart()}</div></section>${prioPanel(true)}</div>`}

/* 描画と操作 */
const view=document.getElementById("view");
let cur="project";
function show(){
  view.innerHTML=cur==="project"?projects():schedule();
  document.body.classList.toggle("picking",!!picked&&cur==="schedule"&&SVIEW==="day");
  document.querySelectorAll('nav [role=tab]').forEach(b=>b.setAttribute("aria-selected",b.id==="tab-"+cur?"true":"false"));
  scrollToday(false);
  if(focusSel){const el=view.querySelector(focusSel);if(el){el.focus();el.select&&el.select()}focusSel=null}
  if(hlId){const row=view.querySelector(`[data-row="${hlId}"]`);if(row){row.classList.add("hl");row.scrollIntoView({block:"center"});setTimeout(()=>row.classList.remove("hl"),2200)}hlId=null}
}
function scrollToday(smooth){requestAnimationFrame(()=>requestAnimationFrame(()=>view.querySelectorAll(".gscroll").forEach(c=>{const lane=c.querySelector(".g-lane");if(!lane)return;c.scrollTo({left:Math.max(0,Math.round(lane.offsetWidth*(+c.dataset.todayfrac)-120)),behavior:smooth?"smooth":"auto"})})))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},2400)}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("[role=tab]");if(!b)return;cur=b.id.slice(4);show()});
view.addEventListener("click",e=>{
  let cleared=false;if((selSess||selMtg)&&!e.target.closest("[data-dragsess],[data-mtg],[data-delsel],.mtgform,[data-mtgadd],[data-confirm],[data-confirmall]")){selSess=null;selMtg=null;cleared=true}
  const gw=e.target.closest("[data-gwin]");if(gw){GWIN=gw.dataset.gwin;show();return}
  if(e.target.closest("[data-hidedone]")){HIDE_DONE=!HIDE_DONE;show();return}
  if(e.target.closest("[data-gotoday]")){scrollToday(true);return}
  const f=e.target.closest("[data-filter]");if(f){FILTER=f.dataset.filter;show();return}
  const o=e.target.closest("[data-open]");if(o){FILTER=o.dataset.open;PVIEW="list";show();return}
  const pv=e.target.closest("[data-pview]");if(pv){PVIEW=pv.dataset.pview;show();return}
  const sv=e.target.closest("[data-sview]");if(sv){SVIEW=sv.dataset.sview;show();return}
  const nv=e.target.closest("[data-nav]");if(nv){SDATE=addD(SDATE,+nv.dataset.nav);show();return}
  if(e.target.closest("[data-sgoto]")){SDATE=TODAY;show();return}
  const dy0=e.target.closest("[data-day]");if(dy0){SDATE=dy0.dataset.day;SVIEW="day";show();return}
  const pk=e.target.closest("[data-pick]");if(pk){picked=picked===pk.dataset.pick?null:pk.dataset.pick;if(picked&&SVIEW==="week")toast("日表示にすると、空き枠を押して配置できます");show();return}
  const cf=e.target.closest("[data-confirm]");if(cf){SES.find(x=>x.id===cf.dataset.confirm).st="actual";show();toast("実績にしました。時間が違うときは、枠をドラッグして直します");return}
  if(e.target.closest("[data-confirmall]")){SES.forEach(x=>{if(sessCls(x)==="unconf")x.st="actual"});show();toast("未確認の枠を実績にしました");return}
  if(e.target.closest("[data-delsel]")){delSel();return}
  const sb=e.target.closest("[data-dragsess]");if(sb&&!e.target.closest("[data-rz]")){selSess=selSess===sb.dataset.dragsess?null:sb.dataset.dragsess;selMtg=null;show();return}
  const mb=e.target.closest("[data-mtg]");if(mb){selMtg=selMtg===mb.dataset.mtg?null:mb.dataset.mtg;selSess=null;mtgDraft=null;show();return}
  if(e.target.closest("[data-mtgadd]")){const base=SDATE===TODAY?Math.ceil((tmin(NOW)+1)/60)*60:10*60,st=Math.min(base,17*60);mtgDraft={date:SDATE,start:hh(st),end:hh(st+60),title:"",skip:false};selSess=null;selMtg=null;show();toast("会議の内容を入力して「追加」を押してください");return}
  if(e.target.closest("[data-mtgsave]")){const m=mtgDraft;if(tmin(m.end)<=tmin(m.start)){toast("終了は開始より後にしてください");return}const id="m"+(++MSEQ);MTG.push({id,date:m.date,start:m.start,end:m.end,title:m.title.trim()||"会議",src:"manual",skip:m.skip});const clash=SES.some(x=>x.date===m.date&&tmin(x.start)<tmin(m.end)&&tmin(x.end)>tmin(m.start));mtgDraft=null;selMtg=id;SDATE=m.date;show();toast(clash?"会議を追加しました。配置済みの枠と重なっています":"会議を追加しました");return}
  if(e.target.closest("[data-mtgcancel]")){mtgDraft=null;show();return}
  if(e.target.closest("[data-mtgclose]")){selMtg=null;show();return}
  const fr=e.target.closest("[data-free]");if(fr){if(!picked){toast("先にタスクを選んでください");return}
    const r=tryPlace(null,+fr.dataset.free,SDATE);const st=addSession(picked,SDATE,r.s,r.e);toast(`${task(picked).t} を ${hm(r.s)} に${st==="actual"?"実績として記録":"予定として配置"}しました`);picked=null;show();return}
  const rp=e.target.closest("[data-rmpre]");if(rp){const[id,pre]=rp.dataset.rmpre.split("|");const t=task(id);t.pre=t.pre.filter(x=>x!==pre);show();toast("先行を外しました");return}
  const at=e.target.closest("[data-addtask]");if(at){const pid=at.dataset.addtask,id=nextId(pid);T.push({id,p:pid,t:"新しいタスク",due:TODAY,s:"To Do",pre:[]});focusSel=`#f-${id}-t`;show();toast(`${id} を追加しました`);return}
  const gn=e.target.closest("[data-goto]");if(gn){const t=task(gn.dataset.goto);FILTER=t.p;PVIEW="list";hlId=t.id;focusSel=`#f-${t.id}-t`;show();return}
  const ma=e.target.closest("[data-msadd]");if(ma){const p=P.find(x=>x.id===ma.dataset.msadd);p.ms.push({n:"新しいマイルストーン",d:p.due});p.ms.sort((x,y)=>x.d<y.d?-1:1);show();toast("マイルストーンを追加しました");return}
  const md=e.target.closest("[data-msdel]");if(md){const[pid,i]=md.dataset.msdel.split("|");P.find(x=>x.id===pid).ms.splice(+i,1);show();toast("マイルストーンを削除しました");return}
  const dl=e.target.closest("[data-del]");if(dl){askDel=dl.dataset.del;show();return}
  if(e.target.closest("[data-delno]")){askDel=null;show();return}
  const dy=e.target.closest("[data-delyes]");if(dy){const id=dy.dataset.delyes;T.forEach(t=>{t.pre=t.pre.filter(x=>x!==id)});T.splice(T.findIndex(t=>t.id===id),1);SES=SES.filter(s=>s.task!==id);askDel=null;show();toast(`${id} を削除しました`);return}
  if(cleared)show();
});
view.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.mt){const f=el.dataset.mt,m=mtgDraft||MTG.find(o=>o.id===selMtg);if(!m)return;const old=m[f],v=f==="skip"?el.checked:el.value;
    if(!v&&f!=="title"&&f!=="skip"){el.value=old;toast("日付と時刻を入力してください");return}
    m[f]=v;if(tmin(m.end)<=tmin(m.start)){m[f]=old;el.value=old;toast("終了は開始より後にしてください");return}
    const c=document.getElementById("calslot");if(c&&CALPART)c.innerHTML=CALPART();if(!mtgDraft)toast(f==="skip"?(v?"参加しない会議にしました。空き時間として扱います":"参加する会議に戻しました"):"会議を更新しました(デモ)");return}
  if(el.dataset.pf){const p=P.find(x=>x.id===el.dataset.pid);p[el.dataset.pf]=el.value;show();toast("プロジェクトを更新しました(デモ)");return}
  if(el.dataset.mf){const p=P.find(x=>x.id===el.dataset.pid),m=p.ms[+el.dataset.i];if(el.dataset.mf==="n")m.n=el.value.trim()||m.n;else m.d=el.value||m.d;p.ms.sort((x,y)=>x.d<y.d?-1:1);show();toast("マイルストーンを更新しました(デモ)");return}
  if(el.dataset.addpre){if(el.value){task(el.dataset.addpre).pre.push(el.value);show();toast("先行を追加しました")}return}
  if(el.dataset.f){const t=task(el.dataset.id),f=el.dataset.f;
    if(f==="t")t.t=el.value.trim()||t.t;
    if(f==="due"){if(el.value&&t.pre.length===0&&t.st&&el.value<t.st){toast("期限は開始日以降にしてください");show();return}t.due=el.value||t.due}
    if(f==="st"){if(el.value&&el.value>t.due){toast("開始日は期限以前にしてください");show();return}if(el.value)t.st=el.value;else delete t.st}
    if(f==="s"){t.s=el.value;if(el.value==="Waiting"){t.w=t.w||{party:"",since:TODAY}}else{delete t.w}if(el.value==="Done")t.doneAt=TODAY;else delete t.doneAt}
    if(f==="wp"){t.w=t.w||{party:"",since:TODAY};t.w.party=el.value.trim()}
    show();toast("変更を保存しました(デモ)")}
});
/* ドラッグ&ドロップ: 優先リストからは新しい枠を追加(同じタスクを何度でも)、既存の枠は移動 */
let ghost=null,drag=null;
const minAtEl=(y,el)=>{const r=el.getBoundingClientRect();return H0+(y-r.top)/r.height*540};
const minAt=(e,dz)=>minAtEl(e.clientY,dz);
view.addEventListener("dragstart",e=>{const li=e.target.closest("[data-pick]"),bl=e.target.closest("[data-dragsess]"),mg=e.target.closest("[data-dragmtg]");
  drag=li?{kind:"task",id:li.dataset.pick}:bl?{kind:"sess",id:bl.dataset.dragsess}:mg?{kind:"mtg",id:mg.dataset.dragmtg}:null;if(!drag)return;e.dataTransfer.setData("text/plain",drag.id);e.dataTransfer.effectAllowed="move"});
view.addEventListener("dragover",e=>{const dz=e.target.closest(".dz");if(!dz||!drag)return;e.preventDefault();
  if(drag.kind==="mtg"){const mm=MTG.find(o=>o.id===drag.id),dur=tmin(mm.end)-tmin(mm.start),st=Math.max(9*60,Math.min(Math.round(minAt(e,dz)/15)*15,18*60-dur));
    if(!ghost||!ghost.isConnected||ghost.parentNode!==dz){if(ghost)ghost.remove();ghost=document.createElement("div");ghost.className="ghost";dz.appendChild(ghost)}
    ghost.style.top=tp(st);ghost.style.height=ht(st,st+dur);ghost.classList.remove("ng");ghost.textContent=`会議 ${hm(st)}-${hm(st+dur)}`;return}
  const r=tryPlace(drag.kind==="sess"?drag.id:null,minAt(e,dz),dz.dataset.date);if(!ghost||!ghost.isConnected||ghost.parentNode!==dz){if(ghost)ghost.remove();ghost=document.createElement("div");ghost.className="ghost";dz.appendChild(ghost)}
  ghost.style.top=tp(r.s);ghost.style.height=ht(r.s,r.e);ghost.classList.toggle("ng",!!(r.hit||r.we));ghost.textContent=r.we?"土日は配置できません":r.hit?"他のタスクと重なっています":`${hm(r.s)}-${hm(r.e)}${r.mt?"(会議と重なる)":""}`});
view.addEventListener("drop",e=>{const dz=e.target.closest(".dz");if(!dz||!drag)return;e.preventDefault();
  if(drag.kind==="mtg"){const mm=MTG.find(o=>o.id===drag.id),dur=tmin(mm.end)-tmin(mm.start),st=Math.max(9*60,Math.min(Math.round(minAt(e,dz)/15)*15,18*60-dur)),date=dz.dataset.date;
    mm.date=date;mm.start=hh(st);mm.end=hh(st+dur);const clash=SES.some(x=>x.date===date&&tmin(x.start)<st+dur&&tmin(x.end)>st);drag=null;show();
    toast(`会議「${mm.title}」を ${fmt(date)} ${hm(st)} に移動しました${clash?"。配置済みの枠と重なっています":""}`);return}
  const date=dz.dataset.date,r=tryPlace(drag.kind==="sess"?drag.id:null,minAt(e,dz),date);
  if(r.we)toast("土日は配置できません");
  else if(r.hit)toast("他のタスクと重なっているため配置できません");
  else{let msg;
    if(drag.kind==="task"){const st=addSession(drag.id,date,r.s,r.e);msg=`${task(drag.id).t} を ${fmt(date)} ${hm(r.s)} に${st==="actual"?"実績として記録":"予定として配置"}しました`}
    else{const x=SES.find(s=>s.id===drag.id);x.date=date;x.start=hh(r.s);x.end=hh(r.e);msg=`${task(x.task).t} を ${fmt(date)} ${hm(r.s)} に移動しました`}
    toast(r.mt?`${msg}(会議「${r.mt.title}」と重なっています)`:msg)}
  drag=null;picked=null;show()});
view.addEventListener("dragend",()=>{drag=null;if(ghost){ghost.remove();ghost=null}});
/* ガント上のドラッグで日付を変更(1日単位)。先行のあるタスクは、開始が先行から決まるので期限(右端)だけ動かせる */
view.addEventListener("mousedown",e=>{
  const tg=e.target.closest("[data-gt],[data-gp],[data-gms]");if(!tg||!e.target.closest(".gscroll"))return;
  const mode=e.target.closest("[data-gh]")?.dataset.gh||"m",sc=tg.closest(".gscroll"),lane=tg.closest(".g-lane"),span=+sc.dataset.span,s0=+sc.dataset.s0,ppd=lane.offsetWidth/span;
  let kind,t,p,ms,s,en,md=mode;
  if(tg.dataset.gt){kind="t";t=task(tg.dataset.gt);en=dnum(t.due);s=dnum(startOf(t));if(tg.classList.contains("dot")||s===en)md="r";else if(t.pre.length&&md==="m")return;if(t.pre.length&&md==="l")return}
  else if(tg.dataset.gp){kind="p";p=P.find(x=>x.id===tg.dataset.gp);s=dnum(p.start);en=dnum(p.due);if(md==="m")return}
  else{kind="m";const[pid,i]=tg.dataset.gms.split("|");p=P.find(x=>x.id===pid);ms=p.ms[+i];s=en=dnum(ms.d);md="r"}
  e.preventDefault();const x0=e.clientX;let dd=0,ns=s,ne=en;
  const pct=d=>((d-s0)/span*100).toFixed(3)+"%";
  const mv=ev=>{dd=Math.round((ev.clientX-x0)/ppd);ns=s;ne=en;
    if(md==="l")ns=Math.min(s+dd,en);else if(md==="r")ne=Math.max(en+dd,kind==="m"?-1e9:s);else{ns=s+dd;ne=en+dd}
    if(kind==="m"){tg.style.left=pct(ne)}else if(tg.classList.contains("dot")){tg.style.left=pct(ne)}else{tg.style.left=pct(ns);tg.style.width=((ne-ns)/span*100).toFixed(3)+"%"}
    tg.title=`${fmt(iso(ns))}〜${fmt(iso(ne))}`};
  const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);if(!dd){return}
    let msg;
    if(kind==="t"){const old=t.due;if(t.pre.length===0&&(md==="l"||md==="m")){t.st=iso(ns)}if(md!=="l")t.due=iso(ne);
      msg=`${t.id}: ${t.pre.length||md==="r"?"期限 "+fmt(t.due):fmt(startOf(t))+"〜"+fmt(t.due)}`;
      const late2=T.filter(u=>u.pre.includes(t.id)&&u.due<t.due).map(u=>u.id);if(late2.length)msg+=`。後続 ${late2.join(", ")} の期限より後になりました(replan で見直せます)`}
    else if(kind==="p"){if(md==="l")p.start=iso(ns);else p.due=iso(ne);msg=`${p.name}: ${fmt(p.start)}〜${fmt(p.due)}`}
    else{ms.d=iso(ne);p.ms.sort((a,b)=>a.d<b.d?-1:1);msg=`マイルストーン「${ms.n}」を ${fmt(ms.d)} に変更しました`}
    show();toast(msg+(kind==="m"?"":"(デモ)"))};
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)});
/* 手入力の会議: 下端をドラッグして終了時刻を変える */
view.addEventListener("mousedown",e=>{const h=e.target.closest("[data-rzm]");if(!h)return;e.preventDefault();e.stopPropagation();
  const m=MTG.find(o=>o.id===h.dataset.rzm),blk=h.closest(".blk"),a0=Math.max(tmin(m.start),9*60);
  const mv=ev=>{const end=Math.max(a0+15,Math.min(18*60,Math.round(minAtEl(ev.clientY,blk.parentNode)/15)*15));blk.style.height=ht(a0,end);blk.dataset.end=end};
  const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);const end=+blk.dataset.end;if(end){m.end=hh(end);toast(`会議「${m.title}」の終了を ${hm(end)} に変更しました`)}show()};
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)});
/* 枠の下端をドラッグして、終了時刻(=実際に作業した時間)を直す */
view.addEventListener("mousedown",e=>{const h=e.target.closest("[data-rz]");if(!h)return;e.preventDefault();e.stopPropagation();
  const x=SES.find(s=>s.id===h.dataset.rz),blk=h.closest(".blk"),top0=blk.getBoundingClientRect().top;
  const mv=ev=>{const end=Math.max(tmin(x.start)+15,Math.min(18*60,Math.round(minAtEl(ev.clientY,blk.parentNode)/15)*15));blk.style.height=ht(tmin(x.start),end);blk.dataset.end=end};
  const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);const end=+blk.dataset.end;if(!end)return;
    const hit=placedOn(x.date).find(o=>o.id!==x.id&&tmin(o.start)<end&&tmin(o.end)>tmin(x.start));
    if(hit){toast("他のタスクと重なるため、長さを変えられません")}else{x.end=hh(end);toast(`終了を ${hm(end)} に変更しました`)}show()};
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)});
document.addEventListener("keydown",e=>{const typing=e.target.matches&&e.target.matches("input,select,textarea");
  if((e.key==="Delete"||e.key==="Backspace")&&cur==="schedule"&&(selSess||selMtg)&&!typing){e.preventDefault();delSel()}
  if(e.key==="Escape"&&cur==="schedule"&&(selSess||selMtg||mtgDraft)){selSess=null;selMtg=null;mtgDraft=null;show()}});
view.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing&&e.target.matches("[data-gadd]")){e.preventDefault();const name=e.target.value.trim(),pid=e.target.dataset.gadd;if(!name){toast("タスク名を入力してください");return}
  const id=nextId(pid);T.push({id,p:pid,t:name,due:addD(TODAY,7),s:"To Do",pre:[]});focusSel=`[data-gadd="${pid}"]`;show();toast(`${id} を追加しました。バーをドラッグして日程を決めます`)}});
view.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-pick]")){e.preventDefault();e.target.click()}});
show();
})();
