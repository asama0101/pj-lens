<script>/* src/core/dates.js */
const { isDate, isTime, addDays, diffDays, weekday, isWeekend, toMin, toHHMM, today, nowLocal } = (() => {
// 日付(YYYY-MM-DD)・時刻(HH:MM)の文字列演算。Date の UTC 変換によるずれを避けるため、数値分解で計算する。

const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
const TIME_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;

// 暦日 → 1970-01-01 からの通算日数（グレゴリオ暦、proleptic）
function toDays(y, m, d) {
  y -= m <= 2 ? 1 : 0;
  const era = Math.floor(y / 400);
  const yoe = y - era * 400;
  const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
  const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}

function fromDays(z) {
  z += 719468;
  const era = Math.floor(z / 146097);
  const doe = z - era * 146097;
  const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
  const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  const mp = Math.floor((5 * doy + 2) / 153);
  const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
  const m = mp + (mp < 10 ? 3 : -9);
  return [yoe + era * 400 + (m <= 2 ? 1 : 0), m, d];
}

const pad = (n, w = 2) => String(n).padStart(w, "0");

/** 実在する YYYY-MM-DD か */
function isDate(s) {
  if (typeof s !== "string") return false;
  const m = DATE_RE.exec(s);
  if (!m) return false;
  const [y, mo, d] = [+m[1], +m[2], +m[3]];
  const [y2, m2, d2] = fromDays(toDays(y, mo, d));
  return y === y2 && mo === m2 && d === d2;
}

/** HH:MM（00:00〜23:59）か */
function isTime(s) {
  return typeof s === "string" && TIME_RE.test(s);
}

function parse(s) {
  if (!isDate(s)) throw new Error(`日付の形式が不正です: ${s}`);
  const m = DATE_RE.exec(s);
  return toDays(+m[1], +m[2], +m[3]);
}

function addDays(date, n) {
  const [y, m, d] = fromDays(parse(date) + n);
  return `${pad(y, 4)}-${pad(m)}-${pad(d)}`;
}

/** a - b（日数） */
function diffDays(a, b) {
  return parse(a) - parse(b);
}

/** 曜日（0=日 … 6=土） */
function weekday(date) {
  return (((parse(date) + 4) % 7) + 7) % 7;
}

const isWeekend = (date) => [0, 6].includes(weekday(date));

function toMin(hhmm) {
  if (!isTime(hhmm) && hhmm !== "24:00") throw new Error(`時刻の形式が不正です: ${hhmm}`);
  const [h, m] = hhmm.split(":");
  return +h * 60 + +m;
}

function toHHMM(min) {
  return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
}

/** 実行環境のローカル日付 */
function today() {
  const n = new Date();
  return `${pad(n.getFullYear(), 4)}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
}

/** 実行環境のローカル現在時刻 */
function nowLocal() {
  const n = new Date();
  return { date: today(), time: `${pad(n.getHours())}:${pad(n.getMinutes())}` };
}

return { isDate, isTime, addDays, diffDays, weekday, isWeekend, toMin, toHHMM, today, nowLocal };
})();

/* src/core/schema.js */
const { TASK_STATUS, PROJECT_STATUS, PROJECT_TYPE, IMPORTANCE, CAUSES, validate } = (() => {
// data.json の検証。errors は保存してはいけない不整合、warnings は保存を止めない注意。


const TASK_STATUS = ["To Do", "In Progress", "Waiting", "Done", "Cancelled"];
const PROJECT_STATUS = ["計画中", "進行中", "保留", "完了", "中止"];
const PROJECT_TYPE = ["増設", "更改", "改善", "不具合対処", "その他"];
const IMPORTANCE = ["high", "mid", "low"];
const CAUSES = ["ベンダー", "社内", "自分", "その他"];

const isDone = (t) => t.status === "Done" || t.status === "Cancelled";

/** 同じ日の枠が重なるか（端が接するだけは重ならない） */
const overlap = (a, b) => a.date === b.date && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);

/** 先行の循環を DFS で探す。循環に含まれるタスク ID の一覧を返す */
function findCycle(tasks) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const state = new Map(); // 1=探索中, 2=完了
  const stack = [];
  let found = null;
  const dfs = (id) => {
    if (found) return;
    state.set(id, 1);
    stack.push(id);
    for (const p of byId.get(id)?.predecessors ?? []) {
      if (!byId.has(p)) continue;
      if (state.get(p) === 1) { found = [...stack.slice(stack.indexOf(p)), p]; return; }
      if (!state.has(p)) dfs(p);
      if (found) return;
    }
    stack.pop();
    state.set(id, 2);
  };
  for (const t of tasks) if (!state.has(t.id)) dfs(t.id);
  return found;
}

/**
 * @param {object} data
 * @param {{date:string,time:string}} [now] 「未来の予定枠」の判定に使う現在時刻
 */
function validate(data, now = nowLocal()) {
  const errors = [];
  const warnings = [];
  const err = (m) => errors.push(m);
  const warn = (m) => warnings.push(m);

  if (!data || typeof data !== "object") return { errors: ["データがオブジェクトではありません"], warnings };
  for (const k of ["projects", "tasks", "events", "changeLog"]) {
    if (!Array.isArray(data[k])) err(`${k} が配列ではありません`);
  }
  if (errors.length) return { errors, warnings };

  const dup = (list, label) => {
    const seen = new Set();
    for (const x of list) {
      if (seen.has(x.id)) err(`${label} の ID が重複しています: ${x.id}`);
      seen.add(x.id);
    }
  };
  dup(data.projects, "プロジェクト");
  dup(data.tasks, "タスク");
  dup(data.events, "会議");

  const projectIds = new Set(data.projects.map((p) => p.id));
  const taskIds = new Set(data.tasks.map((t) => t.id));

  for (const p of data.projects) {
    if (!PROJECT_STATUS.includes(p.status)) err(`プロジェクト ${p.id}: 不明な状態 "${p.status}"`);
    if (!isDate(p.start)) err(`プロジェクト ${p.id}: 開始日の形式が不正です (${p.start})`);
    if (!isDate(p.due)) err(`プロジェクト ${p.id}: 期限の形式が不正です (${p.due})`);
    if (isDate(p.start) && isDate(p.due) && p.start > p.due) err(`プロジェクト ${p.id}: 開始日が期限より後です`);
    for (const m of p.milestones ?? []) {
      if (!isDate(m.date)) err(`プロジェクト ${p.id}: マイルストーン "${m.name}" の日付が不正です`);
    }
  }

  for (const t of data.tasks) {
    if (!TASK_STATUS.includes(t.status)) err(`タスク ${t.id}: 不明な状態 "${t.status}"`);
    if (!projectIds.has(t.projectId)) err(`タスク ${t.id}: 不明な projectId "${t.projectId}"`);
    if (!isDate(t.due)) err(`タスク ${t.id}: 期限の形式が不正です (${t.due})`);
    if (t.start != null && !isDate(t.start)) err(`タスク ${t.id}: 開始日の形式が不正です (${t.start})`);
    if (t.doneAt != null && !isDate(t.doneAt)) err(`タスク ${t.id}: 完了日の形式が不正です (${t.doneAt})`);
    if (t.importance != null && !IMPORTANCE.includes(t.importance)) err(`タスク ${t.id}: 不明な重要度 "${t.importance}"`);
    const preds = t.predecessors ?? [];
    for (const pid of preds) {
      if (!taskIds.has(pid)) err(`タスク ${t.id}: 存在しない先行 "${pid}"`);
      if (pid === t.id) err(`タスク ${t.id}: 自分自身を先行にしています（循環）`);
    }
    const predDue = preds.map((id) => data.tasks.find((x) => x.id === id)?.due).filter(isDate);
    if (isDate(t.due) && predDue.length && predDue.reduce((a, b) => (a > b ? a : b)) > t.due) warn(`タスク ${t.id}: 先行の期限が自分の期限より後です`);
    if (t.waitingOn && !isDate(t.waitingOn.since)) err(`タスク ${t.id}: 待ち開始日 (waitingOn.since) の形式が不正です`);
    if (t.status === "Waiting" && !t.waitingOn) warn(`タスク ${t.id}: Waiting なのに待ち先 (waitingOn) がありません`);
    if (preds.length && t.start != null) warn(`タスク ${t.id}: 先行があるため start は無視されます`);
    if (!preds.length && isDate(t.start) && isDate(t.due) && t.start > t.due) warn(`タスク ${t.id}: 開始日が期限より後です`);

    for (const s of t.sessions ?? []) {
      const label = `タスク ${t.id} の枠 ${s.id}`;
      if (!isDate(s.date) || !isTime(s.start) || !isTime(s.end)) { err(`${label}: 日付または時刻の形式が不正です`); continue; }
      if (toMin(s.end) <= toMin(s.start)) err(`${label}: 終了が開始以前です`);
      if (!["planned", "actual"].includes(s.kind)) err(`${label}: 不明な kind "${s.kind}"`);
      const future = s.date > now.date || (s.date === now.date && s.end > now.time);
      if (isDone(t) && s.kind === "planned" && future) warn(`タスク ${t.id}: ${t.status} なのに未来の予定枠 ${s.id} が残っています`);
    }
  }

  const cycle = findCycle(data.tasks);
  if (cycle) err(`先行が循環しています: ${cycle.join(" → ")}`);

  // 同じ日の枠どうしの重なり（タスクをまたいで判定）
  const all = data.tasks.flatMap((t) => (t.sessions ?? []).map((s) => ({ ...s, taskId: t.id })))
    .filter((s) => isDate(s.date) && isTime(s.start) && isTime(s.end));
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      if (overlap(all[i], all[j])) err(`枠 ${all[i].id} と ${all[j].id} が重なっています (${all[i].date})`);
    }
  }

  for (const e of data.events) {
    if (!isDate(e.date) || !isTime(e.start) || !isTime(e.end)) err(`会議 ${e.id}: 日付または時刻の形式が不正です`);
    else if (toMin(e.end) <= toMin(e.start)) err(`会議 ${e.id}: 終了が開始以前です`);
    if (!["mcp", "manual"].includes(e.source)) err(`会議 ${e.id}: 不明な source "${e.source}"`);
    if (e.projectId != null && !projectIds.has(e.projectId)) err(`会議 ${e.id}: 不明な projectId "${e.projectId}"`);
    if (e.projectBy != null && !["rule", "manual"].includes(e.projectBy)) err(`会議 ${e.id}: 不明な projectBy "${e.projectBy}"`);
    if (e.confirmed != null && typeof e.confirmed !== "boolean") err(`会議 ${e.id}: confirmed が真偽値ではありません`);
  }

  const st = data.settings ?? {};
  (st.projectRules ?? []).forEach((r, i) => {
    if (!String(r?.keyword ?? "").trim()) err(`settings.projectRules[${i}]: keyword が空です`);
    if (!projectIds.has(r?.projectId)) err(`settings.projectRules[${i}]: 不明な projectId "${r?.projectId}"`);
  });
  for (const [pid, m] of Object.entries(st.wbsMappings ?? {})) {
    if (!projectIds.has(pid)) err(`settings.wbsMappings: 不明なプロジェクト "${pid}"`);
    if (!m || typeof m !== "object" || Object.values(m).some((x) => typeof x !== "string")) err(`settings.wbsMappings.${pid}: 値は文字列のオブジェクトにしてください`);
  }

  for (const c of data.changeLog) {
    if (!isDate(c.at)) err("changeLog: 日付が不正です");
    for (const id of c.taskIds ?? []) if (!taskIds.has(id)) warn(`changeLog: 存在しないタスク ${id}`);
    if (!Number.isInteger(c.deltaDays)) err("changeLog: deltaDays が整数ではありません");
    if (c.cause != null && !CAUSES.includes(c.cause)) err(`changeLog: 不明な原因 "${c.cause}"`);
    if (c.source != null && !["wbs", "mail", "calendar"].includes(c.source)) err(`changeLog: 不明な source "${c.source}"`);
    if (c.messageIds != null && (!Array.isArray(c.messageIds) || c.messageIds.some((x) => typeof x !== "string"))) err("changeLog: messageIds は文字列の配列にしてください");
  }

  return { errors, warnings };
}

return { TASK_STATUS, PROJECT_STATUS, PROJECT_TYPE, IMPORTANCE, CAUSES, validate };
})();

/* src/core/metrics.js */
const { taskStart, ganttRows, ganttLayout, timeTicks, projectProgress, taskFlags, projectFlags } = (() => {
// 進捗率・遅延判定・ガント用の算出（純関数）


const WINDOW_DAYS = { m1: 31, m3: 92, m6: 183, y1: 365 };
const MARGIN_DAYS = 7;

const taskOf = (data, id) => data.tasks.find((t) => t.id === id);
const maxDate = (list) => list.reduce((a, b) => (a > b ? a : b));
const minDate = (list) => list.reduce((a, b) => (a < b ? a : b));

/** 先行があれば先行の期限の最大値（start は無視）、なければ start、それもなければ期限 */
function taskStart(data, taskId) {
  const t = taskOf(data, taskId);
  const preds = (t.predecessors ?? []).map((id) => taskOf(data, id)).filter(Boolean);
  if (preds.length) return maxDate(preds.map((p) => p.due));
  return t.start ?? t.due;
}

/** 実績の線: 最初の実績枠の日 → 完了日（未完了なら today） */
function actualSpan(t, today) {
  const days = (t.sessions ?? []).filter((s) => s.kind === "actual").map((s) => s.date).sort();
  if (!days.length) return null;
  const finished = t.status === "Done" || t.status === "Cancelled";
  let end = finished ? (t.doneAt ?? days[days.length - 1]) : today;
  if (end < days[0]) end = days[0];
  return { start: days[0], end };
}

function ganttRows(data, projectId, today) {
  const p = data.projects.find((x) => x.id === projectId);
  const tasks = data.tasks.filter((t) => t.projectId === projectId);
  const milestones = [...(p.milestones ?? [])].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const rows = tasks.map((t) => {
    const s = taskStart(data, t.id);
    const point = s >= t.due;
    return {
      taskId: t.id,
      start: point ? t.due : s,
      end: t.due,
      point,
      actual: actualSpan(t, today),
    };
  });
  const dates = [p.start, p.due, ...milestones.map((m) => m.date), ...rows.flatMap((r) => [r.start, r.end, ...(r.actual ? [r.actual.start, r.actual.end] : [])])];
  return {
    range: { start: addDays(minDate(dates), -MARGIN_DAYS), end: addDays(maxDate(dates), MARGIN_DAYS) },
    rows,
    milestones,
  };
}

/** 表示期間 → 範囲全体の幅が画面幅の何倍か（ratio）と目盛りの種類 */
function ganttLayout(range, window) {
  const total = diffDays(range.end, range.start) + 1;
  const visibleDays = Math.min(window === "all" ? total : WINDOW_DAYS[window], total);
  const scale = visibleDays <= 40 ? "day" : visibleDays <= 100 ? "week" : visibleDays <= 420 ? "month" : "quarter";
  return { visibleDays, ratio: total / visibleDays, scale };
}

const ymd = (date) => date.split("-").map(Number);
const monthFirst = (y, m) => `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-01`;

function timeTicks(range, scale) {
  const out = [];
  if (scale === "day" || scale === "week") {
    for (let d = range.start; d <= range.end; d = addDays(d, 1)) {
      const [, m, day] = ymd(d);
      if (scale === "day") {
        out.push({ date: d, label: day === 1 ? `${m}/${day}` : String(day), yearStart: m === 1 && day === 1, weekend: isWeekend(d) });
      } else if (weekday(d) === 1) {
        // 1 月 1 日を含む週の月曜に年の境目を付ける
        out.push({ date: d, label: `${m}/${day}`, yearStart: ymd(addDays(d, 6))[0] !== ymd(d)[0] || (m === 1 && day === 1), weekend: false });
      }
    }
    return out;
  }
  const step = scale === "quarter" ? 3 : 1;
  let [y, m] = ymd(range.start);
  if (step === 3) m = Math.floor((m - 1) / 3) * 3 + 1; // 範囲開始を含む四半期の頭から
  for (; monthFirst(y, m) <= range.end; m += step) {
    if (m > 12) { y += 1; m -= 12; }
    const first = monthFirst(y, m);
    if (first > range.end) break;
    const label = scale === "quarter" ? `${y} Q${Math.floor((m - 1) / 3) + 1}` : m === 1 ? `${y}/${m}` : `${m}月`;
    // 範囲開始より前の月初は、範囲開始の位置に寄せる
    out.push({ date: first < range.start ? range.start : first, label, yearStart: m === 1, weekend: false });
  }
  return out;
}

function projectProgress(data, projectId) {
  const ts = data.tasks.filter((t) => t.projectId === projectId && t.status !== "Cancelled");
  const done = ts.filter((t) => t.status === "Done").length;
  return { done, total: ts.length, rate: ts.length ? done / ts.length : 0 };
}

function taskFlags(task, today, settings) {
  const flags = [];
  const open = task.status !== "Done" && task.status !== "Cancelled";
  if (open && task.due < today) flags.push("overdue");
  const long = settings?.waitingLongDays ?? 7;
  if (task.status === "Waiting" && task.waitingOn && isDate(task.waitingOn.since) && diffDays(today, task.waitingOn.since) >= long) flags.push("waiting-long");
  return flags;
}

function projectFlags(data, projectId, today) {
  const p = data.projects.find((x) => x.id === projectId);
  const all = data.tasks.filter((t) => t.projectId === projectId).flatMap((t) => taskFlags(t, today, data.settings));
  const flags = [];
  if (all.includes("overdue")) flags.push("overdue-tasks");
  if (all.includes("waiting-long")) flags.push("waiting-long");
  if (p.due < today && !["完了", "中止"].includes(p.status)) flags.push("past-due");
  return flags;
}

return { taskStart, ganttRows, ganttLayout, timeTicks, projectProgress, taskFlags, projectFlags };
})();

/* src/core/sessions.js */
const { sessionKind, addSession, moveSession, resizeSession, confirmSession, removeSession, taskActual, projectActualHours, futurePlanned } = (() => {
// 作業枠（予定／実績）の規則。枠は「作業した時間の記録」で、タスクの状態は変えない。すべて不変更新。


const MIN_LEN = 15;
const DEFAULT_WORKDAY = { start: "09:00", end: "18:00" };

const workdayOf = (data) => data.settings?.workday ?? DEFAULT_WORKDAY;
const allSessions = (data) => data.tasks.flatMap((t) => (t.sessions ?? []).map((s) => ({ ...s, taskId: t.id })));
const findSession = (data, id) => allSessions(data).find((s) => s.id === id);
const clash = (a, b) => a.date === b.date && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
const isPast = (slot, now) => slot.date < now.date || (slot.date === now.date && slot.end <= now.time);

/** 過ぎた予定は unconfirmed、実績は actual、それ以外は planned */
function sessionKind(session, now) {
  if (session.kind === "actual") return "actual";
  return isPast(session, now) ? "unconfirmed" : "planned";
}

const nextId = (data) => {
  const max = allSessions(data).reduce((m, s) => Math.max(m, +(/^S(\d+)$/.exec(s.id)?.[1] ?? 0)), 0);
  return `S${max + 1}`;
};

/** 枠の置き場所の検証。他の枠との重なりは error、会議との重なりは warning */
function check(data, slot, ignoreId) {
  const wd = workdayOf(data);
  const [s, e] = [toMin(slot.start), toMin(slot.end)];
  if (e <= s) return { error: "終了は開始より後にしてください" };
  if (e - s < MIN_LEN) return { error: `枠は${MIN_LEN}分以上にしてください` };
  if (s < toMin(wd.start) || e > toMin(wd.end)) return { error: `勤務時間（${wd.start}〜${wd.end}）の中に置いてください` };
  if (isWeekend(slot.date)) return { error: "土日には置けません" };
  const other = allSessions(data).find((x) => x.id !== ignoreId && clash(x, slot));
  if (other) return { error: `他の枠（${other.start}〜${other.end}）と重なっています` };
  const mtg = (data.events ?? []).find((m) => !m.skip && clash(m, slot));
  return mtg ? { warning: `会議「${mtg.title}」（${mtg.start}〜${mtg.end}）と重なっています` } : {};
}

const withTask = (data, taskId, fn) => ({ ...data, tasks: data.tasks.map((t) => (t.id === taskId ? fn(t) : t)) });
const mapSessions = (data, id, fn) => ({
  ...data,
  tasks: data.tasks.map((t) => ((t.sessions ?? []).some((s) => s.id === id) ? { ...t, sessions: t.sessions.map((s) => (s.id === id ? fn(s) : s)) } : t)),
});

function addSession(data, taskId, slot, now) {
  if (!data.tasks.some((t) => t.id === taskId)) return { data, error: `タスク ${taskId} がありません` };
  const r = check(data, slot);
  if (r.error) return { data, error: r.error };
  const s = { id: nextId(data), date: slot.date, start: slot.start, end: slot.end, kind: isPast(slot, now) ? "actual" : "planned" };
  return { data: withTask(data, taskId, (t) => ({ ...t, sessions: [...(t.sessions ?? []), s] })), ...(r.warning && { warning: r.warning }) };
}

/** slot は { date, start }。長さは元のまま。種別は変えない（予定を過去へ動かしても未確認のまま） */
function moveSession(data, sessionId, slot, now) {
  const cur = findSession(data, sessionId);
  if (!cur) return { data, error: `枠 ${sessionId} がありません` };
  const len = toMin(cur.end) - toMin(cur.start);
  const next = { date: slot.date, start: slot.start, end: toHHMM(toMin(slot.start) + len) };
  if (toMin(slot.start) + len > 24 * 60) return { data, error: "勤務時間の外になります" };
  const r = check(data, next, sessionId);
  if (r.error) return { data, error: r.error };
  // 実績の枠を未来へ動かしたら予定に戻す（未来の枠は実績にできない）
  const kind = cur.kind === "actual" && !isPast(next, now) ? "planned" : cur.kind;
  return { data: mapSessions(data, sessionId, (s) => ({ ...s, ...next, kind })), ...(r.warning && { warning: r.warning }) };
}

function resizeSession(data, sessionId, end, now) {
  const cur = findSession(data, sessionId);
  if (!cur) return { data, error: `枠 ${sessionId} がありません` };
  const r = check(data, { date: cur.date, start: cur.start, end }, sessionId);
  if (r.error) return { data, error: r.error };
  const kind = now && cur.kind === "actual" && !isPast({ date: cur.date, end }, now) ? "planned" : cur.kind;
  return { data: mapSessions(data, sessionId, (s) => ({ ...s, end, kind })) };
}

function confirmSession(data, sessionId, now) {
  const cur = findSession(data, sessionId);
  if (!cur) return { data, error: `枠 ${sessionId} がありません` };
  if (!isPast(cur, now)) return { data, error: "未来の枠は実績にできません" };
  return { data: mapSessions(data, sessionId, (s) => ({ ...s, kind: "actual" })) };
}

function removeSession(data, sessionId) {
  return { ...data, tasks: data.tasks.map((t) => ((t.sessions ?? []).some((s) => s.id === sessionId) ? { ...t, sessions: t.sessions.filter((s) => s.id !== sessionId) } : t)) };
}

function taskActual(data, taskId) {
  const t = data.tasks.find((x) => x.id === taskId);
  const ss = t?.sessions ?? [];
  const actual = ss.filter((s) => s.kind === "actual");
  const minutes = actual.reduce((sum, s) => sum + toMin(s.end) - toMin(s.start), 0);
  return { hours: minutes / 60, firstDate: actual.length ? actual.map((s) => s.date).sort()[0] : null, count: ss.length };
}

function projectActualHours(data, projectId) {
  return data.tasks.filter((t) => t.projectId === projectId).reduce((h, t) => h + taskActual(data, t.id).hours, 0);
}

/** 未来の予定枠の ID（終了した枠や実績は含まない） */
function futurePlanned(data, taskId, now) {
  const t = data.tasks.find((x) => x.id === taskId);
  return (t?.sessions ?? []).filter((s) => s.kind === "planned" && !isPast(s, now)).map((s) => s.id);
}

return { sessionKind, addSession, moveSession, resizeSession, confirmSession, removeSession, taskActual, projectActualHours, futurePlanned };
})();

/* src/core/impact.js */
const { computeImpact, needsReplan, applyReplan } = (() => {
// タスクの期限が動いたときの影響範囲。後続は「最小限だけ」動かす（先行の新しい期限を超えないようにする）。



const closed = (t) => t.status === "Done" || t.status === "Cancelled";

/**
 * opts.compress: 前倒し(deltaDays < 0)のとき、後続も同じ日数だけ前倒しする(先行の新しい期限より前にはしない)
 */
function computeImpact(data, taskId, deltaDays, { compress = false } = {}) {
  const byId = new Map(data.tasks.map((t) => [t.id, t]));
  const target = byId.get(taskId);
  if (!target) throw new Error(`タスク ${taskId} がありません`);

  const successors = new Map(); // 先行ID → 後続タスクの配列
  for (const t of data.tasks) {
    for (const p of t.predecessors ?? []) {
      if (!successors.has(p)) successors.set(p, []);
      successors.get(p).push(t);
    }
  }

  const newDue = new Map([[taskId, addDays(target.due, deltaDays)]]);
  const reason = new Map();
  const queue = [taskId];
  if (compress && deltaDays < 0) {
    // 期限は減る方向にしか更新しないので、循環があっても止まる
    while (queue.length) {
      const cur = queue.shift();
      for (const s of successors.get(cur) ?? []) {
        if (s.id === taskId || closed(s)) continue;
        const lower = s.predecessors.map((p) => newDue.get(p) ?? byId.get(p)?.due).filter(Boolean).reduce((a, b) => (a > b ? a : b), "");
        const shifted = addDays(s.due, deltaDays);
        const cand = lower > shifted ? lower : shifted;
        if (cand < (newDue.get(s.id) ?? s.due)) {
          newDue.set(s.id, cand);
          reason.set(s.id, `先行 ${cur} の前倒し`);
          queue.push(s.id);
        }
      }
    }
    queue.length = 0;
  }
  // 期限は増える方向にしか更新しないので、循環があっても既存の期限の最大値で止まる
  while (queue.length) {
    const cur = queue.shift();
    for (const s of successors.get(cur) ?? []) {
      if (s.id === taskId || closed(s)) continue;
      let best = s.due;
      let by = null;
      for (const p of s.predecessors) {
        const d = newDue.get(p); // 動いた先行だけが対象（元からの不整合は直さない）
        if (d && d > best) { best = d; by = p; }
      }
      if (best > (newDue.get(s.id) ?? s.due)) {
        newDue.set(s.id, best);
        reason.set(s.id, `先行 ${by} の遅れ`);
        queue.push(s.id);
      }
    }
  }

  const changes = [...newDue].map(([id, nd]) => ({
    taskId: id,
    oldDue: byId.get(id).due,
    newDue: nd,
    reason: id === taskId ? `指定（${deltaDays >= 0 ? "+" : ""}${deltaDays}日）` : reason.get(id),
  })).filter((c) => c.oldDue !== c.newDue || c.taskId === taskId);

  const projectDueExceeded = [];
  for (const p of data.projects ?? []) {
    const latest = data.tasks.filter((t) => t.projectId === p.id).map((t) => newDue.get(t.id) ?? t.due)
      .reduce((a, b) => (a > b ? a : b), "");
    const moved = changes.some((c) => byId.get(c.taskId).projectId === p.id && c.newDue > p.due);
    if (moved) projectDueExceeded.push({ projectId: p.id, due: p.due, latestTaskDue: latest });
  }
  return { changes, projectDueExceeded };
}

/** 後続が動く、またはプロジェクト期限を超えるなら、利用者に確認してから反映する */
function needsReplan(impact) {
  return impact.changes.length > 1 || impact.projectDueExceeded.length > 0;
}

/**
 * impact の変更を due に反映し、changeLog に日程変更の記録を足す。extra は記録に足す項目(source・messageIds など)
 */
function applyReplan(data, impact, { reason, cause, deltaDays, at, extra = {} }) {
  if (!String(reason ?? "").trim()) throw new Error("理由を入力してください");
  if (!CAUSES.includes(cause)) throw new Error(`原因は ${CAUSES.join("・")} のいずれかにしてください`);
  const to = new Map(impact.changes.map((c) => [c.taskId, c.newDue]));
  return {
    ...data,
    tasks: data.tasks.map((t) => (to.has(t.id) ? { ...t, due: to.get(t.id) } : t)),
    changeLog: [...(data.changeLog ?? []), { at, taskIds: impact.changes.map((c) => c.taskId), reason: String(reason).trim(), cause, deltaDays, ...extra }],
  };
}

return { computeImpact, needsReplan, applyReplan };
})();

/* src/core/rules.js */
const { matchProject, assignMeetingProjects, setProjectRule, removeProjectRule } = (() => {
// 会議のプロジェクト規則（件名のキーワード → プロジェクト）。すべて不変更新。
// 手動で付けたもの（projectBy: "manual"）は、規則の再適用で変えない。

/** text が keyword を含む最初の規則の projectId。大文字小文字は区別せず、空の keyword は無視する */
function matchProject(text, rules) {
  const t = String(text ?? "").toLowerCase();
  for (const r of rules ?? []) {
    const k = String(r?.keyword ?? "").trim().toLowerCase();
    if (k && t.includes(k)) return r.projectId;
  }
  return null;
}

/** 手動以外の会議に、規則でプロジェクトを付け直す（当たらなければ、規則で付けた分だけ外す）。存在しないプロジェクトの規則は無視する */
function assignMeetingProjects(data) {
  const ids = new Set((data.projects ?? []).map((p) => p.id));
  const rules = (data.settings?.projectRules ?? []).filter((r) => ids.has(r.projectId));
  const events = (data.events ?? []).map((e) => {
    // 手動、または projectBy の無い projectId（手で書かれたもの）は変えない
    if (e.projectBy === "manual" || (e.projectBy === undefined && e.projectId)) return e;
    const m = matchProject(e.title, rules);
    if (m) return e.projectId === m && e.projectBy === "rule" ? e : { ...e, projectId: m, projectBy: "rule" };
    if (e.projectBy === undefined) return e;
    const { projectBy, ...rest } = e;
    void projectBy;
    return { ...rest, projectId: null };
  });
  return { ...data, events };
}

const sameKey = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

/** 規則を追加（同じ keyword なら置き換え）して、会議へ反映する */
function setProjectRule(data, keyword, projectId) {
  const k = String(keyword ?? "").trim();
  if (!k) throw new Error("キーワードを入力してください");
  if (!(data.projects ?? []).some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);
  const rules = data.settings?.projectRules ?? [];
  const next = rules.some((r) => sameKey(r.keyword, k))
    ? rules.map((r) => (sameKey(r.keyword, k) ? { keyword: k, projectId } : r))
    : [...rules, { keyword: k, projectId }];
  return assignMeetingProjects({ ...data, settings: { ...data.settings, projectRules: next } });
}

/** 規則を消して、会議へ反映する（手動のひも付けは残る） */
function removeProjectRule(data, keyword) {
  const rules = (data.settings?.projectRules ?? []).filter((r) => !sameKey(r.keyword, keyword));
  return assignMeetingProjects({ ...data, settings: { ...data.settings, projectRules: rules } });
}

return { matchProject, assignMeetingProjects, setProjectRule, removeProjectRule };
})();

/* src/core/schedule.js */
const { freeSlots, rankTasks, addMeeting, updateMeeting, meetingKind, confirmMeeting, deleteMeeting, syncMcpEvents } = (() => {
// 空き時間・優先順位・会議の操作（純関数、不変更新）



const DEFAULT_WORKDAY = { start: "09:00", end: "18:00" };
const closed = (t) => t.status === "Done" || t.status === "Cancelled";

/** 対象日の空き時間。skip の会議は無視し、重なりを統合して勤務時間内に切り詰める */
function freeSlots(events, date, workday = DEFAULT_WORKDAY) {
  const [ws, we] = [toMin(workday.start), toMin(workday.end)];
  const busy = events
    .filter((e) => e.date === date && !e.skip)
    .map((e) => [Math.max(ws, toMin(e.start)), Math.min(we, toMin(e.end))])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  const out = [];
  let cur = ws;
  for (const [s, e] of busy) {
    if (s > cur) out.push({ start: toHHMM(cur), end: toHHMM(s) });
    cur = Math.max(cur, e);
  }
  if (cur < we) out.push({ start: toHHMM(cur), end: toHHMM(we) });
  return out;
}

/** このタスクを（推移的に）先行とする未完了タスクの数。循環でも終了する */
function openDownstream(tasks, id) {
  const next = new Map();
  for (const t of tasks) for (const p of t.predecessors ?? []) next.set(p, [...(next.get(p) ?? []), t]);
  const seen = new Set([id]);
  const stack = [id];
  let n = 0;
  while (stack.length) {
    for (const t of next.get(stack.pop()) ?? []) {
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      stack.push(t.id);
      if (!closed(t)) n++;
    }
  }
  return n;
}

/**
 * 今日の優先。対象は Done/Cancelled 以外で、先行がすべて完了しているもの。
 * 点数 = 期限超過 100 + max(0,14-日数)×3 + 後続の未完了 1 件ごとに 10 + 重要度(高12/中・未設定4/低0) + Waiting 15
 */
function rankTasks(data, today) {
  const byId = new Map(data.tasks.map((t) => [t.id, t]));
  const out = [];
  for (const t of data.tasks) {
    if (closed(t)) continue;
    if ((t.predecessors ?? []).some((p) => byId.has(p) && !closed(byId.get(p)))) continue;
    const left = diffDays(t.due, today);
    const reasons = [];
    let score = 0;
    if (left < 0) { score += 100; reasons.push(`期限超過 ${-left}日`); }
    score += Math.max(0, 14 - left) * 3;
    if (left >= 0 && left <= 14) reasons.push(left === 0 ? "期限は今日" : `期限まで ${left}日`);
    const blocked = openDownstream(data.tasks, t.id);
    score += blocked * 10;
    if (blocked) reasons.push(`後続 ${blocked} 件を止めている`);
    score += t.importance === "high" ? 12 : t.importance === "low" ? 0 : 4;
    if (t.importance === "high") reasons.push("重要度: 高");
    let action = "work";
    if (t.status === "Waiting") {
      action = "chase";
      score += 15;
      const w = t.waitingOn;
      reasons.unshift(w ? `${w.party} への${left < 0 ? "催促" : "確認"}${isDate(w.since) ? `（回答待ち ${diffDays(today, w.since)}日）` : ""}` : "待ち先が未設定");
    }
    out.push({ taskId: t.id, score, reasons, action, due: t.due });
  }
  return out.sort((a, b) => b.score - a.score || (a.due < b.due ? -1 : a.due > b.due ? 1 : a.taskId < b.taskId ? -1 : 1));
}

// ---- 会議の操作 ----
const maxMeetingNo = (events) => events.reduce((m, e) => Math.max(m, +(/^m(\d+)$/.exec(e.id)?.[1] ?? 0)), 0);
const nextMeetingId = (events) => `m${maxMeetingNo(events) + 1}`;

function assertTimes(m) {
  if (!isDate(m.date) || !isTime(m.start) || !isTime(m.end)) throw new Error("日付または時刻の形式が不正です");
  if (toMin(m.end) <= toMin(m.start)) throw new Error("終了は開始より後にしてください");
}

function addMeeting(data, m) {
  assertTimes(m);
  const id = nextMeetingId(data.events);
  const e = { id, date: m.date, start: m.start, end: m.end, title: (m.title ?? "").trim() || "会議", source: "manual", skip: !!m.skip, externalId: null, confirmed: false, projectId: null };
  if (m.projectId) {
    if (!(data.projects ?? []).some((p) => p.id === m.projectId)) throw new Error(`プロジェクト ${m.projectId} がありません`);
    e.projectId = m.projectId;
    e.projectBy = "manual";
  }
  return { data: { ...data, events: [...data.events, e] }, id };
}

function updateMeeting(data, id, patch) {
  const cur = data.events.find((e) => e.id === id);
  if (!cur) throw new Error(`会議 ${id} がありません`);
  const common = ["skip", "projectId", "confirmed"];
  const allowed = cur.source === "manual" ? ["title", "date", "start", "end", ...common] : common;
  for (const k of Object.keys(patch)) {
    if (!allowed.includes(k) && patch[k] !== cur[k]) throw new Error(`この会議は ${k} を変更できません（予定表から取得した会議は「参加しない」のみ）`);
  }
  const next = { ...cur, ...Object.fromEntries(Object.entries(patch).filter(([k]) => allowed.includes(k) && k !== "projectId")) };
  if (cur.source === "manual") { assertTimes(next); next.title = (next.title ?? "").trim() || "会議"; }
  let auto = false;
  if ("projectId" in patch) {
    if (patch.projectId === "" || patch.projectId == null) { delete next.projectBy; next.projectId = null; auto = true; }
    else {
      if (!(data.projects ?? []).some((p) => p.id === patch.projectId)) throw new Error(`プロジェクト ${patch.projectId} がありません`);
      next.projectId = patch.projectId;
      next.projectBy = "manual";
    }
  }
  const out = { ...data, events: data.events.map((e) => (e.id === id ? next : e)) };
  return auto ? assignMeetingProjects(out) : out;
}

const meetingPast = (m, now) => m.date < now.date || (m.date === now.date && m.end <= now.time);

/** 会議の状態: 参加しない=skipped / 確認済み=actual / 過ぎて未確認=unconfirmed / それ以外=planned */
function meetingKind(m, now) {
  if (m.skip) return "skipped";
  if (m.confirmed === true) return "actual";
  return meetingPast(m, now) ? "unconfirmed" : "planned";
}

/** 過ぎた会議を実績として確認する。未来の会議と、参加しない会議は確認できない */
function confirmMeeting(data, id, now) {
  const cur = data.events.find((e) => e.id === id);
  if (!cur) throw new Error(`会議 ${id} がありません`);
  if (cur.skip) throw new Error("参加しない会議は実績にできません");
  if (!meetingPast(cur, now)) throw new Error("未来の会議は実績にできません");
  return { ...data, events: data.events.map((e) => (e.id === id ? { ...e, confirmed: true } : e)) };
}

function deleteMeeting(data, id) {
  const cur = data.events.find((e) => e.id === id);
  if (!cur) throw new Error(`会議 ${id} がありません`);
  if (cur.source !== "manual") throw new Error("予定表から取得した会議は削除できません（「参加しない」にしてください）");
  return { ...data, events: data.events.filter((e) => e.id !== id) };
}

/** 取得結果で、range 内の MCP 由来の会議だけを追加・更新・削除する。skip と手入力の会議は保つ */
function syncMcpEvents(data, fetched, range) {
  const inRange = (d) => d >= range.start && d <= range.end;
  fetched = fetched.filter((f, k) => fetched.findIndex((x) => x.externalId === f.externalId) === k); // 同じ externalId は 1 件
  let seq = maxMeetingNo(data.events); // 消えた会議の ID を使い回さない
  const seen = new Set(fetched.map((f) => f.externalId));
  const existing = new Map(data.events.filter((e) => e.source === "mcp").map((e) => [e.externalId, e]));
  const kept = data.events.filter((e) => e.source !== "mcp" || seen.has(e.externalId) || !inRange(e.date));
  const events = kept.map((e) => {
    const f = e.source === "mcp" ? fetched.find((x) => x.externalId === e.externalId) : null;
    return f ? { ...e, title: f.title, date: f.date, start: f.start, end: f.end } : e;
  });
  for (const f of fetched) {
    if (existing.has(f.externalId)) continue;
    events.push({ id: `m${++seq}`, date: f.date, start: f.start, end: f.end, title: f.title, source: "mcp", skip: false, externalId: f.externalId });
  }
  return { ...data, events };
}

return { freeSlots, rankTasks, addMeeting, updateMeeting, meetingKind, confirmMeeting, deleteMeeting, syncMcpEvents };
})();

/* src/core/workload.js */
const { projectHours, workload, periodRange } = (() => {
// 稼働の集計（純関数）: 実績の作業枠（タスク）と、確認済みで参加する会議の時間をプロジェクト別に集める。




const hours = (x) => (toMin(x.end) - toMin(x.start)) / 60;
const inRange = (d, r) => !r || (d >= r.start && d <= r.end);
const sumBy = (list, f) => list.reduce((a, x) => a + f(x), 0);

const actualSessions = (data, range) =>
  data.tasks.flatMap((t) => (t.sessions ?? []).filter((s) => s.kind === "actual" && inRange(s.date, range)).map((s) => ({ ...s, projectId: t.projectId })));
const countedMeetings = (data, range) => (data.events ?? []).filter((m) => m.confirmed === true && !m.skip && inRange(m.date, range));

/** 全期間の、プロジェクトの稼働時間（h）: タスク（実績の作業枠）と会議（確認済み・参加するもの） */
function projectHours(data, projectId) {
  return {
    task: sumBy(actualSessions(data).filter((s) => s.projectId === projectId), hours),
    meeting: sumBy(countedMeetings(data).filter((m) => m.projectId === projectId), hours),
  };
}

/**
 * 期間内の稼働。rows は data.projects の順（0 時間でも出す）。unassigned はプロジェクト未設定（または存在しない）の会議。
 * unconfirmed は、期間内で過ぎたのに未確認の作業枠と会議の件数（now があるときだけ数える）
 */
function workload(data, range, now) {
  const ids = new Set(data.projects.map((p) => p.id));
  const sessions = actualSessions(data, range);
  const meetings = countedMeetings(data, range);
  const rows = data.projects.map((p) => {
    const task = sumBy(sessions.filter((s) => s.projectId === p.id), hours);
    const meeting = sumBy(meetings.filter((m) => m.projectId === p.id), hours);
    return { projectId: p.id, task, meeting, total: task + meeting };
  });
  const unassigned = sumBy(meetings.filter((m) => !ids.has(m.projectId)), hours);
  let unconfirmed = 0;
  if (now) {
    unconfirmed += data.tasks.flatMap((t) => t.sessions ?? []).filter((s) => inRange(s.date, range) && sessionKind(s, now) === "unconfirmed").length;
    unconfirmed += (data.events ?? []).filter((m) => inRange(m.date, range) && meetingKind(m, now) === "unconfirmed").length;
  }
  return { rows, unassigned, total: sumBy(rows, (r) => r.total) + unassigned, unconfirmed };
}

/** 週（月曜〜日曜）または月（月初〜月末）の範囲 */
function periodRange(period, date) {
  if (period === "week") {
    const start = addDays(date, -((weekday(date) + 6) % 7));
    return { start, end: addDays(start, 6) };
  }
  const [y, m] = date.split("-").map(Number);
  const start = `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-01`;
  const next = m === 12 ? `${String(y + 1).padStart(4, "0")}-01-01` : `${String(y).padStart(4, "0")}-${String(m + 1).padStart(2, "0")}-01`;
  return { start, end: addDays(next, -1) };
}

return { projectHours, workload, periodRange };
})();

/* src/ui/store.js */
const { createStore } = (() => {
// データファイル(JSON)の読み書き。File System Access API を使い、選んだファイルのハンドルを IndexedDB に覚える。
// 保存前に更新日時を比べ、他（Claude Code など）が更新していたら上書きせず conflict を返す。

const KEY = "dataFileHandle";
const PICKER_TYPES = [{ description: "プロジェクトデータ (JSON)", accept: { "application/json": [".json"] } }];

/** 既定の IndexedDB 保存先（使えない環境では記憶しないだけ） */
function defaultIdb() {
  const open = () => new Promise((resolve, reject) => {
    const req = indexedDB.open("pj-lens", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const req = fn(db.transaction("kv", mode).objectStore("kv"));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  };
  return {
    get: (k) => run("readonly", (s) => s.get(k)).catch(() => undefined),
    set: (k, v) => run("readwrite", (s) => s.put(v, k)).catch(() => undefined),
  };
}

function createStore(deps = {}) {
  const picker = deps.showOpenFilePicker ?? (typeof window !== "undefined" ? (o) => window.showOpenFilePicker(o) : null);
  const idb = deps.idb ?? defaultIdb();
  let handle = null;
  let loadedAt = null; // 読み込み（または直近の保存）時点のファイル更新日時

  async function ensureWritable(h) {
    try {
      if ((await h.queryPermission?.({ mode: "readwrite" })) === "granted") return true;
      return (await h.requestPermission?.({ mode: "readwrite" })) === "granted";
    } catch {
      return false;
    }
  }

  async function load() {
    const file = await handle.getFile();
    const data = JSON.parse(await file.text());
    loadedAt = file.lastModified;
    return data;
  }

  /** 保存済みのハンドルがあれば再利用し、なければファイル選択を出す */
  async function open() {
    const saved = await idb.get(KEY);
    if (saved && (await ensureWritable(saved))) {
      handle = saved;
    } else {
      return choose();
    }
    return load();
  }

  /** 常にファイル選択を出す */
  async function choose() {
    if (!picker) throw new Error("このブラウザはファイルの直接保存に対応していません（Edge または Chrome を使ってください）");
    const [h] = await picker({ types: PICKER_TYPES, multiple: false });
    handle = h;
    await ensureWritable(h);
    await idb.set(KEY, h);
    return load();
  }

  async function reload() {
    if (!handle) throw new Error("ファイルが選ばれていません");
    return load();
  }

  async function save(data) {
    if (!handle) return { ok: false, reason: "error", message: "ファイルが選ばれていません" };
    try {
      const current = await handle.getFile();
      if (current.lastModified !== loadedAt) {
        return { ok: false, reason: "conflict", message: "他で更新されました。再読込してください" };
      }
      const w = await handle.createWritable();
      await w.write(JSON.stringify(data, null, 2) + "\n");
      await w.close();
      loadedAt = (await handle.getFile()).lastModified;
      return { ok: true };
    } catch (e) {
      const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
      return { ok: false, reason: denied ? "denied" : "error", message: denied ? "書き込みが許可されていません" : `保存に失敗しました: ${e?.message ?? e}` };
    }
  }

  return { open, choose, reload, save, get hasFile() { return !!handle; } };
}

return { createStore };
})();

const { esc, fmtMD, wdJa, hm, hh, STATUS_UI, statusDotHtml, flagPills } = (() => {
// 画面共通の小さな道具（HTML エスケープ、日付・時刻の表示、状態の見た目）。DOM には触れない。


const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/** 2026-10-20 → 10/20 */
const fmtMD = (d) => { const [, m, day] = d.split("-"); return `${+m}/${+day}`; };

const WD_JA = ["日", "月", "火", "水", "木", "金", "土"];
const wdJa = (d) => WD_JA[weekday(d)];

/** 分 → "9:05"（先頭の 0 なし） */
const hm = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;
/** 分 → "09:05" */
const hh = toHHMM;

/** タスク状態 → ドット／バーの CSS クラス */
const STATUS_UI = {
  "To Do": { dot: "s-todo", bar: "b-todo" },
  "In Progress": { dot: "s-prog", bar: "b-prog" },
  Waiting: { dot: "s-wait", bar: "b-wait" },
  Done: { dot: "s-done", bar: "b-done" },
  Cancelled: { dot: "s-cancel", bar: "b-cancel" },
};

const statusDotHtml = (task, late) =>
  `<span class="st"><i class="dot ${STATUS_UI[task.status]?.dot ?? ""}${late ? " is-late" : ""}"></i>${esc(task.status)}</span>`;

/** プロジェクトの遅延・リスクのバッジ */
function flagPills(data, projectId, today, flags) {
  const out = [];
  if (flags.includes("overdue-tasks")) {
    const n = data.tasks.filter((t) => t.projectId === projectId && t.status !== "Done" && t.status !== "Cancelled" && t.due < today).length;
    out.push(`<span class="pill late">期限超過 ${n}件</span>`);
  }
  if (flags.includes("waiting-long")) out.push(`<span class="pill wait">待ち長期化</span>`);
  if (flags.includes("past-due")) out.push(`<span class="pill late">プロジェクト期限超過</span>`);
  return out.join("");
}

return { esc, fmtMD, wdJa, hm, hh, STATUS_UI, statusDotHtml, flagPills };

/* src/ui/edit.js */
const { predecessorCandidates, updateTask, updateProject, addMilestone, updateMilestone, deleteMilestone, moveMilestone, moveTaskDates, moveProjectDates, addTaskQuick, addTask, deleteTask, addProject, deleteProject } = (() => {
// 画面からの編集（追加・削除・更新）。すべて不変更新で、不正な入力は例外にする（呼び出し側が理由を表示する）。




const mapTask = (data, id, fn) => {
  if (!data.tasks.some((t) => t.id === id)) throw new Error(`タスク ${id} がありません`);
  return { ...data, tasks: data.tasks.map((t) => (t.id === id ? fn(t) : t)) };
};
const mapProject = (data, id, fn) => {
  if (!data.projects.some((p) => p.id === id)) throw new Error(`プロジェクト ${id} がありません`);
  return { ...data, projects: data.projects.map((p) => (p.id === id ? fn(p) : p)) };
};
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

/** このタスクの後続（推移的）の ID 集合 */
function downstream(data, id) {
  const down = new Set();
  const stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    for (const t of data.tasks) {
      if ((t.predecessors ?? []).includes(cur) && !down.has(t.id)) { down.add(t.id); stack.push(t.id); }
    }
  }
  return down;
}

/** 先行にできるタスク（同一プロジェクトで、自分・既に先行・自分の後続を除く。循環を作らせない） */
function predecessorCandidates(data, taskId) {
  const t = data.tasks.find((x) => x.id === taskId);
  const down = downstream(data, taskId);
  return data.tasks
    .filter((u) => u.projectId === t.projectId && u.id !== taskId && !(t.predecessors ?? []).includes(u.id) && !down.has(u.id))
    .map((u) => u.id);
}

/**
 * patch: title / status / due / start / importance / memo / predecessors / waitingOn
 * 状態を Done にすると doneAt に today、他へ戻すと null。Waiting は待ち先が必須で、外れると waitingOn は null。
 */
function updateTask(data, taskId, patch, today = nowLocal().date) {
  return mapTask(data, taskId, (t) => {
    const n = { ...t };
    if ("title" in patch) {
      const title = String(patch.title ?? "").trim();
      if (!title) throw new Error("件名を入力してください");
      n.title = title;
    }
    if ("due" in patch) {
      if (!isDate(patch.due)) throw new Error("期限は YYYY-MM-DD の形式で入力してください");
      n.due = patch.due;
    }
    if ("start" in patch) {
      if (patch.start != null && patch.start !== "" && !isDate(patch.start)) throw new Error("開始日は YYYY-MM-DD の形式で入力してください");
      n.start = patch.start || null;
    }
    if ("importance" in patch) {
      if (patch.importance != null && !IMPORTANCE.includes(patch.importance)) throw new Error(`不明な重要度です: ${patch.importance}`);
      n.importance = patch.importance ?? null;
    }
    if ("memo" in patch) n.memo = String(patch.memo ?? "");
    if ("predecessors" in patch) {
      const ids = [...new Set(patch.predecessors)];
      for (const id of ids) {
        if (!data.tasks.some((x) => x.id === id)) throw new Error(`先行 ${id} がありません`);
        if (id === taskId || downstream(data, taskId).has(id)) throw new Error(`${id} を先行にすると循環します`);
      }
      n.predecessors = ids;
    }
    if ("status" in patch) {
      if (!TASK_STATUS.includes(patch.status)) throw new Error(`不明な状態です: ${patch.status}`);
      n.status = patch.status;
      n.doneAt = patch.status === "Done" ? today : null;
    }
    if (n.status === "Waiting") {
      const w = "waitingOn" in patch ? patch.waitingOn : t.waitingOn;
      if (w && String(w.party ?? "").trim()) n.waitingOn = { party: String(w.party).trim(), since: w.since ?? t.waitingOn?.since ?? today };
      else if ("status" in patch || "waitingOn" in patch) throw new Error("Waiting にするときは待ち先を入力してください");
      else n.waitingOn = t.waitingOn; // 既存データの待ち先なしは、他の項目の編集を妨げない(validate が警告する)
    } else {
      n.waitingOn = null;
    }
    if (!n.predecessors?.length && n.start && n.start > n.due) throw new Error("開始日は期限以前にしてください");
    return n;
  });
}

/** patch: name / type / status / start / due */
function updateProject(data, projectId, patch) {
  return mapProject(data, projectId, (p) => {
    const n = { ...p };
    if ("name" in patch) {
      const name = String(patch.name ?? "").trim();
      if (!name) throw new Error("プロジェクト名を入力してください");
      n.name = name;
    }
    if ("type" in patch) {
      if (!PROJECT_TYPE.includes(patch.type)) throw new Error(`不明な種別です: ${patch.type}`);
      n.type = patch.type;
    }
    if ("status" in patch) {
      if (!PROJECT_STATUS.includes(patch.status)) throw new Error(`不明な状態です: ${patch.status}`);
      n.status = patch.status;
    }
    for (const k of ["start", "due"]) {
      if (k in patch) {
        if (!isDate(patch[k])) throw new Error("日付は YYYY-MM-DD の形式で入力してください");
        n[k] = patch[k];
      }
    }
    if (n.start > n.due) throw new Error("開始日は期限以前にしてください");
    return n;
  });
}

// ---- マイルストーン（日付昇順を保つ） ----
const sortedMs = (list) => [...list].sort(byDate);
const checkIndex = (p, index) => {
  if (!Number.isInteger(index) || index < 0 || index >= (p.milestones ?? []).length) throw new Error(`マイルストーン ${index} がありません`);
};

function addMilestone(data, projectId, m) {
  if (!isDate(m.date)) throw new Error("日付は YYYY-MM-DD の形式で入力してください");
  const name = String(m.name ?? "").trim() || "マイルストーン";
  return mapProject(data, projectId, (p) => ({ ...p, milestones: sortedMs([...(p.milestones ?? []), { name, date: m.date }]) }));
}

function updateMilestone(data, projectId, index, patch) {
  return mapProject(data, projectId, (p) => {
    checkIndex(p, index);
    const cur = p.milestones[index];
    const next = { name: cur.name, date: cur.date };
    if ("name" in patch) next.name = String(patch.name ?? "").trim() || cur.name;
    if ("date" in patch) {
      if (!isDate(patch.date)) throw new Error("日付は YYYY-MM-DD の形式で入力してください");
      next.date = patch.date;
    }
    return { ...p, milestones: sortedMs(p.milestones.map((m, i) => (i === index ? next : m))) };
  });
}

function deleteMilestone(data, projectId, index) {
  return mapProject(data, projectId, (p) => {
    checkIndex(p, index);
    return { ...p, milestones: p.milestones.filter((_, i) => i !== index) };
  });
}

function moveMilestone(data, projectId, index, days) {
  const cur = data.projects.find((p) => p.id === projectId)?.milestones?.[index];
  if (!cur) throw new Error(`マイルストーン ${index} がありません`);
  return updateMilestone(data, projectId, index, { date: addDays(cur.date, days) });
}

// ---- ガントのドラッグ ----
/** mode: "start" | "due" | "both"。先行があるタスクの開始は先行の期限から決まるので、動かせるのは期限だけ */
function moveTaskDates(data, taskId, mode, days) {
  const t = data.tasks.find((x) => x.id === taskId);
  if (!t) throw new Error(`タスク ${taskId} がありません`);
  if (!days) return { data };
  const hasPre = (t.predecessors ?? []).length > 0;
  if (hasPre && mode !== "due") return { data, error: "開始は先行タスクの期限から決まるため、動かせるのは期限だけです" };
  const patch = {};
  if (mode === "start" || mode === "both") patch.start = addDays(t.start ?? t.due, days);
  if (mode === "due" || mode === "both") patch.due = addDays(t.due, days);
  const due = patch.due ?? t.due;
  if (hasPre ? due < taskStart(data, taskId) : (patch.start ?? t.start ?? due) > due) {
    return { data, error: hasPre ? "期限を先行タスクの期限より前にはできません" : "開始日が期限より後になります" };
  }
  const next = mapTask(data, taskId, (x) => ({ ...x, ...patch }));
  const later = patch.due ? data.tasks.filter((u) => (u.predecessors ?? []).includes(taskId) && u.due < patch.due).map((u) => u.id) : [];
  return { data: next, ...(later.length && { warning: `後続 ${later.join(", ")} の期限より後になりました（replan で見直せます）` }) };
}

function moveProjectDates(data, projectId, edge, days) {
  const p = data.projects.find((x) => x.id === projectId);
  if (!p) throw new Error(`プロジェクト ${projectId} がありません`);
  const v = addDays(p[edge], days);
  if ((edge === "start" ? v > p.due : v < p.start)) return { data, error: "開始日が期限より後になります" };
  return { data: mapProject(data, projectId, (x) => ({ ...x, [edge]: v })) };
}

// ---- 追加・削除 ----
function nextTaskId(data, projectId) {
  let n = data.tasks.filter((t) => t.projectId === projectId).length + 1;
  while (data.tasks.some((t) => t.id === `${projectId}${n}`)) n++;
  return `${projectId}${n}`;
}

const newTask = (data, projectId, title, due, extra = {}) => ({
  id: nextTaskId(data, projectId), projectId, title, due, start: null, status: "To Do", memo: "",
  predecessors: [], waitingOn: null, importance: null, doneAt: null, sessions: [], ...extra,
});

function addTaskQuick(data, projectId, title, today = nowLocal().date) {
  const name = String(title ?? "").trim();
  if (!name) throw new Error("タスク名を入力してください");
  if (!data.projects.some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);
  return { ...data, tasks: [...data.tasks, newTask(data, projectId, name, addDays(today, 7))] };
}

function addTask(data, task) {
  if (!data.projects.some((p) => p.id === task.projectId)) throw new Error(`プロジェクト ${task.projectId} がありません`);
  const title = String(task.title ?? "").trim();
  if (!title) throw new Error("件名を入力してください");
  if (!isDate(task.due)) throw new Error("期限は YYYY-MM-DD の形式で入力してください");
  const { id, ...rest } = task;
  void id;
  return { ...data, tasks: [...data.tasks, newTask(data, task.projectId, title, task.due, { ...rest, title })] };
}

/** 他のタスクの先行になっていれば dependents を返し、force でなければ何も変えない。force なら参照を取り除いて削除する */
function deleteTask(data, taskId, { force = false } = {}) {
  if (!data.tasks.some((t) => t.id === taskId)) throw new Error(`タスク ${taskId} がありません`);
  const dependents = data.tasks.filter((t) => (t.predecessors ?? []).includes(taskId)).map((t) => t.id);
  if (dependents.length && !force) return { data, dependents };
  return {
    data: { ...data, tasks: data.tasks.filter((t) => t.id !== taskId).map((t) => ((t.predecessors ?? []).includes(taskId) ? { ...t, predecessors: t.predecessors.filter((p) => p !== taskId) } : t)) },
    dependents,
  };
}

function addProject(data, { name, type = "その他" }, today = nowLocal().date) {
  const n = String(name ?? "").trim();
  if (!n) throw new Error("プロジェクト名を入力してください");
  const used = new Set(data.projects.map((p) => p.id));
  let id = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].find((c) => !used.has(c));
  for (let i = 1; !id; i++) if (!used.has(`P${i}`)) id = `P${i}`;
  const p = { id, name: n, type, status: "計画中", start: today, due: addDays(today, 30), milestones: [] };
  return { ...data, projects: [...data.projects, p] };
}

function deleteProject(data, projectId) {
  if (!data.projects.some((p) => p.id === projectId)) throw new Error(`プロジェクト ${projectId} がありません`);
  const taskCount = data.tasks.filter((t) => t.projectId === projectId).length;
  return { data: { ...data, projects: data.projects.filter((p) => p.id !== projectId), tasks: data.tasks.filter((t) => t.projectId !== projectId) }, taskCount };
}

return { predecessorCandidates, updateTask, updateProject, addMilestone, updateMilestone, deleteMilestone, moveMilestone, moveTaskDates, moveProjectDates, addTaskQuick, addTask, deleteTask, addProject, deleteProject };
})();

/* src/ui/views/gantt.js */
const { GANTT_WINDOWS, renderGantt } = (() => {
// ガントチャート（画面とレポートで共用）。位置と幅はすべて範囲全体に対する % で表し、画面幅に追従させる。





const GANTT_WINDOWS = [["m1", "1か月"], ["m3", "3か月"], ["m6", "6か月"], ["y1", "1年"], ["all", "全期間"]];

const LEGEND = `<div class="legend"><span><i class="gbar b-todo" style="position:static;display:inline-block;width:22px;height:10px"></i>To Do</span><span><i class="gbar b-prog" style="position:static;display:inline-block;width:22px;height:10px"></i>In Progress</span><span><i class="gbar b-wait" style="position:static;display:inline-block;width:22px;height:10px"></i>Waiting</span><span><i class="gbar b-done" style="position:static;display:inline-block;width:22px;height:10px"></i>Done</span><span><i class="gbar gsum" style="position:static;display:inline-block;width:22px;height:8px"></i>プロジェクト全体</span><span><i class="ms" style="position:static;display:inline-block;transform:rotate(45deg);width:9px;height:9px"></i>マイルストーン</span><span><i class="gact" style="position:static;display:inline-block;width:22px;height:5px"></i>実績(最初の作業日〜完了日・今日)</span><span>開始日は、未入力なら先行タスクの期限から</span></div>`;

function tools(win, hideDone) {
  const seg = GANTT_WINDOWS.map(([k, l]) => `<button data-gwin="${k}" aria-pressed="${win === k}">${l}</button>`).join("");
  return `<div class="gtools"><span class="note">表示期間</span><div class="seg" role="group" aria-label="表示期間">${seg}</div><button class="chip-btn" data-hidedone aria-pressed="${hideDone}">完了を隠す</button><button class="chip-btn" data-gotoday>今日へ移動</button></div>`;
}

/**
 * @param opts.window    "m1" | "m3" | "m6" | "y1" | "all"
 * @param opts.hideDone  Done の行を隠す（全体バーの進捗には影響しない）
 * @param opts.readonly  true なら編集用の部品・属性を出さない（レポート用）
 * @param opts.askDel    削除確認を出すタスク ID
 */
function renderGantt(data, projectIds, today, opts = {}) {
  const { window: win = "m6", hideDone = false, readonly = false, askDel = null } = opts;
  const ps = projectIds.map((id) => data.projects.find((p) => p.id === id)).filter(Boolean);
  if (!ps.length || !data.tasks.some((t) => projectIds.includes(t.projectId))) {
    return `<p class="muted">タスクがありません。${readonly ? "" : "リスト表示で追加してください。"}</p>`;
  }

  const geo = new Map(ps.map((p) => [p.id, ganttRows(data, p.id, today)]));
  const starts = [...geo.values()].map((g) => g.range.start);
  const ends = [...geo.values()].map((g) => g.range.end);
  const s0 = [addDays(today, -10), ...starts].reduce((a, b) => (a < b ? a : b));
  const e0 = [addDays(today, 14), ...ends].reduce((a, b) => (a > b ? a : b));
  const range = { start: s0, end: e0 };
  const total = diffDays(e0, s0) + 1;
  const { visibleDays, ratio, scale } = ganttLayout(range, win);
  const dayScale = scale === "day";
  const x = (d) => `${((diffDays(d, s0) / total) * 100).toFixed(3)}%`;
  const ticks = timeTicks(range, scale);
  const laneW = `calc((100cqw - var(--lw) - 12px) * ${ratio.toFixed(4)})`;
  const laneStyle = `style="width:var(--lanew)"`;

  const axis = ticks
    .filter((t) => dayScale || Math.abs(diffDays(t.date, today)) > visibleDays * 0.045)
    .map((t) => `<span class="mono ${t.yearStart ? "yr" : ""} ${dayScale && t.date === today ? "tdy" : ""}" data-tick="${t.date}" style="left:${x(t.date)}">${esc(t.label)}${dayScale ? `<small>${wdJa(t.date)}</small>` : ""}</span>`)
    .join("");
  const grid = (dayScale ? ticks.filter((t) => t.weekend).map((t) => `<i class="gwk" style="left:${x(t.date)};width:${(100 / total).toFixed(3)}%"></i>`).join("") : "")
    + ticks.map((t) => `<i class="gl ${t.yearStart ? "yr" : ""}" style="left:${x(t.date)}"></i>`).join("");
  const todayLine = `<span class="todayline" style="left:${x(today)}"></span>`;

  const sections = ps.map((p) => {
    const g = geo.get(p.id);
    const prog = projectProgress(data, p.id);
    const pct = Math.round(prog.rate * 100);
    const flags = projectFlags(data, p.id, today);
    const ms = g.milestones;
    const msLines = ms.map((m) => `<i class="msl" style="left:${x(m.date)}"></i>`).join("");

    let prevPct = -99;
    let level = 0;
    const msItems = ms.map((m) => {
      const at = (diffDays(m.date, s0) / total) * 100;
      level = at - prevPct < 14 ? 1 - level : 0;
      prevPct = at;
      const idx = (p.milestones ?? []).findIndex((o) => o.name === m.name && o.date === m.date);
      const attr = readonly ? "" : ` data-gms="${esc(p.id)}|${idx}"`;
      return `<i class="ms"${attr} style="left:${x(m.date)};top:${level ? 24 : 6}px" title="${esc(m.name)} ${fmtMD(m.date)}${readonly ? "" : "(ドラッグで日付を変更)"}"></i><span class="ms-l" style="left:${x(m.date)};top:${level ? 20 : 2}px">${esc(m.name)} <b class="mono">${fmtMD(m.date)}</b></span>`;
    }).join("");
    const msRow = ms.length
      ? `<div class="g-row g-msrow"><div class="g-label"><span class="id"></span><span class="muted">マイルストーン</span></div><div class="g-lane" ${laneStyle}>${msItems}</div></div>`
      : "";

    const months = Math.max(1, Math.round(diffDays(p.due, p.start) / 30.4));
    const head = `<div class="pg-head"><div>${readonly ? `<strong>${esc(p.name)}</strong>` : `<button class="proj-name" data-filter="${esc(p.id)}">${esc(p.name)}</button>`}<div class="proj-meta"><span>${esc(p.type)}</span><span>${esc(p.status)}</span><span class="mono">${fmtMD(p.start)}〜${fmtMD(p.due)}(${months}か月)</span><span class="mono">${prog.done}/${prog.total} Done (${pct}%)</span><span class="mono">実績 ${projectActualHours(data, p.id).toFixed(1)}h</span>${flagPills(data, p.id, today, flags)}</div></div>${readonly ? "" : `<button class="btn" data-open="${esc(p.id)}">編集する</button>`}</div>`;

    const sumW = Math.max(0, (diffDays(p.due, p.start) / total) * 100).toFixed(3);
    const sumAttr = readonly ? "" : ` data-gp="${esc(p.id)}"`;
    const sumHandles = readonly ? "" : `<b class="gh l" data-gh="l"></b><b class="gh r" data-gh="r"></b>`;
    const sumRow = `<div class="g-row g-sumrow"><div class="g-label"><span class="id"></span><span class="muted">プロジェクト全体</span></div><div class="g-lane" ${laneStyle}><i class="gbar gsum"${sumAttr} style="left:${x(p.start)};width:${sumW}%;min-width:4px" title="${fmtMD(p.start)}〜${fmtMD(p.due)}${readonly ? "" : "(両端のドラッグで開始・期限を変更)"}"><u style="width:${pct}%"></u>${sumHandles}</i><span class="g-due mono" style="left:${x(p.due)}">${fmtMD(p.due)}</span></div></div>`;

    const rows = g.rows.filter((r) => {
      const t = data.tasks.find((o) => o.id === r.taskId);
      return !(hideDone && t.status === "Done");
    }).map((r) => {
      const t = data.tasks.find((o) => o.id === r.taskId);
      const late = taskFlags(t, today, data.settings).includes("overdue");
      const ui = STATUS_UI[t.status] ?? STATUS_UI["To Do"];
      const hasPre = (t.predecessors ?? []).length > 0;
      const gt = readonly ? "" : ` data-gt="${esc(t.id)}"`;
      const drag = readonly ? "" : " gdrag";
      const label = `${esc(t.id)} ${esc(t.title)} ${fmtMD(r.start)}〜${fmtMD(r.end)}`;
      const bar = r.point
        ? `<i class="dot mk${drag} ${ui.dot}${late ? " is-late" : ""}"${gt} style="left:${x(r.end)};top:13px" title="${label}${readonly ? "" : "(ドラッグで期限を変更)"}"></i>`
        : `<i class="gbar${drag}${hasPre ? " fixl" : ""} ${ui.bar}${late ? " is-late" : ""}"${gt} style="left:${x(r.start)};width:${((diffDays(r.end, r.start) / total) * 100).toFixed(3)}%;min-width:5px" title="${label}${readonly ? "" : hasPre ? "(開始は先行から決まります。右端のドラッグで期限を変更)" : "(ドラッグで移動、両端で開始・期限を変更)"}">${readonly ? "" : `${hasPre ? "" : '<b class="gh l" data-gh="l"></b>'}<b class="gh r" data-gh="r"></b>`}</i>`;
      const act = r.actual
        ? `<i class="gact" style="left:${x(r.actual.start)};width:${(Math.max(diffDays(r.actual.end, r.actual.start), 0) / total * 100).toFixed(3)}%;min-width:4px" title="実績 ${fmtMD(r.actual.start)}〜${fmtMD(r.actual.end)}"></i>`
        : "";
      const dependents = data.tasks.filter((o) => (o.predecessors ?? []).includes(t.id)).map((o) => o.id);
      let lab;
      if (!readonly && askDel === t.id) {
        lab = `<div class="g-label"><span class="id">${esc(t.id)}</span><div class="ask" style="grid-column:2/-1">${dependents.length ? `後続 ${esc(dependents.join(", "))} の先行から外れます。` : "このタスクを削除します。"}<div style="display:flex;gap:6px;margin-top:4px"><button class="btn danger" data-delyes="${esc(t.id)}">削除する</button><button class="btn" data-delno>やめる</button></div></div></div>`;
      } else {
        const name = readonly ? `<span class="g-name">${esc(t.title)}</span>` : `<button class="g-name" data-goto="${esc(t.id)}" title="リストで編集する">${esc(t.title)}</button>`;
        const del = readonly ? "" : `<button class="gx" data-del="${esc(t.id)}" aria-label="${esc(t.id)} を削除">×</button>`;
        lab = `<div class="g-label"><span class="id">${esc(t.id)}</span>${name}${del}<span class="g-pre">${hasPre ? "← " + esc(t.predecessors.join(", ")) : ""}</span></div>`;
      }
      return `<div class="g-row">${lab}<div class="g-lane" ${laneStyle}>${bar}${act}<span class="g-due mono" style="left:${x(r.end)}">${fmtMD(t.due)}</span></div></div>`;
    }).join("");

    const addRow = readonly ? "" : `<div class="g-row g-add"><div class="g-label"><input class="in" data-gadd="${esc(p.id)}" placeholder="＋ タスクを追加(名前を入力して Enter)" aria-label="${esc(p.name)} にタスクを追加"></div><div class="g-lane" ${laneStyle}></div></div>`;
    const headRow = `<div class="g-row g-head"><div class="g-label"></div><div class="g-lane g-axis ${dayScale ? "day" : ""}" ${laneStyle}>${dayScale ? "" : `<span class="todaytag" style="left:${x(today)}">今日</span>`}${axis}</div></div>`;

    return `<section class="pg" aria-label="${esc(p.name)}">${head}<div class="gbody" style="--lanew:${laneW}"><div class="gov under">${grid}</div><div class="gov over">${msLines}${todayLine}</div>${headRow}${msRow}${sumRow}${rows}${addRow}</div></section>`;
  }).join("");

  return `${readonly ? "" : tools(win, hideDone)}<div class="gscroll" data-todayfrac="${(diffDays(today, s0) / total).toFixed(5)}" data-s0="${s0}" data-span="${total}"><div class="gwide">${sections}</div></div>${LEGEND}`;
}

return { GANTT_WINDOWS, renderGantt };
})();

/* src/ui/views/schedule.js */
const { snapStart, weekStartOf, calendarGeometry, renderCalendar, renderSchedule } = (() => {
// スケジュール画面（週／日）。位置と高さは勤務時間に対する % で表し、カレンダーの高さは CSS で画面に追従させる。






const DEFAULT_WORKDAY = { start: "09:00", end: "18:00" };
const SLOT_STEP = 15;

/** 15 分刻みに丸め、勤務時間内に収める（開始の分を返す） */
function snapStart(minutes, durationMin, workday = DEFAULT_WORKDAY) {
  const [ws, we] = [toMin(workday.start), toMin(workday.end)];
  return Math.max(ws, Math.min(Math.round(minutes / SLOT_STEP) * SLOT_STEP, we - durationMin));
}

const weekStartOf = (d) => addDays(d, -((weekday(d) + 6) % 7));

/** 勤務時間 → 位置計算（すべて % ） */
function calendarGeometry(data) {
  const wd = data.settings?.workday ?? DEFAULT_WORKDAY;
  const h0 = toMin(wd.start);
  const span = toMin(wd.end) - h0;
  const pc = (m) => ((m - h0) / span) * 100;
  return { wd, h0, span, pc, tp: (m) => `${pc(m).toFixed(3)}%`, ht: (a, b) => `calc(${(pc(b) - pc(a)).toFixed(3)}% - 2px)` };
}

const allSessions = (data) => data.tasks.flatMap((t) => (t.sessions ?? []).map((s) => ({ ...s, taskId: t.id, title: t.title })));
const hoursHtml = (g) => {
  let s = "";
  for (let h = Math.ceil(g.h0 / 60); h * 60 <= g.h0 + g.span; h++) s += `<div class="hour" style="top:${(((h * 60 - g.h0) / g.span) * 100).toFixed(3)}%"><span>${h}:00</span></div>`;
  return s;
};

function meetingBlocks(data, d, full, g, ctx) {
  return (data.events ?? []).filter((m) => m.date === d).map((m) => {
    const a = Math.max(toMin(m.start), g.h0);
    const b = Math.min(toMin(m.end), g.h0 + g.span);
    if (b <= a) return "";
    const manual = m.source === "manual";
    return `<div class="blk mtg ${m.skip ? "skip" : ""} ${ctx.selMtg === m.id ? "sel" : ""}" data-mtg="${esc(m.id)}" tabindex="0" ${manual ? `draggable="true" data-dragmtg="${esc(m.id)}"` : ""} style="top:${g.tp(a)};height:${g.ht(a, b)}" title="${esc(m.title)}${m.skip ? "(参加しない)" : ""}${manual ? "" : "(予定表から取得)"}"><span class="tm">${full ? `${m.start}-${m.end}` : m.start}${m.skip ? " 不参加" : ""}</span>${esc(m.title)}${manual ? `<i class="rz" data-rzm="${esc(m.id)}" aria-label="終了時刻を変更"></i>` : ""}</div>`;
  }).join("");
}

const KIND_CLS = { actual: "act", unconfirmed: "unconf", planned: "plan" };
const KIND_JA = { act: "実績", unconf: "未確認", plan: "予定" };

function sessionBlocks(data, d, full, g, ctx) {
  return allSessions(data).filter((s) => s.date === d).map((s) => {
    const kind = sessionKind(s, ctx.now);
    const c = KIND_CLS[kind];
    const confirm = full && kind === "unconfirmed" ? `<span class="bb"><button class="btn" data-confirm="${esc(s.id)}">実績にする</button></span>` : "";
    return `<div class="blk task ${c} ${ctx.selSess === s.id ? "sel" : ""}" draggable="true" tabindex="0" data-dragsess="${esc(s.id)}" style="top:${g.tp(toMin(s.start))};height:${g.ht(toMin(s.start), toMin(s.end))}" title="${esc(s.title)}(${KIND_JA[c]})"><span class="tm">${full ? `${s.start}-${s.end}` : s.start}${c === "act" ? " ✓" : c === "unconf" ? " 未確認" : ""}</span>${full ? `${esc(s.taskId)} ` : ""}${esc(s.title)}${confirm}<i class="rz" data-rz="${esc(s.id)}" aria-label="終了時刻を変更"></i></div>`;
  }).join("");
}

/** 会議と配置済みの枠を除いた空き時間 */
function freeOf(data, d, g) {
  if (isWeekend(d)) return [];
  const busy = [...(data.events ?? []), ...allSessions(data)].filter((x) => x.date === d);
  return freeSlots(busy, d, g.wd);
}

function meetingForm(data, ctx) {
  const draft = ctx.mtgDraft;
  const m = draft ?? (data.events ?? []).find((o) => o.id === ctx.selMtg);
  if (!m) return "";
  const isNew = !!draft;
  const lock = !isNew && m.source === "mcp" ? "disabled" : "";
  return `<div class="mtgform" role="group" aria-label="会議の${isNew ? "追加" : "編集"}">
    <label>件名<input class="in" data-mt="title" value="${esc(m.title)}" placeholder="会議名" style="min-width:200px" ${lock}></label>
    <label>日付<input class="in" type="date" data-mt="date" value="${esc(m.date)}" ${lock}></label>
    <label>開始<input class="in" type="time" step="900" data-mt="start" value="${esc(m.start)}" ${lock}></label>
    <label>終了<input class="in" type="time" step="900" data-mt="end" value="${esc(m.end)}" ${lock}></label>
    <label class="chk"><input type="checkbox" data-mt="skip" ${m.skip ? "checked" : ""}>参加しない(空き時間として扱う)</label>
    <div style="display:flex;gap:6px;align-items:center">${isNew ? `<button class="btn" data-mtgsave>追加</button><button class="btn" data-mtgcancel>キャンセル</button>` : `${m.source === "manual" ? `<button class="btn danger" data-delsel>会議を削除</button>` : ""}<button class="btn" data-mtgclose>閉じる</button>`}</div>
    ${!isNew && m.source === "manual" ? `<p class="note" style="flex-basis:100%;margin:0">カレンダー上でドラッグして移動（別の日へも）、下端をドラッグして長さを変えられます。</p>` : ""}${!isNew && m.source === "mcp" ? `<p class="note" style="flex-basis:100%;margin:0">予定表から取得した会議です。件名と時間は取得内容が正のため変更できません。出席しない会議は「参加しない」にします（削除しても、次の取得で戻ります）。</p>` : ""}
  </div>`;
}

/** カレンダー部分（週または日）＋凡例。会議の編集中はここだけを描き直す */
function renderCalendar(data, today, opts) {
  const { view = "week", date = today } = opts;
  const ctx = { now: opts.now ?? { date: today, time: "00:00" }, selSess: opts.selSess ?? null, selMtg: opts.selMtg ?? null };
  const g = calendarGeometry(data);
  let cal;
  if (view === "week") {
    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStartOf(date), i));
    const heads = days.map((d) => {
      const free = freeOf(data, d, g).reduce((a, x) => a + toMin(x.end) - toMin(x.start), 0);
      return `<button class="dh ${d === today ? "t" : ""}" data-day="${d}" aria-label="${fmtMD(d)}の1日表示">${fmtMD(d)}(${wdJa(d)})<small class="mono">${isWeekend(d) ? "—" : `空き ${(free / 60).toFixed(1)}h`}</small></button>`;
    }).join("");
    const cols = days.map((d) => `<div class="col dz ${d === today ? "today" : ""} ${isWeekend(d) ? "weekend" : ""}" data-date="${d}">${meetingBlocks(data, d, false, g, ctx)}${sessionBlocks(data, d, false, g, ctx)}</div>`).join("");
    const dues = days.map((d) => {
      const due = data.tasks.filter((t) => t.due === d && t.status !== "Done" && t.status !== "Cancelled");
      return `<div class="duecell">${due.map((t) => `<div style="display:flex;gap:6px;align-items:baseline"><i class="dot ${STATUS_UI[t.status].dot}${t.due < today ? " is-late" : ""}"></i><span>${esc(t.title)}</span></div>`).join("") || '<span class="muted">—</span>'}</div>`;
    }).join("");
    cal = `<div class="cal wk"><div class="week"><div></div>${heads}<div class="hrs">${hoursHtml(g)}</div>${cols}</div><div class="week" style="margin-top:8px"><div class="note" style="padding-top:6px">期限</div>${dues}</div></div>
      <p class="note" style="margin:8px 0 0">日付を押すと1日表示に切り替わります。枠をクリックして選び、「枠を削除」か Delete キーで削除できます。</p>`;
  } else {
    const free = freeOf(data, date, g).filter((x) => toMin(x.end) - toMin(x.start) >= 20);
    const fb = free.map((x) => `<button class="free" data-free="${toMin(x.start)}" style="top:calc(${g.pc(toMin(x.start)).toFixed(3)}% + 1px);height:calc(${(g.pc(toMin(x.end)) - g.pc(toMin(x.start))).toFixed(3)}% - 3px)" aria-label="空き ${x.start}から${x.end}">${x.start}-${x.end} 空き</button>`).join("");
    const nowLine = date === ctx.now.date && toMin(ctx.now.time) >= g.h0 && toMin(ctx.now.time) <= g.h0 + g.span ? `<span class="nowline" style="top:${g.tp(toMin(ctx.now.time))}" title="現在 ${ctx.now.time}"></span>` : "";
    cal = `<div class="cal"><div class="cal-grid">${hoursHtml(g)}<div class="cal-body dz" id="calbody" data-date="${date}">${meetingBlocks(data, date, true, g, ctx)}${sessionBlocks(data, date, true, g, ctx)}${fb}${nowLine}</div></div></div>`;
  }
  const day = view === "day";
  const legend = `<div class="slegend" aria-label="色の凡例"><span><i class="sw mtg"></i>会議</span><span><i class="sw skipsw"></i>参加しない会議</span><span><i class="sw plan"></i>予定</span><span><i class="sw act"></i>実績(✓)</span><span><i class="sw unconf"></i>未確認(過ぎた予定)</span>${day ? '<span><i class="sw free"></i>空き時間</span><span><i class="sw now"></i>現在時刻</span>' : ""}<span><i class="sw sel"></i>選択中</span></div>`;
  return cal + legend;
}

/**
 * @param opts.view      "week" | "day"
 * @param opts.date      表示する日（週表示ではその日を含む週）
 * @param opts.now       {date, time}  現在時刻（過ぎた予定の判定に使う）
 * @param opts.selSess   選択中の枠 ID / opts.selMtg 選択中の会議 ID / opts.mtgDraft 追加中の会議の下書き
 * @param opts.picked    選択中のタスク ID（キーボード配置用）
 */
function renderSchedule(data, today, opts) {
  const { view = "week", date = today } = opts;
  const now = opts.now ?? { date: today, time: "00:00" };
  const step = view === "week" ? 7 : 1;
  const days = view === "week" ? [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStartOf(date), i)) : [date];
  const title = view === "week" ? `${fmtMD(days[0])}〜${fmtMD(days[6])} の週` : `${fmtMD(date)}(${wdJa(date)})`;
  const inView = allSessions(data).filter((s) => days.includes(s.date));
  const kinds = inView.map((s) => sessionKind(s, now));
  const hours = inView.filter((s, i) => kinds[i] === "actual").reduce((a, s) => a + toMin(s.end) - toMin(s.start), 0) / 60;
  const planned = kinds.filter((k) => k === "planned").length;
  const unconf = kinds.filter((k) => k === "unconfirmed").length;
  const selSess = inView.find((s) => s.id === opts.selSess);
  const selMtg = (data.events ?? []).find((m) => m.id === opts.selMtg && days.includes(m.date));
  const delLabel = selSess ? `「${esc(selSess.title)}」の枠を削除` : selMtg && selMtg.source === "manual" ? `会議「${esc(selMtg.title)}」を削除` : "枠や会議を選んで削除";
  const delOk = !!selSess || (selMtg && selMtg.source === "manual");
  const calOpts = { ...opts, view, date, now, selSess: selSess?.id ?? null, selMtg: selMtg?.id ?? null };

  const nav = `<div class="toolbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" data-nav="${-step}" aria-label="前へ">←</button><button class="btn" data-nav="${step}" aria-label="次へ">→</button><button class="btn" data-sgoto>今日</button><strong style="margin-left:6px">${title}</strong></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" data-mtgadd>＋ 会議を追加</button><div class="seg" role="group" aria-label="表示"><button data-sview="week" aria-pressed="${view === "week"}">週</button><button data-sview="day" aria-pressed="${view === "day"}">日</button></div></div></div>
    <div class="summary"><span>実績 <b class="mono">${hours.toFixed(1)}時間</b></span><span>予定 <b class="mono">${planned}件</b></span>${unconf ? `<span class="pill wait">未確認 ${unconf}件</span><button class="btn" data-confirmall>未確認をすべて実績にする</button>` : ""}<button class="btn danger" data-delsel ${delOk ? "" : "disabled"}>${delLabel}</button></div>`;
  return `<div class="cols"><section class="panel">${nav}<div id="mtgslot">${meetingForm(data, { mtgDraft: opts.mtgDraft, selMtg: selMtg?.id })}</div><div id="calslot">${renderCalendar(data, today, calOpts)}</div></section>${renderPrio(data, today, { sched: true, picked: opts.picked })}</div>`;
}


return { snapStart, weekStartOf, calendarGeometry, renderCalendar, renderSchedule };
})();

/**
 * @param opts.filter  "all" か projectId
 * @param opts.view    "gantt" | "list"
 * @param opts.window  ガントの表示期間
 */
function renderProjects(data, today, opts = {}) {
  const { view = "gantt", hideDone = false } = opts;
  const addBtn = `<button class="btn" data-addproject>＋ プロジェクトを追加</button>`;
  if (!data.projects.length) {
    return `<div class="toolbar"><div></div>${addBtn}</div><section class="panel"><p class="muted" style="margin:0">プロジェクトがありません。「＋ プロジェクトを追加」から追加してください。</p></section>`;
  }
  const filter = opts.filter && data.projects.some((p) => p.id === opts.filter) ? opts.filter : "all";
  const ids = filter === "all" ? data.projects.map((p) => p.id) : [filter];
  const chips = [["all", "すべて"], ...data.projects.map((p) => [p.id, p.name])]
    .map(([k, l]) => `<button class="chip-btn" data-filter="${esc(k)}" aria-pressed="${filter === k}">${esc(l)}</button>`).join("");
  const body = view === "gantt"
    ? `<section class="panel"><h2 class="sr">ガントチャート</h2>${renderGantt(data, ids, today, { window: opts.window, hideDone, askDel: opts.askDel })}</section>`
    : `<div style="display:flex;flex-direction:column;gap:16px">${ids.map((id) => renderList(data, data.projects.find((p) => p.id === id), today, opts)).join("")}</div>`;
  return `<div class="toolbar"><div style="display:flex;gap:6px;flex-wrap:wrap" role="group" aria-label="プロジェクトで絞り込み">${chips}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${addBtn}<div class="seg" role="group" aria-label="表示"><button data-pview="gantt" aria-pressed="${view === "gantt"}">ガント</button><button data-pview="list" aria-pressed="${view === "list"}">リスト</button></div></div></div>
    <div class="cols">${body}${renderPrio(data, today, { sched: false })}</div>`;
}

return { renderProjects };
})();
